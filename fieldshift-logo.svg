<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 130" width="340" height="130" role="img" aria-label="FieldShift Research Institute — Advancing the Science of State">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8922a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2247;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1a3a;stop-opacity:1" />
    </linearGradient>
    <clipPath id="hexClip">
      <!-- Flat-top hexagon -->
      <polygon points="30,6 54,19 54,45 30,58 6,45 6,19"/>
    </clipPath>
  </defs>

  <!-- Royal blue background with rounded corners -->
  <rect x="0" y="0" width="340" height="130" rx="8" ry="8" fill="url(#bgGrad)"/>

  <!-- === HEXAGON EMBLEM === -->
  <!-- Hexagon fill -->
  <polygon points="30,6 54,19 54,45 30,58 6,45 6,19"
           fill="url(#hexGrad)"
           stroke="url(#goldGrad)"
           stroke-width="2"
           stroke-linejoin="round"
           transform="translate(11, 30)"/>

  <!-- Horizontal baseline rule inside hex -->
  <line x1="19" y1="83" x2="73" y2="83" stroke="#b8922a" stroke-width="0.8" opacity="0.5"/>

  <!-- Threshold shift curve inside hexagon -->
  <polyline points="19,90 27,90 31,62 49,62 53,90 61,90"
            fill="none"
            stroke="url(#goldGrad)"
            stroke-width="2.4"
            stroke-linejoin="round"
            stroke-linecap="round"
            clip-path="url(#hexClip)"
            transform="translate(11,30)"/>

  <!-- Inflection dot -->
  <circle cx="52" cy="62" r="2.6" fill="#e8c96e"/>

  <!-- S₂ label -->
  <text x="52" y="55" text-anchor="middle"
        font-family="Georgia,serif" font-size="7"
        fill="#e8c96e" opacity="0.8">S₂</text>

  <!-- === WORDMARK === -->
  <text x="94" y="52"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#f0ece4">Field<tspan fill="#e8c96e">Shift</tspan></text>

  <text x="94" y="70"
        font-family="'Source Sans 3', system-ui, sans-serif"
        font-size="11"
        font-weight="400"
        letter-spacing="0.12em"
        fill="#a8c4e8">RESEARCH INSTITUTE</text>

  <!-- Divider rule -->
  <line x1="94" y1="80" x2="326" y2="80"
        stroke="#b8922a" stroke-width="0.8" opacity="0.7"/>

  <!-- Motto -->
  <text x="94" y="96"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="10"
        font-style="italic"
        letter-spacing="0.03em"
        fill="#c8ddf5">Advancing the Science of State</text>
</svg>
