<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="FieldShift Research Institute — Advancing the Science of State">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8922a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <clipPath id="shieldClip">
      <!-- Shield shape: top corners, sides, taper to point -->
      <path d="M8 4 L52 4 L52 62 L30 76 L8 62 Z"/>
    </clipPath>
  </defs>

  <!-- === EMBLEM === -->
  <!-- Shield outline (gold border) -->
  <path d="M8 4 L52 4 L52 62 L30 76 L8 62 Z"
        fill="url(#shieldGrad)"
        stroke="url(#goldGrad)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Inner geometric mark: a field / threshold wave inside the shield -->
  <!-- Horizontal baseline rule -->
  <line x1="14" y1="44" x2="46" y2="44" stroke="#b8922a" stroke-width="1" opacity="0.5"/>

  <!-- Stylised threshold shift curve (the core concept) -->
  <polyline points="14,52 21,52 25,24 35,24 39,52 46,52"
            fill="none"
            stroke="url(#goldGrad)"
            stroke-width="2.6"
            stroke-linejoin="round"
            stroke-linecap="round"
            clip-path="url(#shieldClip)"/>

  <!-- Small threshold marker dot at inflection -->
  <circle cx="30" cy="24" r="2.8" fill="#e8c96e"/>

  <!-- Greek letter sigma / S mark – subtle, top of shield -->
  <text x="30" y="18" text-anchor="middle"
        font-family="Georgia,serif" font-size="7"
        fill="#e8c96e" opacity="0.7" letter-spacing="0">S₂</text>

  <!-- === WORDMARK === -->
  <!-- "FieldShift" -->
  <text x="66" y="34"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="22"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#f9f6f1">Field<tspan fill="#e8c96e">Shift</tspan></text>

  <!-- "Research Institute" -->
  <text x="66" y="52"
        font-family="'Source Sans 3', system-ui, sans-serif"
        font-size="11.5"
        font-weight="400"
        letter-spacing="0.04em"
        fill="#b0a898">RESEARCH INSTITUTE</text>

  <!-- Thin rule between wordmark and motto -->
  <line x1="66" y1="61" x2="308" y2="61"
        stroke="#b8922a" stroke-width="0.75" opacity="0.6"/>

  <!-- Motto -->
  <text x="66" y="74"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="9.5"
        font-style="italic"
        letter-spacing="0.03em"
        fill="#8a7d6a">Advancing the Science of State</text>
</svg>
