*{box-sizing:border-box}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

h3{font-size:15px;margin:18px 0 6px}
p{margin:6px 0;max-width:860px;color:var(--ink-soft)}
.lang{float:right;display:flex;gap:6px}
.lang button,.tabs button{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:var(--card);padding:6px 12px;border-radius:4px;cursor:pointer;color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}

.card .v{font-family:var(--serif);font-size:26px;margin:4px 0 2px}
.card .s{font-size:13px;color:var(--ink-soft)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--paper-3);text-align:right;white-space:nowrap}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);background:var(--paper-2)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{position:relative;height:10px;background:var(--paper-3);border-radius:5px;min-width:90px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--dem);border-radius:5px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule)}
.tag.hit{border-color:var(--ok);color:var(--ok)}.tag.miss{border-color:var(--bad);color:var(--bad)}
.note{font-size:13px;color:var(--ink-light)}
.filter{margin:8px 0;font-size:14px}
.filter input{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;width:180px}

  search:"Search district (e.g. TX-28)",onlyClose:"Show only close races (10–90%)",
  lockTxt:"Model output was hashed before the result was retrieved:",protTxt:"Protocol locked before data collection:",
  nodata:"The US run is not finished yet.",outcome:"Result"}};
var t=function(k){return T[LANG][k];};
var pct=function(x,d){return (x*100).toFixed(d==null?0:d).replace('.',LANG==='sv'?',':'.')+' %';};
var num=function(x,d){return x==null?'–':Number(x).toFixed(d==null?1:d).replace('.',LANG==='sv'?',':'.');};
var sgn=function(x,d){return (x>0?'+':'')+num(x,d);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var app=document.getElementById('app'), filt={q:'',close:true};

function sweden(){
 var S=V.sweden, h='<h2>'+t('tse')+'</h2><p>'+t('seLead')+'</p>';
 h+='<div class="banner">'+t('seVerdict')+'</div>';
 h+='<div class="cards">';
 ['opp','tido'].forEach(function(k){var b=S.blocs[k];
  h+='<div class="card"><div class="k">'+t(k)+' ≥ 175</div><div class="v">'+pct(b.P,1)+'</div><div class="s">'+t('fseats')+' '+num(b.fseats,1)+' · '+t('oseats')+' <b>'+b.oseats+'</b> · '+t('happened')+': <b>'+(b.happened?t('yes'):t('no'))+'</b></div></div>';});
 h+='<div class="card"><div class="k">'+t('mae')+'</div><div class="v">'+num(S.mae,2)+'</div><div class="s">'+t('rmse')+' '+num(S.rmse,2)+' · '+t('smae')+' '+num(S.seat_mae,1)+'</div></div>';
 h+='<div class="card"><div class="k">'+t('l4')+'</div><div class="v">'+pct(S.L4.P,1)+'</div><div class="s">'+t('happened')+': <b>'+(S.L4.happened?t('yes'):t('no'))+'</b></div></div></div>';
 h+='<div class="scroll"><table class="tbl"><thead><tr><th>'+t('party')+'</th><th>'+t('fv')+'</th><th>'+t('ov')+'</th><th>'+t('err')+'</th><th>'+t('fs')+'</th><th>'+t('os')+'</th></tr></thead><tbody>';
 S.rows.forEach(function(r){var e=r.ov-r.fv;h+='<tr><td><b>'+r.p+'</b></td><td>'+num(r.fv,2)+'</td><td>'+num(r.ov,2)+'</td><td class="'+(Math.abs(e)>2?'neg':'')+'">'+sgn(e,2)+'</td><td>'+num(r.fs,1)+'</td><td>'+r.os+'</td></tr>';});
 h+='</tbody></table></div><p class="note">'+t('l4txt')+'</p>';
 h+='<p class="note">Release '+S.release+' · cutoff '+S.cutoff+' · DOI '+S.doi+'</p>';
 h+='<p class="note">'+t('src')+': '+S.sources.slice(0,3).map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\//,'').split('/')[0])+'</a>';}).join(' · ')+'</p>';
 return h;
}
function usa(){
 var U=V.usa, h='<h2>'+t('tus')+'</h2><div class="banner red"><b>'+t('usBanner')+'</b></div><p>'+t('usLead')+'</p>';
 if(!U) return h+'<p>'+t('nodata')+'</p>';
 var X=U.VS;
 h+='<div class="cards">';
 if(X.P_house_D!=null) h+='<div class="card"><div class="k">'+t('house')+'</div><div class="v">'+pct(X.P_house_D)+'</div><div class="s">'+t('pD')+'<br>'+t('dseats')+': '+num(X.house_D_mean,0)+' ['+X.house_D_90.join('–')+'] / 435</div></div>';
 h+='<div class="card"><div class="k">'+t('senate')+'</div><div class="v">'+pct(X.P_senate_D)+'</div><div class="s">'+t('pD')+'<br>'+t('dseats')+': '+num(X.senate_D_mean,0)+' ['+X.senate_D_90.join('–')+'] / 100</div></div>';
 h+='<div class="card"><div class="k">'+t('gen')+'</div><div class="v">'+sgn(X.national_margin,1)+'</div><div class="s">90 %: '+sgn(X.national_margin_90[0],1)+' … '+sgn(X.national_margin_90[1],1)+'</div></div></div>';
 if(U.score&&U.score.outcome){var o=U.score.outcome;
  h+='<div class="banner"><b>'+t('outcome')+':</b> '+t('house')+' '+(o.house_D_control?'D':'R')+(o.house_D_seats!=null?' ('+o.house_D_seats+' D)':'')+' · '+t('senate')+' '+(o.senate_D_control?'D':'R')+(o.senate_D_seats!=null?' ('+o.senate_D_seats+' D)':'')+(o.house_vote_margin!=null?' · '+t('gen')+' '+sgn(o.house_vote_margin,1):'')+'</div>';}
 h+='<h3>'+t('models')+'</h3><div class="scroll"><table class="tbl"><thead><tr><th></th><th>'+t('house')+' P(D)</th><th>'+t('senate')+' P(D)</th>';
 var sc=U.score; if(sc) h+='<th>'+t('house')+' Brier</th><th>'+t('house')+' log</th><th>'+t('senate')+' Brier</th><th>'+t('senate')+' log</th>';
 h+='</tr></thead><tbody>';
 [['M0','m0'],['M1','m1'],['VS','vs']].forEach(function(m){var a=U[m[0]];
  h+='<tr><td>'+t(m[1])+'</td><td>'+(a.P_house_D==null?'–':pct(a.P_house_D))+'</td><td>'+pct(a.P_senate_D)+'</td>';
  if(sc){var s=sc[m[0]];h+='<td>'+num(s.house.brier,3)+'</td><td>'+num(s.house.log,3)+'</td><td>'+num(s.senate.brier,3)+'</td><td>'+num(s.senate.log,3)+'</td>';}
  h+='</tr>';});
 h+='</tbody></table></div>';
 if(sc) h+='<p><b>'+t('claim')+'</b> M0: '+(sc.claim_VS_better_than.M0?t('yes'):t('no'))+' · M1: '+(sc.claim_VS_better_than.M1?t('yes'):t('no'))+'. <span class="note">'+t('claimRule')+'</span></p>';
 if(sc&&sc.outcome){var mh=U.house.filter(function(r){return r.w&&((r.p>.5)!==(r.w==='D'));}),md=mh.filter(function(r){return r.w==='D';}).length;
  var ms=U.senate.filter(function(r){return r.w&&((r.p>.5)!==(r.w==='D'));});
  h+='<div class="banner">'+(LANG==='sv'
   ?'Rätt vinnare i båda kamrarna. Missar: '+mh.length+' av '+U.house.filter(function(r){return r.w;}).length+' husdistrikt ('+md+' av dem vanns av D) och '+ms.length+' av '+U.senate.length+' senatslopp ('+ms.map(function(r){return r.k;}).join(', ')+'). Mätningarna underskattade demokraternas våg: modellen väntade D '+sgn(X.national_margin,1)+', utfallet blev '+sgn(sc.outcome.house_vote_margin,1)+' (inofficiell räkning, '+String(sc.outcome.house_vote_asof).split(' (')[0]+').'
   :'Right winner in both chambers. Misses: '+mh.length+' of '+U.house.filter(function(r){return r.w;}).length+' House districts ('+md+' of them won by D) and '+ms.length+' of '+U.senate.length+' Senate races ('+ms.map(function(r){return r.k;}).join(', ')+'). Polls underestimated the Democratic wave: the model expected D '+sgn(X.national_margin,1)+', the result was '+sgn(sc.outcome.house_vote_margin,1)+' (unofficial count, '+String(sc.outcome.house_vote_asof).split(' (')[0]+').')+'</div>';}
 h+='<h3>'+t('senate')+'</h3>'+raceTable(U.senate,false);
 h+='<h3>'+t('house')+'</h3><div class="filter"><input id="q" placeholder="'+t('search')+'" value="'+esc(filt.q)+'"> <label><input type="checkbox" id="cl" '+(filt.close?'checked':'')+'> '+t('onlyClose')+'</label></div><div id="hz">'+raceTable(houseRows(),true)+'</div>';
 h+='<p class="note">'+t('protTxt')+' <code>'+U.meta.protocol_sha256.slice(0,16)+'…</code> · '+t('lockTxt')+' <code>'+U.lock.sha256.slice(0,16)+'…</code> ('+U.lock.locked_utc+')</p>';
 return h;
}
function houseRows(){var q=filt.q.trim().toUpperCase();return V.usa.house.filter(function(r){return (!q||r.k.indexOf(q)>=0)&&(!filt.close||q||(r.p>=.1&&r.p<=.9));});}
function raceTable(rows,isH){
 var h='<div class="scroll"><table class="tbl"><thead><tr><th>'+t('race')+'</th><th>'+t('p')+'</th><th></th><th>'+t('mu')+'</th><th>'+t('out')+'</th></tr></thead><tbody>';
 rows.slice().sort(function(a,b){return Math.abs(a.p-.5)-Math.abs(b.p-.5);}).forEach(function(r){
  var res=r.w?('<span class="tag '+(((r.p>.5)===(r.w==='D'))?'hit':'miss')+'">'+r.w+' · '+(((r.p>.5)===(r.w==='D'))?t('hit'):t('miss'))+'</span>'):'<span class="note">'+t('pending')+'</span>';
  h+='<tr><td><b>'+esc(r.k)+'</b></td><td>'+pct(r.p)+'</td><td><div class="bar"><i style="width:'+(r.p*100).toFixed(0)+'%"></i></div></td><td>'+sgn(r.mu,1)+'</td><td>'+res+'</td></tr>';});
 return h+'</tbody></table></div>';
}
function render(){
 var EMB=qs.get('embed')==='1';
 var h='<header><div class="lang"><button data-l="sv" aria-pressed="'+(LANG==='sv')+'">SV</button><button data-l="en" aria-pressed="'+(LANG==='en')+'">EN</button></div>'+(EMB?'':'<div class="eye">'+t('eye')+'</div><h1>'+t('title')+'</h1>')+'<p>'+t('lead')+'</p><p class="note">'+t('diff')+'</p></header>';
 h+='<div class="tabs" role="tablist"><button role="tab" data-t="se" aria-selected="'+(TAB==='se')+'">'+t('tse')+'</button><button role="tab" data-t="us" aria-selected="'+(TAB==='us')+'">'+t('tus')+'</button></div>';
 h+=TAB==='se'?sweden():usa();
 app.innerHTML=h; document.documentElement.lang=LANG; document.title=t('title');
 app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){LANG=b.dataset.l;render();};});
 app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;render();};});
 var q=document.getElementById('q'),cl=document.getElementById('cl');
 if(q){q.oninput=function(){filt.q=q.value;document.getElementById('hz').innerHTML=raceTable(houseRows(),true);};}
 if(cl){cl.onchange=function(){filt.close=cl.checked;document.getElementById('hz').innerHTML=raceTable(houseRows(),true);};}
 post();
}
function post(){try{if(parent!==window)parent.postMessage({type:'voteshift-height',height:(window.__fsCH?window.__fsCH():document.documentElement.scrollHeight)},'*');}catch(e){}}
window.addEventListener('resize',post);
render();
})();
</script>
