*{box-sizing:border-box}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

h3{font-size:15px;margin:18px 0 6px}
p{margin:6px 0;max-width:860px;color:var(--ink-soft)}
.lang{float:right;display:flex;gap:6px}
.lang button,.tabs button{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:var(--card);padding:6px 12px;border-radius:4px;cursor:pointer;color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}

.card .v{font-family:var(--serif);font-size:26px;margin:4px 0 2px}
.card .s{font-size:13px;color:var(--ink-soft)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--paper-3);text-align:right;white-space:nowrap}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);background:var(--paper-2)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{position:relative;height:10px;background:var(--paper-3);border-radius:5px;min-width:90px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--dem);border-radius:5px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule)}
.tag.hit{border-color:var(--ok);color:var(--ok)}.tag.miss{border-color:var(--bad);color:var(--bad)}
.note{font-size:13px;color:var(--ink-light)}
.filter{margin:8px 0;font-size:14px}
.filter input{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;width:180px}

 if(sc&&sc.outcome){var mh=U.house.filter(function(r){return r.w&&((r.p>.5)!==(r.w==='D'));}),md=mh.filter(function(r){return r.w==='D';}).length;
  var ms=U.senate.filter(function(r){return r.w&&((r.p>.5)!==(r.w==='D'));});
  h+='<div class="banner">'+(LANG==='sv'
   ?'Rätt vinnare i båda kamrarna. Missar: '+mh.length+' av '+U.house.filter(function(r){return r.w;}).length+' husdistrikt ('+md+' av dem vanns av D) och '+ms.length+' av '+U.senate.length+' senatslopp ('+ms.map(function(r){return r.k;}).join(', ')+'). Mätningarna underskattade demokraternas våg: modellen väntade D '+sgn(X.national_margin,1)+', utfallet blev '+sgn(sc.outcome.house_vote_margin,1)+' (inofficiell räkning, '+String(sc.outcome.house_vote_asof).split(' (')[0]+').'
   :'Right winner in both chambers. Misses: '+mh.length+' of '+U.house.filter(function(r){return r.w;}).length+' House districts ('+md+' of them won by D) and '+ms.length+' of '+U.senate.length+' Senate races ('+ms.map(function(r){return r.k;}).join(', ')+'). Polls underestimated the Democratic wave: the model expected D '+sgn(X.national_margin,1)+', the result was '+sgn(sc.outcome.house_vote_margin,1)+' (unofficial count, '+String(sc.outcome.house_vote_asof).split(' (')[0]+').')+'</div>';}
 h+='<h3>'+t('senate')+'</h3>'+raceTable(U.senate,false);
 h+='<h3>'+t('house')+'</h3><div class="filter"><input id="q" placeholder="'+t('search')+'" value="'+esc(filt.q)+'"> <label><input type="checkbox" id="cl" '+(filt.close?'checked':'')+'> '+t('onlyClose')+'</label></div><div id="hz">'+raceTable(houseRows(),true)+'</div>';
 h+='<p class="note">'+t('protTxt')+' <code>'+U.meta.protocol_sha256.slice(0,16)+'…</code> · '+t('lockTxt')+' <code>'+U.lock.sha256.slice(0,16)+'…</code> ('+U.lock.locked_utc+')</p>';
 return h;
}
function world(){
 var h='<h2>'+tw('h')+'</h2><p>'+tw('lead')+'</p>';
 h+='<div class="banner"><b>'+tw('how')+'.</b> '+tw('rule')+'</div>';
 h+='<p class="note">'+tw('prot')+': <code>'+esc(W.protocol_sha256.slice(0,16))+'…</code> · <a href="https://github.com/ThomasHedlundLeijon/fieldshift-democratic-stress-threshold/tree/main/voteshift-world" target="_blank" rel="noopener">GitHub ↗</a></p>';
 var B=W.board||{};
 h+='<h3>'+tw('board')+'</h3>';
 if(!B.scored_elections){h+='<p>'+tw('none')+'</p>';}
 else{
  h+='<div class="scroll"><table class="tbl"><thead><tr><th>'+tw('model')+'</th><th>'+tw('n')+'</th><th>'+tw('brier')+'</th><th>'+tw('mae')+'</th><th>'+tw('logs')+'</th></tr></thead><tbody>';
  (B.table||[]).filter(function(r){return r.group==='a';}).forEach(function(r){var nm=r.model.split(':');h+='<tr><td>'+esc((TW[LANG].m[nm[0]]||TW[LANG].m[nm[0].slice(0,2)]||nm[0])+(nm[1]?' ('+nm[1]+')':''))+'</td><td>'+r.elections+'</td><td>'+num(r.brier,3)+'</td><td>'+num(r.mae,2)+'</td><td>'+num(r.log,3)+'</td></tr>';});
  h+='</tbody></table></div>';
 }
 var vo=B.vs_others||{}, keys=Object.keys(vo);
 if(keys.length){h+='<div class="scroll"><table class="tbl"><thead><tr><th>'+tw('vsvs')+'</th><th>'+tw('n')+'</th><th>'+tw('verdict')+'</th></tr></thead><tbody>';
  keys.forEach(function(k){var r=vo[k],nm=k.split(':'),v=r.verdict==='bättre'?tw('better'):r.verdict==='inte visat'?tw('notshown'):tw('early');
   h+='<tr><td>'+esc((TW[LANG].m[nm[0]]||TW[LANG].m[nm[0].slice(0,2)]||nm[0])+(nm[1]?' ('+nm[1]+')':''))+'</td><td>'+r.common_elections+' '+tw('of')+' '+r.required+'</td><td>'+v+'</td></tr>';});
  h+='</tbody></table></div>';}
 // låsta prognoser
 var L=(W.locks||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
 if(L.length){h+='<h3>'+tw('fc')+'</h3>';
  L.forEach(function(f){var vs=f.models.VoteShift, sc=(W.scores||{})[f.id];
   var ids=Object.keys(vs.shares).sort(function(a,b){return vs.shares[b]-vs.shares[a];});
   h+='<div class="card" style="margin:10px 0"><div class="k">'+esc(f.date)+' · '+esc(f.country)+' · '+(f.office==='presidential'?tw('pres'):tw('leg'))+(vs.kind==='fallback'?' · <span class="tag miss">'+tw('reserve')+'</span>':'')+(f.competitive===false?' · <span class="tag">'+tw('nc')+'</span>':'')+'</div>';
   h+='<div class="scroll"><table class="tbl"><thead><tr><th></th><th>'+tw('share')+'</th><th>'+tw('int80')+'</th><th>'+tw('win')+'</th>'+(vs.threshold_probs?'<th>'+tw('thr')+'</th>':'')+(sc?'<th>'+tw('result')+'</th>':'')+'</tr></thead><tbody>';
   ids.forEach(function(j){h+='<tr><td><b>'+esc(j)+'</b></td><td>'+num(vs.shares[j],1)+'</td><td>'+num(vs.interval80[j][0],1)+'–'+num(vs.interval80[j][1],1)+'</td><td>'+pct(vs.winner_probs[j],0)+'</td>'+(vs.threshold_probs?'<td>'+pct(vs.threshold_probs[j],0)+'</td>':'')+(sc?'<td>'+(sc.winner===j?'<b>'+tw('result')+'</b>':'')+'</td>':'')+'</tr>';});
   h+='</tbody></table></div><p class="note">'+(vs.polls_used?vs.polls_used+' '+tw('polls')+' · ':'')+tw('locked')+' '+esc(f.locked_utc)+' · SHA-256 <code>'+esc(f.sha256.slice(0,16))+'…</code> · <a href="https://github.com/ThomasHedlundLeijon/fieldshift-democratic-stress-threshold/blob/main/voteshift-world/locks/'+encodeURIComponent(f.id)+'.json" target="_blank" rel="noopener">'+tw('lockfile')+' ↗</a></p></div>';});
 }
 // kalender
 var lockedIds={};L.forEach(function(f){lockedIds[f.iso3+'|'+f.office+'|'+f.date]=f;});
 var cal=(W.calendar||[]).filter(function(e){return !e.date||e.date>=new Date().toISOString().slice(0,10)||lockedIds[e.iso3+'|'+e.office+'|'+e.date];});
 h+='<h3>'+tw('cal')+' ('+cal.length+')</h3><div class="scroll"><table class="tbl"><thead><tr><th>'+tw('date')+'</th><th>'+tw('country')+'</th><th>'+tw('office')+'</th><th>'+tw('system')+'</th><th>'+tw('status')+'</th></tr></thead><tbody>';
 cal.forEach(function(e){var f=lockedIds[e.iso3+'|'+e.office+'|'+e.date],st;
  if(f&&(W.scores||{})[f.id])st='<span class="tag hit">'+tw('scored')+'</span>';
  else if(f)st='<span class="tag hit">'+tw('locked')+'</span>';
  else if(e.date&&e.date<'2026-12-08')st='<span class="note">'+(LANG==='sv'?'före studiens start':'before the study starts')+'</span>';
  else if(e.date){var ld=new Date(e.date+'T00:00:00Z');ld.setUTCDate(ld.getUTCDate()-7);st=tw('locks')+' '+ld.toISOString().slice(0,10);}
  else st='<span class="note">'+tw('nodate')+(e.date_note?': '+esc(e.date_note):'')+'</span>';
  h+='<tr><td>'+esc(e.date||'–')+'</td><td>'+esc(e.country)+'</td><td>'+(e.office==='presidential'?tw('pres'):tw('leg'))+'</td><td class="note">'+esc(e.system||'')+'</td><td>'+st+'</td></tr>';});
 h+='</tbody></table></div>';
 return h;
}
function houseRows(){var q=filt.q.trim().toUpperCase();return V.usa.house.filter(function(r){return (!q||r.k.indexOf(q)>=0)&&(!filt.close||q||(r.p>=.1&&r.p<=.9));});}
function raceTable(rows,isH){
 var h='<div class="scroll"><table class="tbl"><thead><tr><th>'+t('race')+'</th><th>'+t('p')+'</th><th></th><th>'+t('mu')+'</th><th>'+t('out')+'</th></tr></thead><tbody>';
 rows.slice().sort(function(a,b){return Math.abs(a.p-.5)-Math.abs(b.p-.5);}).forEach(function(r){
  var res=r.w?('<span class="tag '+(((r.p>.5)===(r.w==='D'))?'hit':'miss')+'">'+r.w+' · '+(((r.p>.5)===(r.w==='D'))?t('hit'):t('miss'))+'</span>'):'<span class="note">'+t('pending')+'</span>';
  h+='<tr><td><b>'+esc(r.k)+'</b></td><td>'+pct(r.p)+'</td><td><div class="bar"><i style="width:'+(r.p*100).toFixed(0)+'%"></i></div></td><td>'+sgn(r.mu,1)+'</td><td>'+res+'</td></tr>';});
 return h+'</tbody></table></div>';
}

 var EMB=qs.get('embed')==='1';

 h+='<div class="tabs" role="tablist">'+(W?'<button role="tab" data-t="world" aria-selected="'+(TAB==='world')+'">'+tw('tab')+'</button>':'')+'<button role="tab" data-t="se" aria-selected="'+(TAB==='se')+'">'+t('tse')+'</button><button role="tab" data-t="us" aria-selected="'+(TAB==='us')+'">'+t('tus')+'</button></div>';
 h+=(TAB==='world'&&W)?world():TAB==='se'?sweden():usa();
 app.innerHTML=h; document.documentElement.lang=LANG; document.title=t('title');
 app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){LANG=b.dataset.l;render();};});
 app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;render();};});
 var q=document.getElementById('q'),cl=document.getElementById('cl');

 post();
}
