ngsspår: litteratur, gap och ekonomipris","te":"Three research tracks: literature, gap and economics prize","a":"Program","ae":"Programme","cb":""},{"d":"2026-10-24","t":"Stödtext: tolkningsmakt och handlingsförmåga","te":"Supportive text: interpretive power and capacity to act","a":"Teori","ae":"Theory","cb":""},{"d":"2026-10-24","t":"Levnadskostnader och demokrati (Moving Map)","te":"Cost of living and democracy (Moving Map)","a":"Ekonomi/demokrati","ae":"Economy/democracy","cb":"06"},{"d":"2026-10-22","t":"Statliga chefsutnämningar och meritprövning","te":"Senior public appointments and merit review","a":"Förvaltning","ae":"Public administration","cb":""},{"d":"2026-10-22","t":"Demokratisk räckvidd, AI och kontroll","te":"Democratic reach, AI and control","a":"AI/demokrati","ae":"AI/democracy","cb":""},{"d":"2026-10-22","t":"Ghana: elmopeder och verifierad klimatnytta","te":"Ghana: e-mopeds and verified climate benefit","a":"Klimat/utveckling","ae":"Climate/development","cb":""},{"d":"2026-10-22","t":"Referenspopulation och pilotpaket","te":"Reference population and pilot package","a":"Metod","ae":"Method","cb":""},{"d":"2026-10-21","t":"Klass, erkännande och organisering","te":"Class, recognition and organising","a":"Samhällsklass","ae":"Social class","cb":""},{"d":"2026-10-18","t":"DemShift: synlig makt och ansvarsutkrävande","te":"DemShift: visible power and accountability","a":"Demokrati","ae":"Democracy","cb":""},{"d":"2026-10-18","t":"DefenceShift: marina system","te":"DefenceShift: maritime systems","a":"Försvar","ae":"Defence","cb":"05"},{"d":"2026-10-12","t":"Ideologisk förflyttning och koalitionsgränser (CASE-022)","te":"Ideological movement and coalition boundaries (CASE-022)","a":"Demokrati","ae":"Democracy","cb":"03"},{"d":"2026-09-22","t":"Barns naturtillgång, skydd och självständighetskapacitet","te":"Children's access to nature, protection and capacity for independence","a":"Barndom","ae":"Childhood","cb":""},{"d":"2026-09-13","t":"GIGI: könsgapet i valet 2026 (hypoteser och evidensplan)","te":"GIGI: the gender gap in the 2026 election (hypotheses and evidence plan)","a":"GIGI","ae":"GIGI","cb":"01"},{"d":"2026-09-11","t":"Bostadsmarknaden och ungas realiserade kapacitet (OS-001)","te":"The housing market and young adults' realised capacity (OS-001)","a":"Välfärd/bostad","ae":"Welfare/housing","cb":"04"}],"casebook":{"cards":[{"n":"01","id":"01_gigi_konsgap","t":"Könsgapet i partisympati: rör sig kvinnor och män isär, och hinner partierna med?","h":"<p><b>Fall-ID:<\/b> CS-CB-01 (ursprungligt: GIGI-SE-P1) · <b>Utgångspunkt:<\/b> GIGI-programmets evidensplan (v1.0, 2026-09-13) och mätpilot GIGI-SE-P1 (2026-11-25) · <b>Status:<\/b> Mätpilot genomförd för efterfrågesidan. Respons- och följdsidan är ej prövad.<\/p>\n<blockquote><p><b>Märkning:<\/b> Detta fall bygger på den partibaserade varianten av GIGI (GIGI-P), där gapet mäts som skillnaden i kvinnors och mäns partisympati, sammanräknad till block. Det är inte den variant som bygger på ideologisk självplacering (vänster–höger). Resultaten gäller partisympati och ska inte läsas som ett mått på ideologi.<\/p><\/blockquote>\n<h4>Fråga<\/h4>\n<p>Rör sig kvinnors och mäns politiska preferenser isär i Sverige? Vilken grupp rör sig, hur snabbt, och i vilka generationer? Och följer partiernas utbud med i samma takt?<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>Lika rösträtt och samma partiutbud ger alla väljare samma formella möjlighet att bli representerade:<\/p>\n<p>samhällsförändring → skilda villkor för kvinnor och män → skilda preferenser → partiernas respons → upplevd representation<\/p>\n<p>Om preferenserna förändras snabbare än partierna svarar kan representationen försämras för de grupper som rör sig snabbast. Den formella representationen är då oförändrad, men den realiserade har minskat.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Rate mismatch:<\/b> fallet är programmets huvudtest. Efterfrågans takt (R_D) är mätt. Responsens takt (R_A) är inte mätt.<\/li><li><b>Formell mot realiserad representation:<\/b> finns som hypotes (H5) men är ännu inte mätt.<\/li><li><b>Moving Map:<\/b> mätningen skiljer kvinnors och mäns egen rörelse åt, alltså två aktörsrörelser, innan skillnaden räknas. Referenspunkt och legitimitetsgränser ingår inte än.<\/li><\/ul>\n<h4>Resultat från mätpiloten<\/h4>\n<p>Underlaget är SCB:s partisympatiundersökning 1994–2026. Protokollet låstes före beräkningen.<\/p>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Mått<\/th><th>Resultat<\/th><\/tr><\/thead><tbody><tr><td>Gap maj 2026 (kvinnors blockbalans minus mäns)<\/td><td>+34,9 ±5,5 procentenheter (+11 år 2006)<\/td><\/tr><tr><td>Rörelse 2006 → 2026<\/td><td>Kvinnor +5,9 mot vänster, män −17,6 mot höger<\/td><\/tr><tr><td>Rörelse 2022 → 2026<\/td><td>Båda mot vänster, kvinnor snabbare (+11,2 mot +3,7)<\/td><\/tr><tr><td>Takt 2016–2026<\/td><td>+1,34 p.e./år [0,64; 2,05]. Acceleration är inte belagd.<\/td><\/tr><tr><td>18–29 år mot 65+ (2022–2026)<\/td><td>+51 mot +15<\/td><\/tr><tr><td>Stabilitet<\/td><td>Samma bild i tre blockdefinitioner och i ett riktningsfritt mått<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Gapet är större 2026 än 2022<\/td><td>Slumpvariation mellan mätningar<\/td><td>Eftervalsdata visar ingen ökning. Förhandsavläsningen är +6,5 [−1,5; 14,5].<\/td><\/tr><tr><td>H2<\/td><td>Gapet växer genom att kvinnor och män rör sig olika<\/td><td>Gemensam blockförskjutning eller förändrat valdeltagande. Partiutbudet har förändrats, så att partisympatin flyttar sig utan att de underliggande preferenserna gör det (tillagd i revision).<\/td><td>Kvinnor och män rör sig lika när de mäts var för sig<\/td><\/tr><tr><td>H3<\/td><td>Gapet är större bland unga<\/td><td>Livscykeleffekt i stället för kohort<\/td><td>Gapet följer åldern och inte födelsekohorten över tid<\/td><\/tr><tr><td>H4<\/td><td>Förändringstakten har ökat<\/td><td>Brus i korta serier<\/td><td>Lutningarna skiljer sig inte. Det är så det ser ut i dag.<\/td><\/tr><tr><td>H5<\/td><td>Snabbast föränderliga grupper upplever sämst representation<\/td><td>Missnöjet har andra orsaker<\/td><td>Ingen koppling i SOM eller i valundersökningarna<\/td><\/tr><tr><td>H6<\/td><td>Stor rate mismatch följs av missnöje och partibyten<\/td><td>Gemensamma chocker<\/td><td>Följderna kommer före glappet, eller saknas<\/td><\/tr><tr><td>H7<\/td><td>Varaktigt gap följs av affektiv polarisering<\/td><td>Polariseringen driver gapet<\/td><td>Ingen tidsordning<\/td><\/tr><tr><td>H8<\/td><td>Prognoser utan kön, ålder och valdeltagande får större fel när gapet växer<\/td><td>Mätfel av andra skäl<\/td><td>Förregistrerad jämförelse visar ingen skillnad<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Gjort:<\/b> SCB PSU, tabellerna ME0201B Partisympati051 och 05 samt ME0201A Vid11. Data hämtas via öppet API.<\/li><li><b>Krävs för den variant av GIGI som bygger på självplacering:<\/b> mikrodata från SOM-institutet, ESS och Valforskningsprogrammet (ansökan krävs).<\/li><li><b>Krävs för responssidan:<\/b> partipositioner över tid från Manifesto Project och CHES, kodade per sakfråga och samma år som efterfrågan.<\/li><li><b>Krävs för följderna:<\/b> tillit, upplevd representation och polarisering från SOM och ESS.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<ul><li>Gapet kan inte mätas stabilt under rimliga specifikationer. Det har klarats i piloten.<\/li><li>Riktningen försvinner när ålder, utbildning och inkomst kontrolleras.<\/li><li>GIGI går inte att skilja från vanliga mått på polarisering.<\/li><li>Rate mismatch tillför inget utöver responsivitet, kongruens och issue ownership.<\/li><li>Modellen förbättrar inte prognoser i nya data.<\/li><li>Det partibaserade måttet (GIGI-P) och självplaceringsmåttet visar olika riktning eller olika takt för samma period och åldersgrupp. Då kan GIGI-P inte tolkas som preferensförändring, bara som förändrad partisympati (tillagd i revision).<\/li><li>Förändringar i urval, bortfall eller frågeformulering i PSU förklarar en väsentlig del av rörelsen när de modelleras (tillagd i revision).<\/li><\/ul>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p><b>Nyckelreferenser (verifierade mot doi.org eller universitetets sida 2026-11-25):<\/b><\/p>\n<ul><li>Det moderna könsgapet: Inglehart &amp; Norris (2000), Giger (2009), Dassonneville (2021).<\/li><li>Unga vuxna: Nennstiel &amp; Hudde (2025).<\/li><li>Sverige: Oskarson &amp; Ahlbom (2021) om valundersökningarna; Off (2023) om jämställdhet som sakfråga och röstning på radikala högern.<\/li><li>Responsivitet: Caughey &amp; Warshaw (2018) om dynamisk responsivitet; Homola (2019) och Ferland (2020) om partiers respons på kvinnor och män.<\/li><\/ul>\n<p>Att kvinnor i många etablerade demokratier, och i Sverige, numera står till vänster om män är väl belagt, liksom att skillnaden kan vara större bland unga. Det finns också forskning om huruvida partier och politik svarar olika på kvinnors och mäns preferenser. Det som kan vara nytt är att jämföra takten i efterfrågans förändring med takten i partiernas respons, för samma grupper och perioder. Detta är ännu inte belagt och kräver en riktad litteraturöversikt innan ett nyhetsanspråk görs.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Kör om piloten med <code>gigi.py<\/code> och SCB:s öppna API. Det tar under en minut och resultatet ska bli identiskt.<\/li><li>Lägg till PSU november 2026 och eftervalsdata, och pröva H1 slutligt.<\/li><li>Bygg varianten med självplacering ur SOM-data och jämför den med den partibaserade.<\/li><li>Koda partiernas positioner per sakfråga, ta fram R_A och förregistrera testet av takt­skillnaden M(t) = R_D − R_A.<\/li><\/ol>\n<h4>Referenser<\/h4>\n<p>Caughey, D., &amp; Warshaw, C. (2018). Policy preferences and policy change: Dynamic responsiveness in the American states, 1936–2014. *American Political Science Review, 112*(2), 249–266. https://doi.org/10.1017/S0003055417000533<\/p>\n<p>Dassonneville, R. (2021). Change and continuity in the ideological gender gap: A longitudinal analysis of left-right self-placement in OECD countries. *European Journal of Political Research, 60*(1), 225–238. https://doi.org/10.1111/1475-6765.12384<\/p>\n<p>Ferland, B. (2020). A gender gap in party congruence and responsiveness? *Politics &amp; Gender, 16*(1), 174–198. https://doi.org/10.1017/S1743923X18000818<\/p>\n<p>Giger, N. (2009). Towards a modern gender gap in Europe? *The Social Science Journal, 46*(3), 474–492. https://doi.org/10.1016/j.soscij.2009.03.002<\/p>\n<p>Homola, J. (2019). Are parties equally responsive to women and men? *British Journal of Political Science, 49*(3), 957–975. https://doi.org/10.1017/S0007123417000114<\/p>\n<p>Inglehart, R., &amp; Norris, P. (2000). The developmental theory of the gender gap: Women's and men's voting behavior in global perspective. *International Political Science Review, 21*(4), 441–463. https://doi.org/10.1177/0192512100214007<\/p>\n<p>Nennstiel, R., &amp; Hudde, A. (2025). Is there a growing gender divide among young adults in regard to ideological left–right self-placement? Evidence from 32 European countries. *European Sociological Review, 41*(6), 862–883. https://doi.org/10.1093/esr/jcaf021<\/p>\n<p>Off, G. (2023). Gender equality salience, backlash and radical right voting in the gender-equal context of Sweden. *West European Politics, 46*(3), 451–476. https://doi.org/10.1080/01402382.2022.2084986<\/p>\n<p>Oskarson, M., &amp; Ahlbom, J. (2021). *Trender i könsskillnader bland svenska väljare* (Valforskningsprogrammets rapportserie 2021:1). Statsvetenskapliga institutionen, Göteborgs universitet. https://www.gu.se/valforskningsprogrammet<\/p>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li><b>Uppdatering:<\/b> lägg till PSU november 2026 när SCB har publicerat den, och pröva H1 med eftervalsdata.<\/li><li><b>Dataåtkomst:<\/b> ansökan om mikrodata från SOM-institutet, ESS och Valforskningsprogrammet för självplaceringsvarianten och för H5–H7.<\/li><li><b>Etikprövning:<\/b> analyser av mikrodata om politiska åsikter (känsliga personuppgifter) kräver etikprövning.<\/li><li><b>Fulltextläsning:<\/b> referenserna är verifierade bibliografiskt, men flera artiklar ligger bakom betalvägg och har inte lästs i fulltext. Den riktade översikten om takter i efterfrågan och respons återstår.<\/li><li><b>Styrkeberäkning:<\/b> för H4 och H6–H8 kräver styrkeberäkningen skattningar av varians och effektstorlek från pilotdata på responssidan.<\/li><li><b>Förregistrering:<\/b> testet av M(t) och prognosjämförelsen i H8 ska förregistreras innan responsdata kodas.<\/li><\/ul>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID CS-CB-01; ursprungligt ID GIGI-SE-P1 behålls som spårbarhet.<\/li><li>Tydlig märkning införd överst: fallet gäller den partibaserade varianten GIGI-P, inte ideologisk självplacering.<\/li><li>Intern rad om utkast till pressmeddelanden borttagen.<\/li><li>Avsnittet om etablerad forskning omskrivet med nio referenser, alla verifierade mot doi.org eller utgivarens/universitetets sida. Årtal rättade till tryckt årgång: Dassonneville 2021 (online 2020), Caughey &amp; Warshaw 2018 (online 2017), Homola 2019 (online 2017). Ferland 2020 avser artikeln om kongruens och responsivitet i *Politics &amp; Gender*.<\/li><li>Avsnittet Referenser (APA 7 med DOI) tillagt.<\/li><li>En rivalförklaring (H2) och två stoppregler tillagda och märkta.<\/li><li>Intern hänvisning till granskningssteg ersatt med klartext; M(t) förklarad som takt­skillnad.<\/li><li>Avsnittet om vad som måste åtgärdas ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"The gender gap in party preference: are women and men moving apart, and are the parties keeping up?","he":"<p><b>Case ID:<\/b> CS-CB-01 (original: GIGI-SE-P1) · <b>Basis:<\/b> the GIGI programme's evidence plan (v1.0, 2026-09-13) and measurement pilot GIGI-SE-P1 (2026-11-25) · <b>Status:<\/b> Measurement pilot completed for the demand side. The response and consequence sides have not been tested.<\/p>\n<blockquote><p><b>Scope note:<\/b> This case is based on the party-based variant of GIGI (GIGI-P), in which the gap is measured as the difference between women's and men's party preference, aggregated into blocs. It is not the variant based on ideological self-placement (left–right). The results concern party preference and should not be read as a measure of ideology.<\/p><\/blockquote>\n<h4>Question<\/h4>\n<p>Are women's and men's political preferences moving apart in Sweden? Which group is moving, how fast, and in which generations? And is party supply keeping pace?<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>Equal voting rights and the same range of parties give all voters the same formal opportunity to be represented:<\/p>\n<p>societal change → different conditions for women and men → different preferences → parties' response → perceived representation<\/p>\n<p>If preferences change faster than the parties respond, representation may deteriorate for the groups that move fastest. Formal representation is then unchanged, but realised representation has declined.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Rate mismatch:<\/b> the case is the programme's main test. The rate of demand (R_D) has been measured. The rate of response (R_A) has not been measured.<\/li><li><b>Formal versus realised representation:<\/b> included as a hypothesis (H5) but not yet measured.<\/li><li><b>Moving Map:<\/b> the measurement separates women's and men's own movement, that is, two actor movements, before the difference is calculated. Reference point and legitimacy boundaries are not yet included.<\/li><\/ul>\n<h4>Results from the measurement pilot<\/h4>\n<p>The data source is Statistics Sweden's Party Preference Survey (PSU), 1994–2026. The protocol was locked before the computation.<\/p>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Measure<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>Gap May 2026 (women's bloc balance minus men's)<\/td><td>+34.9 ±5.5 percentage points (+11 in 2006)<\/td><\/tr><tr><td>Movement 2006 → 2026<\/td><td>Women +5.9 towards the left, men −17.6 towards the right<\/td><\/tr><tr><td>Movement 2022 → 2026<\/td><td>Both towards the left, women faster (+11.2 versus +3.7)<\/td><\/tr><tr><td>Rate 2016–2026<\/td><td>+1.34 pp/year [0.64; 2.05]. Acceleration has not been established.<\/td><\/tr><tr><td>Ages 18–29 versus 65+ (2022–2026)<\/td><td>+51 versus +15<\/td><\/tr><tr><td>Stability<\/td><td>The same picture under three bloc definitions and in a direction-free measure<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>The gap is larger in 2026 than in 2022<\/td><td>Random variation between surveys<\/td><td>Post-election data show no increase. The preliminary reading is +6.5 [−1.5; 14.5].<\/td><\/tr><tr><td>H2<\/td><td>The gap is growing because women and men are moving differently<\/td><td>A common bloc shift or changed turnout. The range of parties on offer has changed, so that party preference shifts without the underlying preferences doing so (added in revision).<\/td><td>Women and men move alike when measured separately<\/td><\/tr><tr><td>H3<\/td><td>The gap is larger among the young<\/td><td>A life-cycle effect rather than a cohort effect<\/td><td>The gap follows age rather than birth cohort over time<\/td><\/tr><tr><td>H4<\/td><td>The rate of change has increased<\/td><td>Noise in short series<\/td><td>The slopes do not differ. This is how it looks today.<\/td><\/tr><tr><td>H5<\/td><td>The fastest-changing groups experience the poorest representation<\/td><td>The dissatisfaction has other causes<\/td><td>No association in SOM or in the election studies<\/td><\/tr><tr><td>H6<\/td><td>A large rate mismatch is followed by dissatisfaction and party switching<\/td><td>Common shocks<\/td><td>The consequences precede the gap, or are absent<\/td><\/tr><tr><td>H7<\/td><td>A persistent gap is followed by affective polarisation<\/td><td>Polarisation drives the gap<\/td><td>No temporal ordering<\/td><\/tr><tr><td>H8<\/td><td>Forecasts that omit gender, age and turnout have larger errors as the gap grows<\/td><td>Measurement error for other reasons<\/td><td>A preregistered comparison shows no difference<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Done:<\/b> Statistics Sweden (SCB) PSU, tables ME0201B Partisympati051 and 05, and ME0201A Vid11. The data are retrieved via an open API.<\/li><li><b>Required for the GIGI variant based on self-placement:<\/b> microdata from the SOM Institute, ESS and the Swedish National Election Studies (application required).<\/li><li><b>Required for the response side:<\/b> party positions over time from the Manifesto Project and CHES, coded by issue and for the same years as demand.<\/li><li><b>Required for the consequences:<\/b> trust, perceived representation and polarisation from SOM and ESS.<\/li><\/ul>\n<h4>Stop rules – what would make the case fail<\/h4>\n<ul><li>The gap cannot be measured stably under reasonable specifications. The pilot has met this.<\/li><li>The direction disappears when age, education and income are controlled for.<\/li><li>GIGI cannot be distinguished from conventional measures of polarisation.<\/li><li>Rate mismatch adds nothing beyond responsiveness, congruence and issue ownership.<\/li><li>The model does not improve forecasts on new data.<\/li><li>The party-based measure (GIGI-P) and the self-placement measure show different directions or different rates for the same period and age group. GIGI-P can then not be interpreted as a change in preferences, only as a change in party preference (added in revision).<\/li><li>Changes in sampling, non-response or question wording in the PSU explain a substantial part of the movement when they are modelled (added in revision).<\/li><\/ul>\n<h4>Established research and what may be new<\/h4>\n<p><b>Key references (verified against doi.org or the university's website, 2026-11-25):<\/b><\/p>\n<ul><li>The modern gender gap: Inglehart &amp; Norris (2000), Giger (2009), Dassonneville (2021).<\/li><li>Young adults: Nennstiel &amp; Hudde (2025).<\/li><li>Sweden: Oskarson &amp; Ahlbom (2021) on the election studies; Off (2023) on gender equality as an issue and radical right voting.<\/li><li>Responsiveness: Caughey &amp; Warshaw (2018) on dynamic responsiveness; Homola (2019) and Ferland (2020) on parties' responsiveness to women and men.<\/li><\/ul>\n<p>That women in many established democracies, including Sweden, now stand to the left of men is well documented, as is the finding that the difference may be larger among the young. There is also research on whether parties and policy respond differently to women's and men's preferences. What may be new is comparing the rate of change in demand with the rate of the parties' response, for the same groups and periods. This has not yet been established and requires a targeted literature review before any claim of novelty is made.<\/p>\n<h4>First steps for a researcher who wants to test the case<\/h4>\n<ol><li>Re-run the pilot with <code>gigi.py<\/code> and Statistics Sweden's open API. It takes under a minute and the result should be identical.<\/li><li>Add PSU November 2026 and post-election data, and test H1 definitively.<\/li><li>Build the self-placement variant from SOM data and compare it with the party-based variant.<\/li><li>Code the parties' positions by issue, derive R_A and preregister the test of the rate difference M(t) = R_D − R_A.<\/li><\/ol>\n<h4>References<\/h4>\n<p>Caughey, D., &amp; Warshaw, C. (2018). Policy preferences and policy change: Dynamic responsiveness in the American states, 1936–2014. *American Political Science Review, 112*(2), 249–266. https://doi.org/10.1017/S0003055417000533<\/p>\n<p>Dassonneville, R. (2021). Change and continuity in the ideological gender gap: A longitudinal analysis of left-right self-placement in OECD countries. *European Journal of Political Research, 60*(1), 225–238. https://doi.org/10.1111/1475-6765.12384<\/p>\n<p>Ferland, B. (2020). A gender gap in party congruence and responsiveness? *Politics &amp; Gender, 16*(1), 174–198. https://doi.org/10.1017/S1743923X18000818<\/p>\n<p>Giger, N. (2009). Towards a modern gender gap in Europe? *The Social Science Journal, 46*(3), 474–492. https://doi.org/10.1016/j.soscij.2009.03.002<\/p>\n<p>Homola, J. (2019). Are parties equally responsive to women and men? *British Journal of Political Science, 49*(3), 957–975. https://doi.org/10.1017/S0007123417000114<\/p>\n<p>Inglehart, R., &amp; Norris, P. (2000). The developmental theory of the gender gap: Women's and men's voting behavior in global perspective. *International Political Science Review, 21*(4), 441–463. https://doi.org/10.1177/0192512100214007<\/p>\n<p>Nennstiel, R., &amp; Hudde, A. (2025). Is there a growing gender divide among young adults in regard to ideological left–right self-placement? Evidence from 32 European countries. *European Sociological Review, 41*(6), 862–883. https://doi.org/10.1093/esr/jcaf021<\/p>\n<p>Off, G. (2023). Gender equality salience, backlash and radical right voting in the gender-equal context of Sweden. *West European Politics, 46*(3), 451–476. https://doi.org/10.1080/01402382.2022.2084986<\/p>\n<p>Oskarson, M., &amp; Ahlbom, J. (2021). *Trender i könsskillnader bland svenska väljare* [Trends in gender differences among Swedish voters] (Valforskningsprogrammets rapportserie 2021:1). Statsvetenskapliga institutionen, Göteborgs universitet. https://www.gu.se/valforskningsprogrammet<\/p>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li><b>Update:<\/b> add PSU November 2026 once Statistics Sweden has published it, and test H1 with post-election data.<\/li><li><b>Data access:<\/b> application for microdata from the SOM Institute, ESS and the Swedish National Election Studies for the self-placement variant and for H5–H7.<\/li><li><b>Ethical review:<\/b> analyses of microdata on political opinions (sensitive personal data) require ethical review.<\/li><li><b>Full-text reading:<\/b> the references have been verified bibliographically, but several articles are behind a paywall and have not been read in full text. The targeted review of the rates of demand and response remains to be done.<\/li><li><b>Power analysis:<\/b> for H4 and H6–H8, the power analysis requires estimates of variance and effect size from pilot data on the response side.<\/li><li><b>Preregistration:<\/b> the test of M(t) and the forecast comparison in H8 are to be preregistered before the response data are coded.<\/li><\/ul>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID CS-CB-01; the original ID GIGI-SE-P1 is retained for traceability.<\/li><li>Clear label added at the top: the case concerns the party-based variant GIGI-P, not ideological self-placement.<\/li><li>Internal line about draft press releases removed.<\/li><li>The section on established research rewritten with nine references, all verified against doi.org or the publisher's or university's website. Years corrected to the printed volume: Dassonneville 2021 (online 2020), Caughey &amp; Warshaw 2018 (online 2017), Homola 2019 (online 2017). Ferland 2020 refers to the article on congruence and responsiveness in *Politics &amp; Gender*.<\/li><li>References section (APA 7 with DOI) added.<\/li><li>One rival explanation (H2) and two stop rules added and labelled.<\/li><li>Internal reference to a review step replaced with plain text; M(t) explained as a rate difference.<\/li><li>The section on what must be addressed replaced by \"Remaining before empirical testing\".<\/li><\/ul>"},{"n":"02","id":"02_minoritetsregerande","t":"Samarbetsform, parlamentariskt stöd och genomförd politik","h":"<p><b>Fall-ID:<\/b> CS-CB-02 (ursprungligt: inget ID) · <b>Utgångspunkt:<\/b> offentlig debatt hösten 2026, bearbetad i en forskningspromemoria (v0.1, 2026-11-08) · <b>Status:<\/b> Design, ej prövad (ingen data insamlad)<\/p>\n<h4>Fråga<\/h4>\n<p>Under vilka villkor påverkar samarbetsform, faktiskt parlamentariskt stöd och administrativ kapacitet en regerings förmåga att genomföra politik, samtidigt som insyn, ansvarsutkrävande och legitim opposition bevaras?<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>Mandatandel → faktiskt stöd (stödavtal, förhandlingstillträde) → antaget beslut → finansiering, ansvar och myndighetsresurser → genomförd och användbar offentlig insats. Att tolereras som regering (negativ parlamentarism) är inte samma sak som att få igenom en viss reform. En antagen reform är inte heller samma sak som en insats som fungerar i praktiken. Varje led ska mätas för sig, och antal möten eller slutliga ja-röster räcker inte som belägg för inflytande.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Formell kapacitet:<\/b> mandatandel, regeringsstatus och formella regler (RF 1:9, 11 och 12 kap.).<\/li><li><b>Realiserad kapacitet:<\/b> faktisk start, försening i dagar mot plan och uppnått verksamhetsmål.<\/li><li><b>Moving Map:<\/b> alla fyra dimensionerna är operationaliserade: aktörens ändrade samarbetskrav, observatörens ändrade preferens, ändrad uppfattning om normal förhandlingspraxis och ändrad egen gräns för tillåtna procedurer. Bara H8 prövar en förändring över tid.<\/li><li><b>Rate mismatch (tillagd i revision):<\/b> mäts per reformärende som kvoten mellan genomförandetid och problemets tidsfönster. Genomförandetid = antal dagar från formellt beslut (riksdagsbeslut eller regeringsbeslut) till verifierad start av insatsen enligt myndighetens egen uppföljning. Problemets tidsfönster = den tidsfrist eller det datum som propositionen, betänkandet eller regleringsbrevet själv anger för när insatsen behövs. Kvot &gt; 1 kodas som rate mismatch; ärenden utan angivet tidsfönster kodas \"ej bedömbart\". Samma reliabilitetskrav som övrig kodning gäller.<\/li><\/ul>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Dokumenterad förhandlingsinkludering förklarar genomförandet bättre än minoritets- eller majoritetsstatus<\/td><td>Enkla reformer bjuder in fler<\/td><td>Sambandet försvinner bland ärenden som är jämförbart svåra<\/td><\/tr><tr><td>H2<\/td><td>Partier med verifierbart genomslag stöder senare genomförandesteg<\/td><td>Partierna höll med från början<\/td><td>Positionerna före förhandlingen förklarar stödet<\/td><\/tr><tr><td>H3<\/td><td>Stödavtal ökar förutsebarheten men minskar övriga partiers tillträde<\/td><td>Sammanhållna partier väljer både avtal och stabilitet<\/td><td>Förutsebarhet utan minskat tillträde (motsäger andra ledet)<\/td><\/tr><tr><td>H4<\/td><td>En inkluderande och spårbar process ökar bedömd legitimitet även när utfallet är identiskt<\/td><td>Positivt laddade ord<\/td><td>Ingen skillnad med neutral formulering och kontrollerad förståelse<\/td><\/tr><tr><td>H5<\/td><td>Brett samarbete med tydligt finansierings- och genomförandeansvar ger färre förseningar<\/td><td>Administrativ kapacitet föregår båda<\/td><td>Lika många förseningar utan tydligt ansvar<\/td><\/tr><tr><td>H6<\/td><td>En öppen process ökar legitimiteten även hos dem som förlorar i sak<\/td><td>Partilojalitet: förlorare som sympatiserar med de beslutande partierna bedömer processen positivt oavsett öppenhet (tillagd i revision)<\/td><td>Bara redan positiva reagerar; effekten försvinner när partisympati med beslutsfattarna kontrolleras (tillagd i revision)<\/td><\/tr><tr><td>H7<\/td><td>Demokratisk kvalitet följer faktiskt skydd för saklighet, inte mandatandel (tvåsidigt test)<\/td><td>Korruption och institutionell svaghet styr även regeringsformen<\/td><td>Får inte avgöras kausalt med få regeringar<\/td><\/tr><tr><td>H8<\/td><td>Neutral information ändrar uppfattad normalitet före egen preferens<\/td><td>Igenkänning eller önskan att svara rätt<\/td><td>Ingen tidsordning i panel med kontrollgrupp<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Öppet:<\/b> riksdagens dokument, utskottsbetänkanden och voteringar, budgetbeslut, myndigheternas uppföljning, regeringsformen, riksdagens och Folketingets officiella beskrivningar.<\/li><li><b>Egen kodning:<\/b> pilot med 24 reformärenden (2019 och 2023, transport och socialförsäkring), som följs i tolv månader. Koder för stödarrangemang (SUP0–3), tillträde (INV), inflytande (INF0–2), resurser, utfall och rate mismatch.<\/li><li><b>Egen insamling:<\/b> 8–12 kognitiva intervjuer och en teknisk vinjettpilot med cirka 80 deltagare (2 × 2-design). Politiska åsikter är känsliga personuppgifter.<\/li><li><b>Minsta effekt och styrka (planeringsförslag, tillagt i revision; fastställs vid förregistrering):<\/b> minsta meningsfulla effekt d = 0,20 för H4. För en jämförelse mellan två grupper krävs cirka 394 deltagare per grupp vid 80 % styrka och α = 0,05 (tvåsidigt). I 2 × 2-designen motsvarar det cirka 788 deltagare totalt för en huvudeffekt; en interaktion av samma storlek kräver väsentligt fler. Piloten om cirka 80 deltagare är teknisk och ska inte användas för hypotesprövning.<\/li><li><b>Begränsning:<\/b> fler propositioner ger inte fler oberoende regeringsperioder.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<ul><li>Reliabilitet: alfa ≥ 0,80 ger fortsättning, 0,67–0,79 ger revidering och ny pilot, under 0,67 stoppas huvudkodningen.<\/li><li>Om ja-röster är det enda inflytandemåttet revideras designen.<\/li><li>Om bara slutliga beslut finns tillgängliga begränsas slutsatsen till dem.<\/li><li>Om etablerad koalitions- och implementeringsforskning redan täcker frågan absorberas fallet som tillämpning.<\/li><\/ul>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p>Nyckelreferenser (bibliografiska uppgifter verifierade mot DOI-registret och förlagens metadata 2026-11-25):<\/p>\n<ul><li><b>Strøm (1984):<\/b> minoritetsregeringar som rationellt val snarare än kris.<\/li><li><b>Thürk (2022):<\/b> minoritetsregeringars lagstiftningsprestation och betydelsen av stödpartier.<\/li><li><b>Bäck och Hellström (2022):<\/b> minoritetsregerande i Sverige.<\/li><li><b>Green-Pedersen och Skjæveland (2020):<\/b> dansk regeringspraktik och samförståndspolitik.<\/li><li><b>Martin och Vanberg (2004):<\/b> hur koalitionspartier använder parlamentarisk granskning för att bevaka överenskommelser.<\/li><li><b>Powell och Whitten (1993):<\/b> ansvarstydlighet (clarity of responsibility) villkorar väljarnas ansvarsutkrävande.<\/li><li><b>Tyler (2006):<\/b> procedurell rättvisa som grund för legitimitet.<\/li><li><b>Esaiasson, Gilljam och Persson (2012):<\/b> fältexperiment om vilka beslutsformer som ger starkast legitimitetsbedömning, även hos dem som inte får sin vilja igenom.<\/li><\/ul>\n<p>Det är väl belagt att minoritetsregeringar kan vara stabila och lagstiftningsmässigt effektiva, att ansvarstydlighet påverkar ansvarsutkrävande och att procedurer påverkar beslutsacceptans. Det möjliga bidraget är smalare: en gemensam mätning av förhandlingsinkludering, faktiskt genomförande (inklusive tid i förhållande till problemets tidsfönster) och medborgares legitimitetsbedömning i samma ärenden.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Inventera samtliga regeringsförslag inom de valda åren och sakområdena innan några utfall kodas. För söklogg.<\/li><li>Dra ett reproducerbart urval om 24 ärenden och låt två kodare koda oberoende, med implementeringsutfallen dolda.<\/li><li>Genomför kognitiva intervjuer och en teknisk pilot av vinjett A.<\/li><li>Förregistrera H4 med vinjett A och fastställ minsta meningsfulla effekt och styrkeanalys utifrån planeringsförslaget ovan.<\/li><li>Bredda litteratursökningen (coalition governance, policy implementation, clarity of responsibility, procedural legitimacy) innan något nyhetsanspråk görs.<\/li><\/ol>\n<h4>Referenser<\/h4>\n<p>Bäck, H., &amp; Hellström, J. (2022). Minority governments in Sweden. I B. N. Field &amp; S. Martin (Red.), *Minority governments in comparative perspective* (s. 129–148). Oxford University Press. https://doi.org/10.1093/oso/9780192871657.003.0007<\/p>\n<p>Esaiasson, P., Gilljam, M., &amp; Persson, M. (2012). Which decision-making arrangements generate the strongest legitimacy beliefs? Evidence from a randomised field experiment. *European Journal of Political Research, 51*(6), 785–808. https://doi.org/10.1111/j.1475-6765.2011.02052.x<\/p>\n<p>Green-Pedersen, C., &amp; Skjæveland, A. (2020). Governments in action. I P. Munk Christiansen, J. Elklit &amp; P. Nedergaard (Red.), *The Oxford handbook of Danish politics* (s. 229–241). Oxford University Press. https://doi.org/10.1093/oxfordhb/9780198833598.013.13<\/p>\n<p>Martin, L. W., &amp; Vanberg, G. (2004). Policing the bargain: Coalition government and parliamentary scrutiny. *American Journal of Political Science, 48*(1), 13–27. https://doi.org/10.1111/j.0092-5853.2004.00053.x<\/p>\n<p>Powell, G. B., &amp; Whitten, G. D. (1993). A cross-national analysis of economic voting: Taking account of the political context. *American Journal of Political Science, 37*(2), 391–414. https://doi.org/10.2307/2111378<\/p>\n<p>Strøm, K. (1984). Minority governments in parliamentary democracies: The rationality of nonwinning cabinet solutions. *Comparative Political Studies, 17*(2), 199–227. https://doi.org/10.1177/0010414084017002004<\/p>\n<p>Thürk, M. (2022). Small in size but powerful in parliament? The legislative performance of minority governments. *Legislative Studies Quarterly, 47*(1), 193–224. https://doi.org/10.1111/lsq.12329<\/p>\n<p>Tyler, T. R. (2006). Psychological perspectives on legitimacy and legitimation. *Annual Review of Psychology, 57*, 375–400. https://doi.org/10.1146/annurev.psych.57.102904.190038<\/p>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li>Etikprövning och dataskyddsplan (politiska åsikter är känsliga personuppgifter).<\/li><li>Den danska jämförelsen är bara planerad; urval och källor för danska ärenden är inte fastställda.<\/li><li>Fulltextläsning av referenserna, varav flera ligger bakom betalvägg, och en systematisk litteratursökning med söklogg.<\/li><li>Arkivering i daterad version av webbsidor och dokument som används vid datainsamlingen.<\/li><li>Fastställande av minsta meningsfulla effekt, styrkeanalys och analysplan vid förregistrering.<\/li><li>Prövning i piloten av att tidsfönster för rate mismatch går att koda reliabelt.<\/li><\/ul>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID: CS-CB-02.<\/li><li>Utgångspunkten beskrivs generiskt; beroendet av en oidentifierad utgångstext är borttaget.<\/li><li>Litteraturavsnittet omskrivet med åtta verifierade referenser; avsnittet Referenser (APA 7, med DOI) tillagt.<\/li><li>Rivalförklaring och kompletterande falsifieringsregel för H6 tillagda.<\/li><li>Rate mismatch operationaliserat som tidsmått (dagar från beslut till verifierad start i förhållande till problemets tidsfönster).<\/li><li>Planeringsförslag för minsta effekt och styrka tillagt.<\/li><li>\"Måste åtgärdas före extern publicering\" ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"Form of cooperation, parliamentary support and implemented policy","he":"<p><b>Case ID:<\/b> CS-CB-02 (original: no ID) · <b>Starting point:<\/b> public debate in autumn 2026, developed in a research memorandum (v0.1, 2026-11-08) · <b>Status:<\/b> Design, not tested (no data collected)<\/p>\n<h4>Question<\/h4>\n<p>Under what conditions do the form of cooperation, actual parliamentary support and administrative capacity affect a government's ability to implement policy, while transparency, accountability and legitimate opposition are preserved?<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>Seat share → actual support (support agreements, access to negotiations) → adopted decision → funding, responsibility and agency resources → implemented and usable public intervention. Being tolerated as a government (negative parliamentarism) is not the same as getting a particular reform passed. Nor is an adopted reform the same as an intervention that works in practice. Each link is to be measured separately, and the number of meetings or final yes votes is not sufficient as evidence of influence.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Formal capacity:<\/b> seat share, government status and formal rules (the Instrument of Government (regeringsformen, RF) 1:9, Chapters 11 and 12).<\/li><li><b>Realised capacity:<\/b> actual start, delay in days against plan and attainment of operational targets.<\/li><li><b>Moving Map:<\/b> all four dimensions are operationalised: the actor's changed demands for cooperation, the observer's changed preference, a changed perception of normal negotiating practice and a changed personal boundary for permissible procedures. Only H8 tests a change over time.<\/li><li><b>Rate mismatch (added in revision):<\/b> measured per reform case as the ratio of implementation time to the problem's time window. Implementation time = number of days from the formal decision (Riksdag decision or government decision) to the verified start of the intervention according to the agency's own monitoring. The problem's time window = the deadline or date that the government bill, the committee report or the appropriation directions (regleringsbrev) themselves specify for when the intervention is needed. A ratio &gt; 1 is coded as rate mismatch; cases with no stated time window are coded \"not assessable\". The same reliability requirements as for the rest of the coding apply.<\/li><\/ul>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Documented inclusion in negotiations explains implementation better than minority or majority status<\/td><td>Simple reforms invite more participants<\/td><td>The association disappears among cases of comparable difficulty<\/td><\/tr><tr><td>H2<\/td><td>Parties with verifiable impact support later implementation stages<\/td><td>The parties agreed from the outset<\/td><td>Positions held before the negotiations explain the support<\/td><\/tr><tr><td>H3<\/td><td>Support agreements increase predictability but reduce other parties' access<\/td><td>Cohesive parties choose both agreements and stability<\/td><td>Predictability without reduced access (contradicts the second part)<\/td><\/tr><tr><td>H4<\/td><td>An inclusive and traceable process increases perceived legitimacy even when the outcome is identical<\/td><td>Positively loaded wording<\/td><td>No difference with neutral wording and checked comprehension<\/td><\/tr><tr><td>H5<\/td><td>Broad cooperation with clear responsibility for funding and implementation results in fewer delays<\/td><td>Administrative capacity precedes both<\/td><td>Equally many delays without clear responsibility<\/td><\/tr><tr><td>H6<\/td><td>An open process increases legitimacy even among those who lose on the substance<\/td><td>Party loyalty: losers who sympathise with the deciding parties assess the process positively regardless of openness (added in revision)<\/td><td>Only those already positive respond; the effect disappears when party sympathy with the decision-makers is controlled for (added in revision)<\/td><\/tr><tr><td>H7<\/td><td>Democratic quality follows actual protection of impartiality, not seat share (two-sided test)<\/td><td>Corruption and institutional weakness also shape the form of government<\/td><td>Cannot be settled causally with few governments<\/td><\/tr><tr><td>H8<\/td><td>Neutral information changes perceived normality before one's own preference<\/td><td>Recognition or a desire to give the right answer<\/td><td>No temporal ordering in a panel with a control group<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Open:<\/b> documents of the Riksdag, committee reports and votes, budget decisions, agency monitoring, the Instrument of Government (regeringsformen), official descriptions by the Riksdag and the Folketing.<\/li><li><b>Own coding:<\/b> pilot with 24 reform cases (2019 and 2023, transport and social insurance), followed for twelve months. Codes for support arrangement (SUP0–3), access (INV), influence (INF0–2), resources, outcome and rate mismatch.<\/li><li><b>Own data collection:<\/b> 8–12 cognitive interviews and a technical vignette pilot with approximately 80 participants (2 × 2 design). Political opinions are sensitive personal data.<\/li><li><b>Minimum effect and power (planning proposal, added in revision; to be fixed at preregistration):<\/b> smallest meaningful effect d = 0.20 for H4. A comparison between two groups requires approximately 394 participants per group at 80% power and α = 0.05 (two-sided). In the 2 × 2 design this corresponds to approximately 788 participants in total for a main effect; an interaction of the same size requires substantially more. The pilot of approximately 80 participants is technical and is not to be used for hypothesis testing.<\/li><li><b>Limitation:<\/b> more government bills do not yield more independent government terms.<\/li><\/ul>\n<h4>Stop rules – what would defeat the case<\/h4>\n<ul><li>Reliability: alpha ≥ 0.80 leads to continuation, 0.67–0.79 leads to revision and a new pilot, and below 0.67 the main coding is stopped.<\/li><li>If yes votes are the only measure of influence, the design is revised.<\/li><li>If only final decisions are available, the conclusion is restricted to them.<\/li><li>If established research on coalitions and implementation already covers the question, the case is absorbed as an application.<\/li><\/ul>\n<h4>Established research and what may be new<\/h4>\n<p>Key references (bibliographic details verified against the DOI registry and publishers' metadata on 2026-11-25):<\/p>\n<ul><li><b>Strøm (1984):<\/b> minority governments as a rational choice rather than a crisis.<\/li><li><b>Thürk (2022):<\/b> the legislative performance of minority governments and the importance of support parties.<\/li><li><b>Bäck and Hellström (2022):<\/b> minority government in Sweden.<\/li><li><b>Green-Pedersen and Skjæveland (2020):<\/b> Danish government practice and consensus politics.<\/li><li><b>Martin and Vanberg (2004):<\/b> how coalition parties use parliamentary scrutiny to police agreements.<\/li><li><b>Powell and Whitten (1993):<\/b> clarity of responsibility conditions voters' ability to hold governments to account.<\/li><li><b>Tyler (2006):<\/b> procedural justice as a basis for legitimacy.<\/li><li><b>Esaiasson, Gilljam and Persson (2012):<\/b> field experiment on which decision-making arrangements generate the strongest legitimacy beliefs, including among those who do not get their way.<\/li><\/ul>\n<p>It is well established that minority governments can be stable and legislatively effective, that clarity of responsibility affects accountability and that procedures affect the acceptance of decisions. The possible contribution is narrower: a joint measurement of inclusion in negotiations, actual implementation (including time relative to the problem's time window) and citizens' legitimacy assessments in the same cases.<\/p>\n<h4>First steps for a researcher wishing to test the case<\/h4>\n<ol><li>Inventory all government proposals within the selected years and policy areas before any outcomes are coded. Keep a search log.<\/li><li>Draw a reproducible sample of 24 cases and have two coders code them independently, with the implementation outcomes concealed.<\/li><li>Conduct cognitive interviews and a technical pilot of vignette A.<\/li><li>Preregister H4 with vignette A and fix the smallest meaningful effect and the power analysis on the basis of the planning proposal above.<\/li><li>Broaden the literature search (coalition governance, policy implementation, clarity of responsibility, procedural legitimacy) before any novelty claim is made.<\/li><\/ol>\n<h4>References<\/h4>\n<p>Bäck, H., &amp; Hellström, J. (2022). Minority governments in Sweden. In B. N. Field &amp; S. Martin (Eds.), *Minority governments in comparative perspective* (pp. 129–148). Oxford University Press. https://doi.org/10.1093/oso/9780192871657.003.0007<\/p>\n<p>Esaiasson, P., Gilljam, M., &amp; Persson, M. (2012). Which decision-making arrangements generate the strongest legitimacy beliefs? Evidence from a randomised field experiment. *European Journal of Political Research, 51*(6), 785–808. https://doi.org/10.1111/j.1475-6765.2011.02052.x<\/p>\n<p>Green-Pedersen, C., &amp; Skjæveland, A. (2020). Governments in action. In P. Munk Christiansen, J. Elklit &amp; P. Nedergaard (Eds.), *The Oxford handbook of Danish politics* (pp. 229–241). Oxford University Press. https://doi.org/10.1093/oxfordhb/9780198833598.013.13<\/p>\n<p>Martin, L. W., &amp; Vanberg, G. (2004). Policing the bargain: Coalition government and parliamentary scrutiny. *American Journal of Political Science, 48*(1), 13–27. https://doi.org/10.1111/j.0092-5853.2004.00053.x<\/p>\n<p>Powell, G. B., &amp; Whitten, G. D. (1993). A cross-national analysis of economic voting: Taking account of the political context. *American Journal of Political Science, 37*(2), 391–414. https://doi.org/10.2307/2111378<\/p>\n<p>Strøm, K. (1984). Minority governments in parliamentary democracies: The rationality of nonwinning cabinet solutions. *Comparative Political Studies, 17*(2), 199–227. https://doi.org/10.1177/0010414084017002004<\/p>\n<p>Thürk, M. (2022). Small in size but powerful in parliament? The legislative performance of minority governments. *Legislative Studies Quarterly, 47*(1), 193–224. https://doi.org/10.1111/lsq.12329<\/p>\n<p>Tyler, T. R. (2006). Psychological perspectives on legitimacy and legitimation. *Annual Review of Psychology, 57*, 375–400. https://doi.org/10.1146/annurev.psych.57.102904.190038<\/p>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li>Ethical review and a data protection plan (political opinions are sensitive personal data).<\/li><li>The Danish comparison is only planned; the sample and sources for Danish cases have not been determined.<\/li><li>Full-text reading of the references, several of which are behind a paywall, and a systematic literature search with a search log.<\/li><li>Archiving of dated versions of the web pages and documents used in data collection.<\/li><li>Determination of the smallest meaningful effect, the power analysis and the analysis plan at preregistration.<\/li><li>Testing in the pilot whether time windows for rate mismatch can be coded reliably.<\/li><\/ul>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID: CS-CB-02.<\/li><li>The starting point is described generically; the dependence on an unidentified source text has been removed.<\/li><li>Literature section rewritten with eight verified references; References section (APA 7, with DOIs) added.<\/li><li>Rival explanation and supplementary falsification rule for H6 added.<\/li><li>Rate mismatch operationalised as a time measure (days from decision to verified start relative to the problem's time window).<\/li><li>Planning proposal for minimum effect and power added.<\/li><li>\"Must be addressed before external publication\" replaced by \"Remaining before empirical testing\".<\/li><\/ul>"},{"n":"03","id":"03_koalitionsgranser","t":"Partiers positionsförändring, referenspunkter och samarbetsgränser","h":"<p><b>Fall-ID:<\/b> CS-CB-03 (ursprungligt: CS-MM-CASE-022) · <b>Utgångspunkt:<\/b> intern fallnot i FieldShift-programmet (v0.2, 2026-10-12) · <b>Status:<\/b> Design, ej prövad (ingen data insamlad)<\/p>\n<h4>Fråga<\/h4>\n<p>Ett parti kan bedömas som mer extremt för att målpartiet har ändrat sig. Det kan också bero på att bedömarens egen position eller referenspunkt har flyttats, eller på att etiketten används taktiskt. Hur skiljer man dessa förklaringar åt? Och hur påverkar uttalade samarbetsgränser vilka parlamentariska uppgörelser som faktiskt är möjliga? Utgångspunkten är en debattartikel om C och V. Artikelns sakpåståenden (om positionsförändring, väljarpreferenser och kontakter med organiserade intressen) är inte oberoende belagda och behandlas enbart som påståenden att pröva.<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>mandatfördelning → investiturregler → uttalade samarbetsgränser → möjliga konstellationer → faktiska uppgörelser och genomförande. Formellt kan många majoriteter bildas i riksdagen. Varje uttalad samarbetsgräns tar bort konstellationer innan någon förhandling har börjat. Enligt regeringsformen godkänns ett statsministerförslag om inte mer än hälften av riksdagens ledamöter (minst 175 av 349) röstar nej. Därför måste nej-röster, nedlagda röster och externa stödpartier modelleras var för sig.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Formell kapacitet:<\/b> mandat och regler för regeringsbildning, budget och omröstningar.<\/li><li><b>Realiserad kapacitet:<\/b> faktiskt genomförda uppgörelser, policyinflytande utan ministerposter (förhandskrav → avtal → genomförande) och lokala sakuppgörelser.<\/li><li><b>Moving Map:<\/b> Actor Movement (målpartiets rörelse), Observer Movement och Reference-Point Shift (bedömarens rörelse eller referensram), Legitimacy-Boundary Shift (gränsen för godtagbart samarbete). Det här är materialets tydligaste exempel på att komponenterna kan separeras.<\/li><li><b>Rate mismatch:<\/b> behandlas inte i dokumentet.<\/li><li><b>DemShift:<\/b> villkorad. Positionsförändring och samarbetsvägran räknas uttryckligen inte som demokratisk erosion.<\/li><\/ul>\n<h5>Relativ position och avstånd (rekonstruerad i revision)<\/h5>\n<p>Källtextens formler saknas. Definitionen är återskapad.<\/p>\n<ul><li>p_P,t = parti P:s position vid tid t; r_O,t = bedömaren O:s position eller referenspunkt. Båda på samma skala och dimension (ekonomisk och kulturell hålls isär).<\/li><li>Observerat avstånd: <b>d_t = |p_P,t − r_O,t|<\/b>, och <b>Δd = d_t1 − d_t0<\/b>.<\/li><li>Partiets rörelse <b>Δp_P = p_P,t1 − p_P,t0<\/b>; bedömarens rörelse <b>Δr_O = r_O,t1 − r_O,t0<\/b>.<\/li><li>Om P ligger på samma sida om O vid båda tidpunkterna gäller <b>Δd = s · (Δp_P − Δr_O)<\/b>, där s = +1 om P ligger till höger om O och −1 annars. Byter de ordning används det förtecknade avståndet.<\/li><li><b>Mätning:<\/b> partier ur CHES eller Manifesto; bedömare ur självplacering i enkäter (eller CHES/Manifesto om bedömaren är ett parti). Expert- och väljarskalor måste förankras, till exempel genom att samma respondenter placerar både sig själva och partierna.<\/li><li>Den del av en ändrad bedömning (\"för vänster\", \"extrem\") som Δp_P och Δr_O inte förklarar är kandidat för etikett- eller gränsförskjutning.<\/li><\/ul>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Bedömarpartiets ekonomiska positionsförändring föregår att målpartiet oftare beskrivs som \"för vänster\", även när målpartiets egen position mäts<\/td><td>Målpartiet har flyttat sig, eller nya sakfrågor dominerar. Expertbedömningarna påverkas själva av debattens etiketter (tillagd i revision).<\/td><td>Ingen tillräcklig rörelse på jämförbara mått, eller omvänd tidsordning<\/td><\/tr><tr><td>H2<\/td><td>Randomiserad information om bedömarens referensposition ändrar uppfattat avstånd till ett konstant hypotetiskt parti<\/td><td>Deltagarna tror att målpartiet ändrats. Effekten drivs av partiidentifikation, inte referensposition (tillagd i revision).<\/td><td>Ett precist intervall som utesluter minsta relevanta effekt<\/td><\/tr><tr><td>H3<\/td><td>Fler bindande samarbetsgränser ger färre möjliga uppgörelser<\/td><td>Tillfällig förhandlingstaktik. Mandatläget utesluter redan konstellationerna oavsett gränser (tillagd i revision).<\/td><td>Inga konstellationer faller bort, eller gränserna gäller en annan samarbetsform<\/td><\/tr><tr><td>H4<\/td><td>Partietiketter påverkar bedömningen av identiska normbrott (tvåsidig)<\/td><td>Olika uppfattning om själva händelsen<\/td><td>Normbedömningen följer beteendet lika väl med och utan etikett<\/td><\/tr><tr><td>H5<\/td><td>Rättighetsförnekelse plus normbrott ger förvarning om institutionell försämring utöver en basmodell<\/td><td>En gemensam kris driver både retorik och ingrepp<\/td><td>Ingen förbättring på framtida testdata eller för många falsklarm<\/td><\/tr><tr><td>H6<\/td><td>Avståndet mellan partiledning och väljare har ökat<\/td><td>Väljarbasen byts ut<\/td><td>Gemensam rörelse eller inget ökande gap<\/td><\/tr><tr><td>H7<\/td><td>Lokala aktörer gör oftare sakuppgörelser än nationella<\/td><td>Lokala sakfrågor och mandatlägen skiljer sig<\/td><td>Likvärdigt eller lägre lokalt samarbete efter jämförbarhetskontroll<\/td><\/tr><tr><td>H8<\/td><td>Antalet ministerposter lämnar policyinflytande oförklarat, medan stödavtal tillför information<\/td><td>Regeringen önskade redan samma policy<\/td><td>Inget inkrementellt förklaringsvärde<\/td><\/tr><tr><td>H9<\/td><td>Förståelse för motpartens kostnader och tydlig riskdelning ökar viljan till uppgörelse<\/td><td>Garantier gör avtalet bättre utan ändrat förtroende<\/td><td>Förståelsen ökar men samarbetsviljan gör det inte<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Öppna data:<\/b> CHES Europe trend file 1999–2024, Manifesto Project main dataset (inklusive RILE, med kända begränsningar), V-Party codebook v2 (2022) och dataset, V-Dem, riksdagens voteringar och regler, Valmyndighetens valresultat, partiernas originalbesked.<\/li><li><b>Mål för inventering:<\/b> minst 24 positionsdokument och 120 händelseposter (val 2006–2026, regeringsbildningar 2018, 2022 och 2026).<\/li><li><b>Kräver egen insamling:<\/b> experimenten för H2, H4 och H9 (vinjetter med hypotetiska partier), väljar- och medlemsdata för H6, en inventering av kommunala uppgörelser för H7. Enkäter om partisympati är personuppgifter om politiska åsikter och kräver etikprövning.<\/li><li><b>Begränsning:<\/b> CHES och V-Party täcker inte 2026.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<ul><li>Utan jämförbara positionsankare för båda partierna kan referensrörelse inte identifieras. Då revideras period eller analysnivå.<\/li><li>Om policykonflikt rutinmässigt kodas som antipluralism stoppas huvudanalysen.<\/li><li>Låg reliabilitet (föreslagen gräns: Krippendorffs alfa 0,80 före adjudicering) kräver nytt material.<\/li><li>Utan förbättring jämfört med basmodellen stannar H5 i forskningsläge.<\/li><li>Konstruktstresstest ska göras först. Om instrumentet blandar ihop \"målpartiet rör sig\", \"bedömaren rör sig\" och \"bara etiketten ändras\" ska det revideras.<\/li><li>Om CHES och Manifesto ger motsatt riktning för Δp_P för samma parti och period, rapporteras dekomponeringen som obestämd för det paret (tillagd i revision).<\/li><li>Om Δp_P och Δr_O tillsammans förklarar nästan hela förändringen i bedömningen, finns inget utrymme för etikett- eller gränsförskjutning, och den delen av fallet faller (tillagd i revision).<\/li><\/ul>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p><b>Nyckelreferenser (verifierade mot DOI-register 2026-11-25):<\/b><\/p>\n<ul><li>Kongruens, vetospelare och partisystem: Huber &amp; Powell (1994), Tsebelis (1995), Katz &amp; Mair (1995).<\/li><li>Radikala högerpartier, utestängning (cordon sanitaire) och etablerade partiers strategier: Meguid (2005), van Spanje &amp; van der Brug (2007).<\/li><li>Väljares uppfattning om partipositioner: Adams, Ezrow &amp; Somer-Topcu (2011).<\/li><li>Mätning av partipositioner: Lowe m.fl. (2011) för Manifesto-data, Jolly m.fl. (2022) för CHES.<\/li><li>Partilojalitet framför demokratiska principer: Graham &amp; Svolik (2020, USA).<\/li><\/ul>\n<p>Etablerat är att partipositioner kan mätas med expertbedömningar och partiprogram, att väljares uppfattning om positioner inte alltid följer faktisk förändring, och att utestängning och etablerade partiers strategier påverkar radikala partier. Det möjliga bidraget är en tidsordnad, reproducerbar separation av partiets rörelse, bedömarens rörelse, etikettering och samarbetsgränser på samma skala. Nyhetsanspråket är preliminärt tills en fulltextgenomgång är gjord.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Ta fram positionsankare för C och V, och för övriga riksdagspartier som jämförelse, ur CHES och Manifesto. Håll ekonomiska och kulturella dimensioner separata.<\/li><li>Frys kodboken och en urvalsram som inte styrs av utfallen, och kör stresstestet av konstrukterna.<\/li><li>Låt två kodare oberoende koda 120 stratifierade händelseposter och beräkna alfa före adjudicering.<\/li><li>Gör kognitiva intervjuer med 8–12 personer om begreppen extrem, samarbeta och regeringsstöd.<\/li><li>Förregistrera H2 som ett isolerat experiment med hypotetiska partier.<\/li><\/ol>\n<h4>Referenser<\/h4>\n<p>Adams, J., Ezrow, L., &amp; Somer-Topcu, Z. (2011). Is anybody listening? Evidence that voters do not respond to European parties' policy statements during elections. *American Journal of Political Science, 55*(2), 370–382. https://doi.org/10.1111/j.1540-5907.2010.00489.x<\/p>\n<p>Graham, M. H., &amp; Svolik, M. W. (2020). Democracy in America? Partisanship, polarization, and the robustness of support for democracy in the United States. *American Political Science Review, 114*(2), 392–409. https://doi.org/10.1017/S0003055420000052<\/p>\n<p>Huber, J. D., &amp; Powell, G. B. (1994). Congruence between citizens and policymakers in two visions of liberal democracy. *World Politics, 46*(3), 291–326. https://doi.org/10.2307/2950684<\/p>\n<p>Jolly, S., Bakker, R., Hooghe, L., Marks, G., Polk, J., Rovny, J., Steenbergen, M., &amp; Vachudova, M. A. (2022). Chapel Hill Expert Survey trend file, 1999–2019. *Electoral Studies, 75*, Artikel 102420. https://doi.org/10.1016/j.electstud.2021.102420<\/p>\n<p>Katz, R. S., &amp; Mair, P. (1995). Changing models of party organization and party democracy: The emergence of the cartel party. *Party Politics, 1*(1), 5–28. https://doi.org/10.1177/1354068895001001001<\/p>\n<p>Lowe, W., Benoit, K., Mikhaylov, S., &amp; Laver, M. (2011). Scaling policy preferences from coded political texts. *Legislative Studies Quarterly, 36*(1), 123–155. https://doi.org/10.1111/j.1939-9162.2010.00006.x<\/p>\n<p>Meguid, B. M. (2005). Competition between unequals: The role of mainstream party strategy in niche party success. *American Political Science Review, 99*(3), 347–359. https://doi.org/10.1017/S0003055405051701<\/p>\n<p>Tsebelis, G. (1995). Decision making in political systems: Veto players in presidentialism, parliamentarism, multicameralism and multipartyism. *British Journal of Political Science, 25*(3), 289–325. https://doi.org/10.1017/S0007123400007225<\/p>\n<p>van Spanje, J., &amp; van der Brug, W. (2007). The party as pariah: The exclusion of anti-immigration parties and its effect on their ideological positions. *West European Politics, 30*(5), 1022–1040. https://doi.org/10.1080/01402380701617431<\/p>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li><b>Etikprövning<\/b> för enkäter och experiment om politiska åsikter (H2, H4, H6, H9).<\/li><li><b>Dataåtkomst:<\/b> väljar- och medlemsdata (H6) och inventering av kommunala uppgörelser (H7). CHES och V-Party täcker inte 2026.<\/li><li><b>Prövning av källartikelns påståenden<\/b> mot oberoende data.<\/li><li><b>Fulltextläsning<\/b> av referenser bakom betalvägg innan nyhetsanspråk görs.<\/li><li><b>Skalförankring<\/b> mellan expertskala och självplacering, testad i data.<\/li><li><b>Styrkeberäkning<\/b> för H2, H4 och H9, som kräver pilotdata.<\/li><li><b>Reliabilitetskodning<\/b> av 120 händelseposter.<\/li><\/ul>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID CS-CB-03 (ursprungligt CS-MM-CASE-022).<\/li><li>Definition av relativ position och avstånd återskapad och märkt.<\/li><li>Interna parametrar och korsreferens till internt fall finns inte i kortet och har inte förts in i definitionen.<\/li><li>Källartikelns sakpåståenden omformulerade till påståenden att pröva; investiturregeln preciserad enligt regeringsformen 6 kap. 4 §.<\/li><li>Forskningsavsnittet omskrivet med nio referenser verifierade mot doi.org/Crossref; Referenser i APA 7 tillagda.<\/li><li>Tre rivalförklaringar och två stoppregler tillagda och märkta.<\/li><li>\"Måste åtgärdas\" ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"Party position change, reference points and cooperation boundaries","he":"<p><b>Case ID:<\/b> CS-CB-03 (original: CS-MM-CASE-022) · <b>Starting point:<\/b> internal case note in the FieldShift programme (v0.2, 2026-10-12) · <b>Status:<\/b> Design, not tested (no data collected)<\/p>\n<h4>Question<\/h4>\n<p>A party may be judged more extreme because the target party has changed. It may also be because the assessor's own position or reference point has shifted, or because the label is being used tactically. How can these explanations be distinguished? And how do stated cooperation boundaries affect which parliamentary agreements are actually possible? The starting point is an opinion piece about C (Centre Party) and V (Left Party). The article's factual claims (about position change, voter preferences and contacts with organised interests) have not been independently substantiated and are treated solely as claims to be tested.<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>seat distribution → investiture rules → stated cooperation boundaries → possible constellations → actual agreements and implementation. Formally, many majorities can be formed in the Riksdag. Each stated cooperation boundary removes constellations before any negotiation has begun. Under the Instrument of Government (regeringsformen), a proposed Prime Minister is approved unless more than half of the members of the Riksdag (at least 175 of 349) vote against. No votes, abstentions and external support parties must therefore be modelled separately.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Formal capacity:<\/b> seats and rules for government formation, the budget and votes.<\/li><li><b>Realised capacity:<\/b> agreements actually implemented, policy influence without ministerial posts (prior demands → agreement → implementation) and local policy agreements.<\/li><li><b>Moving Map:<\/b> Actor Movement (the target party's movement), Observer Movement and Reference-Point Shift (the assessor's movement or frame of reference), Legitimacy-Boundary Shift (the boundary of acceptable cooperation). This is the clearest example in the material of the components being separable.<\/li><li><b>Rate mismatch:<\/b> not addressed in the document.<\/li><li><b>DemShift:<\/b> conditional. Position change and refusal to cooperate are explicitly not counted as democratic erosion.<\/li><\/ul>\n<h5>Relative position and distance (reconstructed in revision)<\/h5>\n<p>The formulas in the source text are missing. The definition has been reconstructed.<\/p>\n<ul><li>p_P,t = party P's position at time t; r_O,t = assessor O's position or reference point. Both on the same scale and dimension (economic and cultural are kept separate).<\/li><li>Observed distance: <b>d_t = |p_P,t − r_O,t|<\/b>, and <b>Δd = d_t1 − d_t0<\/b>.<\/li><li>The party's movement <b>Δp_P = p_P,t1 − p_P,t0<\/b>; the assessor's movement <b>Δr_O = r_O,t1 − r_O,t0<\/b>.<\/li><li>If P is on the same side of O at both time points, <b>Δd = s · (Δp_P − Δr_O)<\/b>, where s = +1 if P is to the right of O and −1 otherwise. If they change order, the signed distance is used.<\/li><li><b>Measurement:<\/b> parties from CHES or Manifesto; assessors from self-placement in surveys (or CHES/Manifesto if the assessor is a party). Expert and voter scales must be anchored, for example by having the same respondents place both themselves and the parties.<\/li><li>The part of a changed assessment (\"too left-wing\", \"extreme\") that Δp_P and Δr_O do not explain is a candidate for a label or boundary shift.<\/li><\/ul>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>The assessor party's economic position change precedes the target party being described more often as \"too left-wing\", even when the target party's own position is measured<\/td><td>The target party has moved, or new issues dominate. The expert assessments are themselves influenced by the labels used in the debate (added in revision).<\/td><td>No sufficient movement on comparable measures, or reversed temporal order<\/td><\/tr><tr><td>H2<\/td><td>Randomised information about the assessor's reference position changes the perceived distance to a constant hypothetical party<\/td><td>Participants believe that the target party has changed. The effect is driven by party identification, not reference position (added in revision).<\/td><td>A precise interval that excludes the smallest relevant effect<\/td><\/tr><tr><td>H3<\/td><td>More binding cooperation boundaries yield fewer possible agreements<\/td><td>Temporary negotiating tactics. The parliamentary arithmetic already rules out the constellations regardless of boundaries (added in revision).<\/td><td>No constellations drop out, or the boundaries apply to a different form of cooperation<\/td><\/tr><tr><td>H4<\/td><td>Party labels affect the assessment of identical norm violations (two-sided)<\/td><td>Differing perceptions of the event itself<\/td><td>The normative assessment tracks the behaviour equally well with and without a label<\/td><\/tr><tr><td>H5<\/td><td>Denial of rights plus norm violations provides early warning of institutional deterioration beyond a baseline model<\/td><td>A common crisis drives both the rhetoric and the interventions<\/td><td>No improvement on future test data, or too many false alarms<\/td><\/tr><tr><td>H6<\/td><td>The distance between party leadership and voters has increased<\/td><td>The voter base is being replaced<\/td><td>Joint movement or no widening gap<\/td><\/tr><tr><td>H7<\/td><td>Local actors make policy agreements more often than national actors<\/td><td>Local issues and seat distributions differ<\/td><td>Equivalent or lower local cooperation after controlling for comparability<\/td><\/tr><tr><td>H8<\/td><td>The number of ministerial posts leaves policy influence unexplained, whereas support agreements add information<\/td><td>The government already wanted the same policy<\/td><td>No incremental explanatory value<\/td><\/tr><tr><td>H9<\/td><td>Understanding of the counterpart's costs and clear risk-sharing increase willingness to reach an agreement<\/td><td>Guarantees make the agreement better without any change in trust<\/td><td>Understanding increases but willingness to cooperate does not<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Open data:<\/b> CHES Europe trend file 1999–2024, Manifesto Project main dataset (including RILE, with known limitations), V-Party codebook v2 (2022) and dataset, V-Dem, the Riksdag's votes and rules, election results from the Swedish Election Authority (Valmyndigheten), the parties' original statements.<\/li><li><b>Inventory targets:<\/b> at least 24 position documents and 120 event records (elections 2006–2026, government formations 2018, 2022 and 2026).<\/li><li><b>Requires own data collection:<\/b> the experiments for H2, H4 and H9 (vignettes with hypothetical parties), voter and member data for H6, an inventory of municipal agreements for H7. Surveys on party sympathy involve personal data on political opinions and require ethical review.<\/li><li><b>Limitation:<\/b> CHES and V-Party do not cover 2026.<\/li><\/ul>\n<h4>Stop rules – what would defeat the case<\/h4>\n<ul><li>Without comparable position anchors for both parties, reference movement cannot be identified. In that case the period or level of analysis is revised.<\/li><li>If policy conflict is routinely coded as anti-pluralism, the main analysis is stopped.<\/li><li>Low reliability (proposed threshold: Krippendorff's alpha 0.80 before adjudication) requires new material.<\/li><li>Without an improvement over the baseline model, H5 remains at the research stage.<\/li><li>A construct stress test is to be carried out first. If the instrument conflates \"the target party moves\", \"the assessor moves\" and \"only the label changes\", it is to be revised.<\/li><li>If CHES and Manifesto give opposite directions of Δp_P for the same party and period, the decomposition is reported as indeterminate for that pair (added in revision).<\/li><li>If Δp_P and Δr_O together explain almost the entire change in assessment, there is no room for a label or boundary shift, and that part of the case falls (added in revision).<\/li><\/ul>\n<h4>Established research and what may be new<\/h4>\n<p><b>Key references (verified against the DOI registry on 2026-11-25):<\/b><\/p>\n<ul><li>Congruence, veto players and party systems: Huber &amp; Powell (1994), Tsebelis (1995), Katz &amp; Mair (1995).<\/li><li>Radical right parties, exclusion (cordon sanitaire) and mainstream party strategies: Meguid (2005), van Spanje &amp; van der Brug (2007).<\/li><li>Voters' perceptions of party positions: Adams, Ezrow &amp; Somer-Topcu (2011).<\/li><li>Measurement of party positions: Lowe et al. (2011) for Manifesto data, Jolly et al. (2022) for CHES.<\/li><li>Party loyalty over democratic principles: Graham &amp; Svolik (2020, USA).<\/li><\/ul>\n<p>It is established that party positions can be measured with expert assessments and party manifestos, that voters' perceptions of positions do not always follow actual change, and that exclusion and mainstream party strategies affect radical parties. The possible contribution is a time-ordered, reproducible separation of the party's movement, the assessor's movement, labelling and cooperation boundaries on the same scale. The novelty claim is provisional until a full-text review has been completed.<\/p>\n<h4>First steps for a researcher wishing to test the case<\/h4>\n<ol><li>Derive position anchors for C and V, and for the other Riksdag parties for comparison, from CHES and Manifesto. Keep the economic and cultural dimensions separate.<\/li><li>Freeze the codebook and a sampling frame that is not driven by the outcomes, and run the construct stress test.<\/li><li>Have two coders independently code 120 stratified event records and compute alpha before adjudication.<\/li><li>Conduct cognitive interviews with 8–12 people on the concepts extreme, cooperate and government support.<\/li><li>Preregister H2 as an isolated experiment with hypothetical parties.<\/li><\/ol>\n<h4>References<\/h4>\n<p>Adams, J., Ezrow, L., &amp; Somer-Topcu, Z. (2011). Is anybody listening? Evidence that voters do not respond to European parties' policy statements during elections. *American Journal of Political Science, 55*(2), 370–382. https://doi.org/10.1111/j.1540-5907.2010.00489.x<\/p>\n<p>Graham, M. H., &amp; Svolik, M. W. (2020). Democracy in America? Partisanship, polarization, and the robustness of support for democracy in the United States. *American Political Science Review, 114*(2), 392–409. https://doi.org/10.1017/S0003055420000052<\/p>\n<p>Huber, J. D., &amp; Powell, G. B. (1994). Congruence between citizens and policymakers in two visions of liberal democracy. *World Politics, 46*(3), 291–326. https://doi.org/10.2307/2950684<\/p>\n<p>Jolly, S., Bakker, R., Hooghe, L., Marks, G., Polk, J., Rovny, J., Steenbergen, M., &amp; Vachudova, M. A. (2022). Chapel Hill Expert Survey trend file, 1999–2019. *Electoral Studies, 75*, Article 102420. https://doi.org/10.1016/j.electstud.2021.102420<\/p>\n<p>Katz, R. S., &amp; Mair, P. (1995). Changing models of party organization and party democracy: The emergence of the cartel party. *Party Politics, 1*(1), 5–28. https://doi.org/10.1177/1354068895001001001<\/p>\n<p>Lowe, W., Benoit, K., Mikhaylov, S., &amp; Laver, M. (2011). Scaling policy preferences from coded political texts. *Legislative Studies Quarterly, 36*(1), 123–155. https://doi.org/10.1111/j.1939-9162.2010.00006.x<\/p>\n<p>Meguid, B. M. (2005). Competition between unequals: The role of mainstream party strategy in niche party success. *American Political Science Review, 99*(3), 347–359. https://doi.org/10.1017/S0003055405051701<\/p>\n<p>Tsebelis, G. (1995). Decision making in political systems: Veto players in presidentialism, parliamentarism, multicameralism and multipartyism. *British Journal of Political Science, 25*(3), 289–325. https://doi.org/10.1017/S0007123400007225<\/p>\n<p>van Spanje, J., &amp; van der Brug, W. (2007). The party as pariah: The exclusion of anti-immigration parties and its effect on their ideological positions. *West European Politics, 30*(5), 1022–1040. https://doi.org/10.1080/01402380701617431<\/p>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li><b>Ethical review<\/b> for surveys and experiments on political opinions (H2, H4, H6, H9).<\/li><li><b>Data access:<\/b> voter and member data (H6) and an inventory of municipal agreements (H7). CHES and V-Party do not cover 2026.<\/li><li><b>Testing of the source article's claims<\/b> against independent data.<\/li><li><b>Full-text reading<\/b> of paywalled references before novelty claims are made.<\/li><li><b>Scale anchoring<\/b> between the expert scale and self-placement, tested in data.<\/li><li><b>Power calculation<\/b> for H2, H4 and H9, which requires pilot data.<\/li><li><b>Reliability coding<\/b> of 120 event records.<\/li><\/ul>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID CS-CB-03 (original CS-MM-CASE-022).<\/li><li>Definition of relative position and distance reconstructed and labelled.<\/li><li>Internal parameters and the cross-reference to an internal case are not in the card and have not been incorporated into the definition.<\/li><li>The source article's factual claims reformulated as claims to be tested; the investiture rule specified in accordance with the Instrument of Government (regeringsformen), Chapter 6, Article 4.<\/li><li>Research section rewritten with nine references verified against doi.org/Crossref; References in APA 7 added.<\/li><li>Three rival explanations and two stop rules added and labelled.<\/li><li>\"Must be addressed\" replaced by \"Remaining before empirical testing\".<\/li><\/ul>"},{"n":"04","id":"04_bostad_unga","t":"Bostadsmarknaden och unga vuxnas realiserade kapacitet","h":"<p><b>Fall-ID:<\/b> CS-CB-04 (ursprungligt: CS-OS-CASE-001) · <b>Utgångspunkt:<\/b> intern fallnot i FieldShift-programmet (v0.1, 2026-09-11) · <b>Status:<\/b> Design, ej prövad (ingen data insamlad) · <b>Reviderad:<\/b> 2026-11-25<\/p>\n<h4>Fråga<\/h4>\n<p>Unga vuxna kan ha liknande utbildning och arbetsinkomst men ändå olika faktisk förmåga att lämna föräldrahemmet, bilda hushåll, få barn, flytta till arbete och bygga förmögenhet. Hur fördelar bostadsregimen (pris, kötid, kredit och föräldrars förmögenhet) den förmågan? Fallet jämför en storstadsregion med funktionellt jämförbara mindre kommuner, valda enligt en regel som anges före datainsamling (se Data och mätning).<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>bostads- och kreditregim → filter i form av pris, kötid och kreditprövning → bostadsväg → övergångar i vuxenlivet och kapitalutfall → reproduktion av klass och territoriella skillnader. Formellt kan alla ställa sig i bostadskö, söka lån och köpa bostad. Realiserad tillgång avgörs av kötid, kontantinsats, familjens ekonomi och förmåga att bära risk. Formell tillgång är lika, realiserad tillgång olika.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Formell kapacitet:<\/b> rätt att köa, söka lån och köpa bostad.<\/li><li><b>Realiserad kapacitet:<\/b> tre kapaciteter som ska hållas isär, nämligen självständighet (eget hushåll), möjlighet (arbete, utbildning och service på orten) och förmögenhet (kapitaltillväxt och risktålighet). De kan gå åt olika håll.<\/li><li><b>Moving Map:<\/b> bara H7 (förändrad norm för accepterat kvarboende) liknar en referenspunktsförskjutning. Moving Map ligger uttryckligen utanför fallets kärna.<\/li><li><b>Rate mismatch:<\/b> behandlas inte.<\/li><\/ul>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Höga kvoter mellan pris och inkomst och långa kötider minskar sannolikheten för varaktig utflyttning, vid jämförbar inkomst, utbildning och anställning<\/td><td>Frivilligt kvarboende, preferenser, partnerstatus<\/td><td>Sambandet försvinner med kontroller för arbete, inkomst, utbildning, partnerstatus och preferenser<\/td><\/tr><tr><td>H2<\/td><td>Föräldrars förmögenhet dämpar effekten av höga inträdeshinder, särskilt på dyra marknader<\/td><td>Skillnader i lokala löner och karriärmöjligheter<\/td><td>Föräldraresurser modererar inte bostadsinträdet<\/td><\/tr><tr><td>H3<\/td><td>Billiga hyresrätter och studentbostäder minskar beroendet av föräldrars förmögenhet<\/td><td>Selektion genom flyttningar<\/td><td>Tillgången minskar inte beroendet<\/td><\/tr><tr><td>H4<\/td><td>Låga priser i mindre kommuner ökar tidig självständighet men inte nödvändigtvis förmögenhetsutveckling
