en<\/td><td>Olika värdeutveckling, bostadens kvalitet och avgifter<\/td><td>Billigare bostäder hänger inte ihop med tidigare självständigt boende<\/td><\/tr><tr><td>H5<\/td><td>Föräldrafinansierade köp på marknader med stark värdestegring ger kumulativa fördelar<\/td><td>Skuld, innehavstid, inkomst<\/td><td>Ingen bestående skillnad i nettoförmögenhet<\/td><\/tr><tr><td>H6<\/td><td>Bostadshinder fördröjer familjebildning, och effekten varierar<\/td><td>Preferenser, partnerstatus, arbetsmarknad<\/td><td>Inget temporalt samband med faktisk familjebildning<\/td><\/tr><tr><td>H7<\/td><td>Normen för kvarboende anpassas så att stigmat minskar utan att självständigheten ökar<\/td><td>(tillagd i revision) En generell kulturell senareläggning av vuxenlivets övergångar, oberoende av bostadsmarknaden; eller att normen följer beteendet (omvänd kausalitet)<\/td><td>(tillagd i revision) H7 förkastas om förändringen i accepterat kvarboende är lika stor i kommuner med låga som med höga inträdeshinder, eller om normförändringen inte följer efter ökade hinder i tid<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Planeringsförslag för styrka och minsta relevanta effekt (fastställs vid preregistrering):<\/b> För H1 föreslås estimanden skillnaden i sannolikhet för varaktig utflyttning vid en given ålder mellan kommungrupper med höga och låga inträdeshinder, givet kontrollerna i tabellen. Föreslagen minsta relevanta effekt: 3 procentenheter, tvåsidigt α = 0,05 och styrka 0,80. Styrkan beräknas med klusterjustering, eftersom behandlingen varierar på kommunnivå. Motsvarande estimander och effektgränser för H2–H7 anges i protokollet.<\/p>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Öppna data:<\/b> SCB:s statistik om utflyttning, Boverkets bostadsmarknadsenkät, Bostadsförmedlingen i Stockholms köstatistik, Finansinspektionens bolånerapporter, SCB om belåningsgrad, Svensk Mäklarstatistik, Riksbanken. Siffror ur dessa källor anges inte i kortet; de hämtas och dateras vid datainsamlingen.<\/li><li><b>Kräver tillstånd:<\/b> SCB:s registerdata om hushåll, flyttar, inkomst, föräldrakopplingar, födslar och boendeform. Det kräver forskningsåtkomst och etikprövning.<\/li><li><b>Kräver egen insamling:<\/b> intervjuer om normer och preferenser, och bara för att identifiera mekanismer.<\/li><li><b>Jämförelsedesign:<\/b> jämförelsekommunerna väljs enligt en regel som anges före datainsamling, till exempel samma kommungrupp i en officiell kommungruppsindelning, liknande arbetsmarknadsstruktur och befolkningsstorlek, men olika nivå på inträdeshinder. Enskilda orter väljs inte utifrån vardagsobservationer.<\/li><li><b>Försiktighet:<\/b> enkätuppgifter om andelen unga som bor hemma kommer från olika undersökningar med olika urval och ska inte slås ihop.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<p>Modulen ska reduceras eller överges om något av följande återkommer:<\/p>\n<ul><li>sambandet mellan bostadshinder och utflyttning försvinner med rimliga kontroller<\/li><li>föräldraresurser modererar inte bostadsinträdet<\/li><li>tillgång till hyresrätt minskar inte familjeberoendet<\/li><li>billigare bostäder hänger inte ihop med tidigare självständighet<\/li><li>inget temporalt samband med familjebildning<\/li><li>ingen bestående skillnad i förmögenhet.<\/li><\/ul>\n<p>En gate prövar dessutom om konstruktionen redan är absorberad av forskningen, om data finns och om de tre kapaciteterna går att skilja åt.<\/p>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p>Nyckelreferenser (verifierade mot DOI-register):<\/p>\n<ul><li>Clapham (2002): bostadsvägar (housing pathways) som analytisk ram.<\/li><li>Billari och Liefbroer (2010): förändrade mönster i övergången till vuxenlivet i Europa.<\/li><li>Helderman och Mulder (2007): överföring av ägt boende mellan generationer genom gåvor och bostadsmarknadens kontinuitet.<\/li><li>Doling och Ronald (2010): ägt boende som tillgångsbaserad välfärd.<\/li><li>Lennartz, Arundel och Ronald (2016): unga vuxnas ägt boende i Europa under och efter finanskrisen.<\/li><li>Mulder och Billari (2010): bostadsägarregimer och låg fertilitet.<\/li><li>Kain (1968): spatial mismatch mellan bostad och arbete.<\/li><li>Kemeny (2006): korporatism och bostadsregimer.<\/li><li>Christophers (2013): den politiska ekonomin kring svenskt boende.<\/li><\/ul>\n<p>Mekanismerna i H1–H6 är väl belagda var för sig, och ursprungsdokumentet bedömer dem som redan absorberade av forskningen. Det möjliga bidraget är snävare: en gemensam mätning av självständighet, lokal möjlighet och förmögenhet i samma population, för att visa när de tre divergerar. Om en sådan syntes redan finns i litteraturen ska fallet beskrivas som replikation.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Gör en systematisk novelty audit mot de forskningsfält som referenserna ovan representerar.<\/li><li>Definiera separata mått för självständighet, lokal möjlighet och förmögenhet.<\/li><li>Gör en genomförbarhetsbedömning för registeråtkomst (flytt, inkomst, föräldrakoppling, födslar) och etikprövning.<\/li><li>Välj en jämförelsedesign (jämförbara kommuner enligt förutbestämd regel, tidsvariation eller policyförändring) som minskar problemet med selektion genom flyttningar.<\/li><li>Hämta lokala priser och hyror för en definierad period innan analysen.<\/li><\/ol>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li>Ansökan om registeråtkomst hos SCB och etikprövning.<\/li><li>Fullständig läsning av referenserna; verifieringen gäller bibliografiska uppgifter och sammanfattningar.<\/li><li>Systematisk novelty audit utöver nyckelreferenserna, inklusive nordiska registerstudier.<\/li><li>Insamling och datering av lokala priser, hyror, kötider och statistik.<\/li><li>Fastställande av jämförelseregel, kommunurval, estimander och styrkeberäkning i en preregistrering.<\/li><li>Intervjuunderlag och mått för normer (H7).<\/li><\/ul>\n<h4>Referenser<\/h4>\n<p>Billari, F. C., &amp; Liefbroer, A. C. (2010). Towards a new pattern of transition to adulthood? *Advances in Life Course Research, 15*(2–3), 59–75. https://doi.org/10.1016/j.alcr.2010.10.003<\/p>\n<p>Christophers, B. (2013). A monstrous hybrid: The political economy of housing in early twenty-first century Sweden. *New Political Economy, 18*(6), 885–911. https://doi.org/10.1080/13563467.2012.753521<\/p>\n<p>Clapham, D. (2002). Housing pathways: A post modern analytical framework. *Housing, Theory and Society, 19*(2), 57–68. https://doi.org/10.1080/140360902760385565<\/p>\n<p>Doling, J., &amp; Ronald, R. (2010). Home ownership and asset-based welfare. *Journal of Housing and the Built Environment, 25*(2), 165–173. https://doi.org/10.1007/s10901-009-9177-6<\/p>\n<p>Helderman, A., &amp; Mulder, C. (2007). Intergenerational transmission of homeownership: The roles of gifts and continuities in housing market characteristics. *Urban Studies, 44*(2), 231–247. https://doi.org/10.1080/00420980601075018<\/p>\n<p>Kain, J. F. (1968). Housing segregation, Negro employment, and metropolitan decentralization. *The Quarterly Journal of Economics, 82*(2), 175–197. https://doi.org/10.2307/1885893<\/p>\n<p>Kemeny, J. (2006). Corporatism and housing regimes. *Housing, Theory and Society, 23*(1), 1–18. https://doi.org/10.1080/14036090500375423<\/p>\n<p>Lennartz, C., Arundel, R., &amp; Ronald, R. (2016). Younger adults and homeownership in Europe through the global financial crisis. *Population, Space and Place, 22*(8), 823–835. https://doi.org/10.1002/psp.1961<\/p>\n<p>Mulder, C. H., &amp; Billari, F. C. (2010). Homeownership regimes and low fertility. *Housing Studies, 25*(4), 527–541. https://doi.org/10.1080/02673031003711469<\/p>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID CS-CB-04; ursprungligt ID CS-OS-CASE-001 anges.<\/li><li>Litteraturavsnittet omskrivet med nio nyckelreferenser, verifierade mot DOI-register och förlagsuppgifter; referenslista i APA 7 tillagd.<\/li><li>H7 har fått rivalförklaring och falsifieringsregel, markerade som tillagda i revision. Övriga hypoteser oförändrade.<\/li><li>Planeringsförslag för estimand, minsta relevanta effekt och styrka tillagt, att fastställas vid preregistrering.<\/li><li>Ortsjämförelse baserad på vardagsobservation ersatt med förutbestämd urvalsregel för funktionellt jämförbara kommuner.<\/li><li>Interna modulnamn borttagna och ersatta med de tre kapaciteterna.<\/li><li>Odaterade och overifierade statistiska uppgifter borttagna; de dateras vid datainsamling.<\/li><li>Avsnittet \"Måste åtgärdas före extern publicering\" ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"The housing market and young adults' realised capacity","he":"<p><b>Case ID:<\/b> CS-CB-04 (original: CS-OS-CASE-001) · <b>Starting point:<\/b> internal case note in the FieldShift programme (v0.1, 2026-09-11) · <b>Status:<\/b> Design, not tested (no data collected) · <b>Revised:<\/b> 2026-11-25<\/p>\n<h4>Question<\/h4>\n<p>Young adults may have similar education and earned income yet still differ in their actual ability to leave the parental home, form a household, have children, move for work and build wealth. How does the housing regime (price, queuing time, credit and parental wealth) distribute that ability? The case compares a metropolitan region with functionally comparable smaller municipalities, selected according to a rule specified before data collection (see Data and measurement).<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>housing and credit regime → filters in the form of price, queuing time and credit assessment → housing pathway → transitions to adulthood and capital outcomes → reproduction of class and territorial differences. Formally, anyone can join a housing queue, apply for a loan and buy a home. Realised access is determined by queuing time, down payment, family finances and the ability to bear risk. Formal access is equal; realised access is not.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Formal capacity:<\/b> the right to queue, apply for a loan and buy a home.<\/li><li><b>Realised capacity:<\/b> three capacities that are to be kept apart, namely independence (own household), opportunity (work, education and services in the locality) and wealth (capital growth and risk tolerance). They may move in different directions.<\/li><li><b>Moving Map:<\/b> only H7 (a changed norm for accepted co-residence with parents) resembles a reference-point shift. Moving Map lies explicitly outside the core of the case.<\/li><li><b>Rate mismatch:<\/b> not addressed.<\/li><\/ul>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>High price-to-income ratios and long queuing times reduce the probability of lasting departure from the parental home, at comparable income, education and employment<\/td><td>Voluntary co-residence with parents, preferences, partnership status<\/td><td>The association disappears with controls for work, income, education, partnership status and preferences<\/td><\/tr><tr><td>H2<\/td><td>Parental wealth dampens the effect of high entry barriers, especially in expensive markets<\/td><td>Differences in local wages and career opportunities<\/td><td>Parental resources do not moderate housing market entry<\/td><\/tr><tr><td>H3<\/td><td>Low-cost rental tenancies and student housing reduce dependence on parental wealth<\/td><td>Selection through migration<\/td><td>Availability does not reduce dependence<\/td><\/tr><tr><td>H4<\/td><td>Low prices in smaller municipalities increase early independence but not necessarily wealth accumulation<\/td><td>Different price trajectories, housing quality and fees<\/td><td>Cheaper housing is not associated with earlier independent living<\/td><\/tr><tr><td>H5<\/td><td>Parent-financed purchases in markets with strong price appreciation produce cumulative advantages<\/td><td>Debt, holding period, income<\/td><td>No lasting difference in net wealth<\/td><\/tr><tr><td>H6<\/td><td>Housing barriers delay family formation, and the effect varies<\/td><td>Preferences, partnership status, labour market<\/td><td>No temporal association with actual family formation<\/td><\/tr><tr><td>H7<\/td><td>The norm for remaining in the parental home adapts so that stigma decreases without independence increasing<\/td><td>(added in revision) A general cultural postponement of transitions to adulthood, independent of the housing market; or the norm follows behaviour (reverse causality)<\/td><td>(added in revision) H7 is rejected if the change in accepted co-residence with parents is as large in municipalities with low entry barriers as in those with high entry barriers, or if the norm change does not follow increased barriers in time<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Planning proposal for power and minimum relevant effect (to be fixed at preregistration):<\/b> For H1, the proposed estimand is the difference in the probability of lasting departure from the parental home at a given age between municipal groups with high and low entry barriers, given the controls in the table. Proposed minimum relevant effect: 3 percentage points, two-sided α = 0.05 and power 0.80. Power is calculated with cluster adjustment, since treatment varies at municipal level. Corresponding estimands and effect thresholds for H2–H7 are specified in the protocol.<\/p>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Open data:<\/b> Statistics Sweden (SCB) statistics on leaving the parental home, the Housing Market Survey of the Swedish National Board of Housing, Building and Planning (Boverket), queue statistics from the Stockholm Housing Agency (Bostadsförmedlingen i Stockholm), mortgage reports from Finansinspektionen (the Swedish Financial Supervisory Authority), SCB on loan-to-value ratios, Svensk Mäklarstatistik, Sveriges Riksbank. Figures from these sources are not given in the card; they are retrieved and dated at data collection.<\/li><li><b>Requires permission:<\/b> SCB register data on households, moves, income, parent–child links, births and tenure type. This requires research access and ethical review.<\/li><li><b>Requires own data collection:<\/b> interviews on norms and preferences, and only for identifying mechanisms.<\/li><li><b>Comparison design:<\/b> the comparison municipalities are selected according to a rule specified before data collection, for example the same group in an official municipal classification, similar labour market structure and population size, but different levels of entry barriers. Individual localities are not selected on the basis of everyday observations.<\/li><li><b>Caution:<\/b> survey figures on the share of young people living with their parents come from different surveys with different samples and should not be pooled.<\/li><\/ul>\n<h4>Stop rules – what would defeat the case<\/h4>\n<p>The module is to be reduced or abandoned if any of the following recurs:<\/p>\n<ul><li>the association between housing barriers and leaving the parental home disappears with reasonable controls<\/li><li>parental resources do not moderate housing market entry<\/li><li>access to rental tenancies does not reduce family dependence<\/li><li>cheaper housing is not associated with earlier independence<\/li><li>no temporal association with family formation<\/li><li>no lasting difference in wealth.<\/li><\/ul>\n<p>A gate additionally tests whether the construct has already been absorbed by the research, whether data exist and whether the three capacities can be distinguished.<\/p>\n<h4>Established research and what may be new<\/h4>\n<p>Key references (verified against DOI registries):<\/p>\n<ul><li>Clapham (2002): housing pathways as an analytical framework.<\/li><li>Billari and Liefbroer (2010): changing patterns in the transition to adulthood in Europe.<\/li><li>Helderman and Mulder (2007): intergenerational transmission of homeownership through gifts and continuities in housing market characteristics.<\/li><li>Doling and Ronald (2010): homeownership as asset-based welfare.<\/li><li>Lennartz, Arundel and Ronald (2016): young adults' homeownership in Europe during and after the financial crisis.<\/li><li>Mulder and Billari (2010): homeownership regimes and low fertility.<\/li><li>Kain (1968): spatial mismatch between housing and employment.<\/li><li>Kemeny (2006): corporatism and housing regimes.<\/li><li>Christophers (2013): the political economy of Swedish housing.<\/li><\/ul>\n<p>The mechanisms in H1–H6 are well documented individually, and the source document assesses them as already absorbed by the research. The possible contribution is narrower: a joint measurement of independence, local opportunity and wealth in the same population, in order to show when the three diverge. If such a synthesis already exists in the literature, the case should be described as a replication.<\/p>\n<h4>First steps for a researcher wishing to test the case<\/h4>\n<ol><li>Conduct a systematic novelty audit against the research fields represented by the references above.<\/li><li>Define separate measures of independence, local opportunity and wealth.<\/li><li>Carry out a feasibility assessment of register access (moves, income, parent–child links, births) and ethical review.<\/li><li>Choose a comparison design (comparable municipalities according to a predetermined rule, temporal variation or policy change) that reduces the problem of selection through migration.<\/li><li>Retrieve local prices and rents for a defined period before the analysis.<\/li><\/ol>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li>Application for register access at Statistics Sweden (SCB) and ethical review.<\/li><li>Full reading of the references; the verification covers bibliographic details and summaries.<\/li><li>Systematic novelty audit beyond the key references, including Nordic register studies.<\/li><li>Collection and dating of local prices, rents, queuing times and statistics.<\/li><li>Specification of the comparison rule, municipality selection, estimands and power calculation in a preregistration.<\/li><li>Interview materials and measures of norms (H7).<\/li><\/ul>\n<h4>References<\/h4>\n<p>Billari, F. C., &amp; Liefbroer, A. C. (2010). Towards a new pattern of transition to adulthood? *Advances in Life Course Research, 15*(2–3), 59–75. https://doi.org/10.1016/j.alcr.2010.10.003<\/p>\n<p>Christophers, B. (2013). A monstrous hybrid: The political economy of housing in early twenty-first century Sweden. *New Political Economy, 18*(6), 885–911. https://doi.org/10.1080/13563467.2012.753521<\/p>\n<p>Clapham, D. (2002). Housing pathways: A post modern analytical framework. *Housing, Theory and Society, 19*(2), 57–68. https://doi.org/10.1080/140360902760385565<\/p>\n<p>Doling, J., &amp; Ronald, R. (2010). Home ownership and asset-based welfare. *Journal of Housing and the Built Environment, 25*(2), 165–173. https://doi.org/10.1007/s10901-009-9177-6<\/p>\n<p>Helderman, A., &amp; Mulder, C. (2007). Intergenerational transmission of homeownership: The roles of gifts and continuities in housing market characteristics. *Urban Studies, 44*(2), 231–247. https://doi.org/10.1080/00420980601075018<\/p>\n<p>Kain, J. F. (1968). Housing segregation, Negro employment, and metropolitan decentralization. *The Quarterly Journal of Economics, 82*(2), 175–197. https://doi.org/10.2307/1885893<\/p>\n<p>Kemeny, J. (2006). Corporatism and housing regimes. *Housing, Theory and Society, 23*(1), 1–18. https://doi.org/10.1080/14036090500375423<\/p>\n<p>Lennartz, C., Arundel, R., &amp; Ronald, R. (2016). Younger adults and homeownership in Europe through the global financial crisis. *Population, Space and Place, 22*(8), 823–835. https://doi.org/10.1002/psp.1961<\/p>\n<p>Mulder, C. H., &amp; Billari, F. C. (2010). Homeownership regimes and low fertility. *Housing Studies, 25*(4), 527–541. https://doi.org/10.1080/02673031003711469<\/p>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID CS-CB-04; original ID CS-OS-CASE-001 stated.<\/li><li>Literature section rewritten with nine key references, verified against DOI registries and publisher details; reference list in APA 7 added.<\/li><li>H7 has been given a rival explanation and a falsification rule, marked as added in revision. Other hypotheses unchanged.<\/li><li>Planning proposal for estimand, minimum relevant effect and power added, to be fixed at preregistration.<\/li><li>Locality comparison based on everyday observation replaced with a predetermined selection rule for functionally comparable municipalities.<\/li><li>Internal module names removed and replaced with the three capacities.<\/li><li>Undated and unverified statistical figures removed; they are dated at data collection.<\/li><li>The section \"Must be addressed before external publication\" replaced by \"Remaining before empirical testing\".<\/li><\/ul>"},{"n":"05","id":"05_forsvarsformaga","t":"Från anskaffning till verifierad försvarsförmåga: marina obemannade system","h":"<p><b>Fall-ID:<\/b> CS-CB-05 (ursprungligt: inget ID) · <b>Utgångspunkt:<\/b> intern forskningsplan i FieldShift-programmet (v0.1, 2026-10-18) · <b>Status:<\/b> Design, ej prövad (ingen data insamlad) · <b>Reviderad:<\/b> 2026-11-25<\/p>\n<h4>Fråga<\/h4>\n<p>Under vilka organisatoriska och institutionella villkor följs anskaffningen av marina obemannade system av offentligt belagd, uppgiftsspecifik försvarsförmåga? Och hur skiljer sig den utvecklingen från hur förmågan beskrivs och bedöms? Det centrala är inte antalet plattformar. Det är om organisationen kan använda dem uthålligt, under ansvar och tillsammans med andra system.<\/p>\n<p>Studien bygger enbart på offentliga källor och beskriver inte operativa sårbarheter.<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>demonstration → kontrakt → leverans → integration → utbildning → bedömd beredskap → dokumenterad användning. Stegen kan överlappa och behöver inte komma i ordning. Gapet kan uppstå i integration, underhåll, kompetens, tillgång till data eller otydligt ansvar. Att offentlig information saknas betyder okänd förmåga, inte låg förmåga.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Formell kapacitet:<\/b> beslut om anskaffning, kontrakt och leveransplan.<\/li><li><b>Realiserad kapacitet:<\/b> förmågan att lösa ett specificerat uppdrag inom angivna ramar för resurser, tid och ansvar, belagd med verifierbara milstolpar.<\/li><li><b>Moving Map:<\/b> alla fyra komponenterna operationaliseras (aktörens resursprioritering, bedömarens egen prioritering, standard för tillräcklig förmåga, acceptans för kontroll och insyn). Det hör till en senare, separat studie (H3–H4).<\/li><li><b>Rate mismatch (tillagd i revision):<\/b> tiden från daterad leverans till första offentligt verifierade operativa användning, jämförd med den planerings- eller hothorisont som beslutsfattaren själv angett offentligt för projektet. Om ingen sådan horisont finns publicerad kodas rate mismatch som ej bedömbar, inte som noll.<\/li><li><b>DefenceShift (arbetsbegrepp):<\/b> DefenceShift är ett arbetsnamn för en förändring i hur uppgifter, resurser, kompetens, beroenden och beslutsansvar fördelas inom försvaret när ny teknik införs; begreppet är inte etablerat i litteraturen.<\/li><\/ul>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Projekt som redan har dokumenterad ansvarsfördelning, utbildningsplan och integration når verifierbara milstolpar snabbare efter leverans<\/td><td>Projektets svårighet, hotutveckling, finansiering, selektiv rapportering<\/td><td>Ett uteblivet samband med tillräcklig precision. Okända milstolpar gör hypotesen oprövbar, inte falsifierad<\/td><\/tr><tr><td>H2<\/td><td>Fler plattformar ger inte alltid större handlingsfrihet när samma externa stöd krävs<\/td><td>Standardisering kan förbättra både tillgänglighet och effektivitet<\/td><td>Större gemensamt beroende utan observerade hinder<\/td><\/tr><tr><td>H3<\/td><td>En presentation som betonar anskaffat antal ger högre bedömd förmåga än en som skiljer beställning, leverans och verifierad verksamhet (randomiserat)<\/td><td>Läsbarhet och informationsmängd<\/td><td>Ingen skillnad med samma sakuppgifter och längd<\/td><\/tr><tr><td>H4<\/td><td>Argument om snabb teknisk utveckling ökar acceptansen för svagare granskning utan att ändra preferensen för systemen<\/td><td>Tillfällig hotupplevelse, förtroende för avsändaren<\/td><td>Förändringen gäller bara inköpsstöd eller uppfattad effektivitet, medan gränsen för kontroll ligger fast<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Planeringsförslag för styrka och minsta relevanta effekt (fastställs vid preregistrering):<\/b> H1 prövas på sex projekt och har därför ingen meningsfull statistisk styrka; den behandlas som beskrivande och processpårande, med förutbestämda kodregler. För informationsexperimenten (H3, H4) föreslås minsta relevanta effekt d = 0,25, tvåsidigt α = 0,05 och styrka 0,80, vilket ger omkring 250 deltagare per grupp i en jämförelse mellan två grupper.<\/p>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Öppna källor:<\/b> upphandlingsmyndigheters pressmeddelanden om kontrakt och leveransplaner, försvarsmakters nyheter om övningar och experiment, offentliga projektöversikter från multinationella organisationer, revisionsrapporter (se nedan) och leverantörers egna uppgifter (som är leverantörens påståenden och inte en oberoende bedömning).<\/li><li><b>Enhet:<\/b> projekt och milstolpe. Sex europeiska marina projekt, med minst 30 dubbelkodade belägg.<\/li><li><b>Urvalsregel (förutbestämd):<\/b> projekten ska (a) vara europeiska, (b) ha ett offentligt anskaffnings- eller kontraktsbeslut fattat 2018–2026 och (c) ha minst en daterad offentlig milstolpe. Alla projekt som uppfyller kriterierna listas först utifrån officiella källor; sex väljs därefter genom en förutbestämd procedur (till exempel slumpdragning) utan hänsyn till utfall. Projekten namnges först när urvalet är verifierat mot officiella källor.<\/li><li><b>Oberoende granskning:<\/b> nationella revisionsorgan, till exempel Riksrevisionen och brittiska National Audit Office, används som jämförelse mot myndigheters och leverantörers egna uppgifter.<\/li><li><b>Inte tillgängligt:<\/b> sekretessbelagda prestationsdata. Designen förutsätter inte sådan åtkomst.<\/li><li><b>Kräver egen insamling:<\/b> informationsexperimentet för H3 och H4.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<ul><li>Inga kausala slutsatser från en enstaka demonstration.<\/li><li>Kontrakt och operativ verksamhet får inte blandas ihop i samma effektskattning.<\/li><li>Ingen saknad offentlig uppgift kodas som noll.<\/li><li>Ingen ny teorietikett om etablerad forskning om innovation, implementering eller framing ger samma förklaring.<\/li><li>Ett nollresultat bedöms mot en förutbestämd relevant effekt.<\/li><\/ul>\n<p>Gate:<\/p>\n<ul><li><b>PASS<\/b> till beskrivande studie om minst fyra av sex projekt har daterad leverans och ett separat integrations- eller verksamhetsbelägg.<\/li><li><b>PASS<\/b> till kausal design kräver dessutom trovärdig jämförelse och tidsordning.<\/li><li><b>REDUCE<\/b> till en studie av förmågeredovisning om verksamheten inte kan observeras.<\/li><li><b>STOP<\/b> för kausala anspråk om främst säljmaterial återstår.<\/li><li>Kodaröverensstämmelse minst 80 procent.<\/li><\/ul>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p>Nyckelreferenser (verifierade mot DOI-register eller utgivaren):<\/p>\n<ul><li>Rosen (1991): militär innovation i fred och krig som organisatorisk och karriärpolitisk process.<\/li><li>Grissom (2006): översikt över forskningen om militär innovation och dess skolbildningar.<\/li><li>Horowitz (2010): spridning av militär förmåga beror på finansiell och organisatorisk förmåga att ta till sig nya system.<\/li><li>Hobday, Davies och Prencipe (2005): systemintegration som kärnförmåga, med ursprung i militära projekt.<\/li><li>Riksrevisionen (2011): svenska internationella materielsamarbeten levererade i otillräcklig grad i tid.<\/li><li>National Audit Office (2023): granskning av det brittiska försvarsdepartementets tioåriga materielplan.<\/li><li>Riksrevisionen (2026): Försvarsmaktens styrning och uppföljning av resurser, inklusive materiel.<\/li><\/ul>\n<p>Att ny teknik kräver organisatorisk integration för att ge förmåga är väl etablerat i forskningen om militär innovation och systemintegration, och revisionsorgan har upprepade gånger dokumenterat glapp mellan plan och leverans. Det möjliga bidraget är metodiskt: en milstolpskodning ur offentliga källor som skiljer kontrakt, leverans och verifierad användning, samt ett experiment om hur sådan redovisning påverkar bedömd förmåga. Om H1 inte ger en ny prediktion ska fallet beskrivas som tillämpning eller replikation.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Skriv ett tvåsidigt protokoll för H1 med tidsfönster 2018–2026 och enheten projekt och milstolpe.<\/li><li>Tillämpa urvalsregeln ovan och välj sex europeiska marina projekt utan att urvalet beror på om projekten verkar ha lyckats.<\/li><li>Bygg ett källregister med händelsedatum, publiceringsdatum, källtyp, avsändarens intresse och exakt passage.<\/li><li>Koda demonstration, kontrakt, leverans, integration, utbildning, beredskap och användning separat, med två oberoende kodare.<\/li><li>Pröva gaten innan någon kausal design påbörjas.<\/li><\/ol>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li>Genomförande av urvalsregeln: förteckning över alla kvalificerande projekt ur officiella källor och dragning av sex projekt.<\/li><li>Insamling och datering av milstolpar och offentligt angivna planerings- eller hothorisonter.<\/li><li>Fullständig läsning av referenserna samt bredare genomgång av forskning om implementering, upphandling och principal–agent-problem.<\/li><li>Etikprövning och rekrytering för informationsexperimentet (H3, H4).<\/li><li>Fastställande av effektgränser, kodbok och kodaröverensstämmelse i en preregistrering.<\/li><li>Säkerhetsgranskning av kodboken så att inga uppgifter om operativa sårbarheter sammanställs.<\/li><\/ul>\n<h4>Referenser<\/h4>\n<p>Grissom, A. (2006). The future of military innovation studies. *Journal of Strategic Studies, 29*(5), 905–934. https://doi.org/10.1080/01402390600901067<\/p>\n<p>Hobday, M., Davies, A., &amp; Prencipe, A. (2005). Systems integration: A core capability of the modern corporation. *Industrial and Corporate Change, 14*(6), 1109–1143. https://doi.org/10.1093/icc/dth080<\/p>\n<p>Horowitz, M. C. (2010). *The diffusion of military power: Causes and consequences for international politics*. Princeton University Press. https://doi.org/10.1515/9781400835102<\/p>\n<p>National Audit Office. (2023). *The Equipment Plan 2023 to 2033* (HC 315, Session 2023–24). https://www.nao.org.uk/reports/the-equipment-plan-2023-to-2033/<\/p>\n<p>Riksrevisionen. (2011). *Leverans på utsatt tid? En granskning av försvarets internationella materielsamarbeten* (RiR 2011:13).<\/p>\n<p>Riksrevisionen. (2026). *Tänk långsamt, agera fort – Försvarsmaktens styrning av resurser* (RiR 2026:19).<\/p>\n<p>Rosen, S. P. (1991). *Winning the next war: Innovation and the modern military*. Cornell University Press.<\/p>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID CS-CB-05 (inget ursprungligt ID).<\/li><li>DefenceShift definierat i en mening som arbetsbegrepp.<\/li><li>Rate mismatch operationaliserat som tid från leverans till verifierad operativ användning, jämförd med offentligt angiven planerings- eller hothorisont (tillagd i revision).<\/li><li>Litteraturavsnittet omskrivet med sju nyckelreferenser, inklusive två revisionsorgan; Horowitz (2010) verifierad. Referenslista i APA 7 tillagd.<\/li><li>Förutbestämd urvalsregel för de sex projekten tillagd; inga projekt namnges.<\/li><li>Overifierade uppgifter ur reportaget och ej verifierade enskilda exempel borttagna.<\/li><li>Mening om att studien enbart använder offentliga källor och inte beskriver operativa sårbarheter tillagd.<\/li><li>Planeringsförslag för styrka och minsta relevanta effekt tillagt, att fastställas vid preregistrering.<\/li><li>Avsnittet \"Måste åtgärdas före extern publicering\" ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"From procurement to verified defence capability: maritime uncrewed systems","he":"<p><b>Case ID:<\/b> CS-CB-05 (original: no ID) · <b>Starting point:<\/b> internal research plan in the FieldShift programme (v0.1, 2026-10-18) · <b>Status:<\/b> Design, not tested (no data collected) · <b>Revised:<\/b> 2026-11-25<\/p>\n<h4>Question<\/h4>\n<p>Under what organisational and institutional conditions is the procurement of maritime uncrewed systems followed by publicly documented, task-specific defence capability? And how does that development differ from the way the capability is described and assessed? The central issue is not the number of platforms. It is whether the organisation can use them sustainably, accountably and together with other systems.<\/p>\n<p>The study is based solely on public sources and does not describe operational vulnerabilities.<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>demonstration → contract → delivery → integration → training → assessed readiness → documented use. The steps may overlap and need not occur in sequence. The gap may arise in integration, maintenance, competence, access to data or unclear responsibility. The absence of public information means unknown capability, not low capability.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Formal capacity:<\/b> procurement decision, contract and delivery schedule.<\/li><li><b>Realised capacity:<\/b> the ability to carry out a specified mission within stated limits of resources, time and responsibility, documented by verifiable milestones.<\/li><li><b>Moving Map:<\/b> all four components are operationalised (the actor's resource prioritisation, the assessor's own prioritisation, the standard for sufficient capability, and acceptance of control and oversight). This belongs to a later, separate study (H3–H4).<\/li><li><b>Rate mismatch (added in revision):<\/b> the time from dated delivery to the first publicly verified operational use, compared with the planning or threat horizon that the decision-maker has publicly stated for the project. If no such horizon has been published, rate mismatch is coded as not assessable, not as zero.<\/li><li><b>DefenceShift (working concept):<\/b> DefenceShift is a working name for a change in how tasks, resources, competence, dependencies and decision-making responsibility are distributed within defence when new technology is introduced; the concept is not established in the literature.<\/li><\/ul>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Projects that already have a documented allocation of responsibilities, a training plan and integration reach verifiable milestones more quickly after delivery<\/td><td>Project difficulty, threat developments, funding, selective reporting<\/td><td>An absent association with sufficient precision. Unknown milestones make the hypothesis untestable, not falsified<\/td><\/tr><tr><td>H2<\/td><td>More platforms do not always provide greater freedom of action when the same external support is required<\/td><td>Standardisation can improve both availability and efficiency<\/td><td>Greater shared dependence without observed constraints<\/td><\/tr><tr><td>H3<\/td><td>A presentation emphasising the number procured yields higher assessed capability than one that distinguishes order, delivery and verified operations (randomised)<\/td><td>Readability and amount of information<\/td><td>No difference with the same factual content and length<\/td><\/tr><tr><td>H4<\/td><td>Arguments about rapid technological development increase acceptance of weaker scrutiny without changing the preference for the systems<\/td><td>Temporary threat perception, trust in the sender<\/td><td>The change concerns only support for procurement or perceived effectiveness, while the threshold for control remains fixed<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Planning proposal for power and minimum relevant effect (to be fixed at preregistration):<\/b> H1 is tested on six projects and therefore has no meaningful statistical power; it is treated as descriptive and process-tracing, with predetermined coding rules. For the information experiments (H3, H4), the proposed minimum relevant effect is d = 0.25, two-sided α = 0.05 and power 0.80, which gives approximately 250 participants per group in a two-group comparison.<\/p>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Open sources:<\/b> procurement agencies' press releases on contracts and delivery schedules, armed forces' news on exercises and experiments, public project overviews from multinational organisations, audit reports (see below) and suppliers' own information (which constitutes the supplier's claims and not an independent assessment).<\/li><li><b>Unit:<\/b> project and milestone. Six European maritime projects, with at least 30 double-coded pieces of evidence.<\/li><li><b>Selection rule (predetermined):<\/b> the projects must (a) be European, (b) have a public procurement or contract decision taken in 2018–2026 and (c) have at least one dated public milestone. All projects meeting the criteria are first listed on the basis of official sources; six are then selected by a predetermined procedure (for example random draw) without regard to outcomes. The projects are named only once the selection has been verified against official sources.<\/li><li><b>Independent scrutiny:<\/b> national audit bodies, for example the Swedish National Audit Office (Riksrevisionen) and the UK National Audit Office, are used as a check against the agencies' and suppliers' own information.<\/li><li><b>Not available:<\/b> classified performance data. The design does not presuppose such access.<\/li><li><b>Requires own data collection:<\/b> the information experiment for H3 and H4.<\/li><\/ul>\n<h4>Stop rules – what would defeat the case<\/h4>\n<ul><li>No causal conclusions from a single demonstration.<\/li><li>Contracts and operational activity must not be conflated in the same effect estimate.<\/li><li>No missing public information is coded as zero.<\/li><li>No new theoretical label if established research on innovation, implementation or framing provides the same explanation.<\/li><li>A null result is assessed against a predetermined relevant effect.<\/li><\/ul>\n<p>Gate:<\/p>\n<ul><li><b>PASS<\/b> to a descriptive study if at least four of six projects have a dated delivery and a separate piece of evidence of integration or operations.<\/li><li><b>PASS<\/b> to a causal design additionally requires a credible comparison and temporal ordering.<\/li><li><b>REDUCE<\/b> to a study of capability reporting if operations cannot be observed.<\/li><li><b>STOP<\/b> for causal claims if mainly sales material remains.<\/li><li>Inter-coder agreement at least 80 per cent.<\/li><\/ul>\n<h4>Established research and what may be new<\/h4>\n<p>Key references (verified against DOI registries or the publisher):<\/p>\n<ul><li>Rosen (1991): military innovation in peace and war as an organisational and career-political process.<\/li><li>Grissom (2006): overview of research on military innovation and its schools of thought.<\/li><li>Horowitz (2010): the diffusion of military capability depends on the financial and organisational capacity to adopt new systems.<\/li><li>Hobday, Davies and Prencipe (2005): systems integration as a core capability, with origins in military projects.<\/li><li>Riksrevisionen (2011): Swedish international materiel collaborations delivered on time to an insufficient degree.<\/li><li>National Audit Office (2023): review of the UK Ministry of Defence's ten-year Equipment Plan.<\/li><li>Riksrevisionen (2026): the Swedish Armed Forces' governance and follow-up of resources, including materiel.<\/li><\/ul>\n<p>That new technology requires organisational integration in order to yield capability is well established in research on military innovation and systems integration, and audit bodies have repeatedly documented gaps between plan and delivery. The possible contribution is methodological: a milestone coding from public sources that distinguishes contract, delivery and verified use, together with an experiment on how such reporting affects assessed capability. If H1 does not yield a new prediction, the case should be described as an application or replication.<\/p>\n<h4>First steps for a researcher wishing to test the case<\/h4>\n<ol><li>Write a two-page protocol for H1 with the time window 2018–2026 and the unit project and milestone.<\/li><li>Apply the selection rule above and choose six European maritime projects without the selection depending on whether the projects appear to have succeeded.<\/li><li>Build a source register with event date, publication date, source type, the sender's interest and the exact passage.<\/li><li>Code demonstration, contract, delivery, integration, training, readiness and use separately, with two independent coders.<\/li><li>Test the gate before any causal design is begun.<\/li><\/ol>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li>Implementation of the selection rule: a list of all qualifying projects from official sources and the draw of six projects.<\/li><li>Collection and dating of milestones and publicly stated planning or threat horizons.<\/li><li>Full reading of the references and a broader review of research on implementation, procurement and principal–agent problems.<\/li><li>Ethical review and recruitment for the information experiment (H3, H4).<\/li><li>Specification of effect thresholds, codebook and inter-coder agreement in a preregistration.<\/li><li>Security review of the codebook so that no information on operational vulnerabilities is compiled.<\/li><\/ul>\n<h4>References<\/h4>\n<p>Grissom, A. (2006). The future of military innovation studies. *Journal of Strategic Studies, 29*(5), 905–934. https://doi.org/10.1080/01402390600901067<\/p>\n<p>Hobday, M., Davies, A., &amp; Prencipe, A. (2005). Systems integration: A core capability of the modern corporation. *Industrial and Corporate Change, 14*(6), 1109–1143. https://doi.org/10.1093/icc/dth080<\/p>\n<p>Horowitz, M. C. (2010). *The diffusion of military power: Causes and consequences for international politics*. Princeton University Press. https://doi.org/10.1515/9781400835102<\/p>\n<p>National Audit Office. (2023). *The Equipment Plan 2023 to 2033* (HC 315, Session 2023–24). https://www.nao.org.uk/reports/the-equipment-plan-2023-to-2033/<\/p>\n<p>Riksrevisionen. (2011). *Leverans på utsatt tid? En granskning av försvarets internationella materielsamarbeten* [Delivery on schedule? An audit of the defence sector's international materiel collaborations] (RiR 2011:13).<\/p>\n<p>Riksrevisionen. (2026). *Tänk långsamt, agera fort – Försvarsmaktens styrning av resurser* [Think slowly, act fast – the Swedish Armed Forces' governance of resources] (RiR 2026:19).<\/p>\n<p>Rosen, S. P. (1991). *Winning the next war: Innovation and the modern military*. Cornell University Press.<\/p>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID CS-CB-05 (no original ID).<\/li><li>DefenceShift defined in one sentence as a working concept.<\/li><li>Rate mismatch operationalised as the time from delivery to verified operational use, compared with a publicly stated planning or threat horizon (added in revision).<\/li><li>Literature section rewritten with seven key references, including two audit bodies; Horowitz (2010) verified. Reference list in APA 7 added.<\/li><li>Predetermined selection rule for the six projects added; no projects are named.<\/li><li>Unverified information from the news report and unverified individual examples removed.<\/li><li>Sentence stating that the study uses only public sources and does not describe operational vulnerabilities added.<\/li><li>Planning proposal for power and minimum relevant effect added, to be fixed at preregistration.<\/li><li>The section \"Must be addressed before external publication\" replaced by \"Remaining before empirical testing\".<\/li><\/ul>"},{"n":"06","id":"06_levnadskostnader","t":"Levnadskostnader, hushållens handlingsutrymme och demokratiska bedömningar","h":"<p><b>Fall-ID:<\/b> CS-CB-06 (ursprungligt: inget ID) · <b>Utgångspunkt:<\/b> offentlig debatt hösten 2026, bearbetad i en forskningspromemoria (v0.1, 2026-10-24) · <b>Status:<\/b> Design, ej prövad (ingen data insamlad)<\/p>\n<h4>Fråga<\/h4>\n<p>När och genom vilka observerbara steg övergår försämrat ekonomiskt handlingsutrymme i missnöje med sittande regering? Under vilka villkor förblir reaktionen demokratisk kritik, och när sammanfaller den med förändrade gränser för legitim maktutövning? Kan en ändrad referensstandard skiljas från förändrade materiella villkor och egna politiska preferenser?<\/p>\n<h4>Glappet: formell möjlighet → realiserad kapacitet<\/h4>\n<p>Nominell inkomst och sjunkande inflationstakt → oförändrad eller högre prisnivå och högre nödvändiga betalningar → mindre marginal efter nödvändiga utgifter → avstådda handlingar (självständigt boende, arbetsresor, deltagande). En inkomst kan alltså öka samtidigt som dess förmåga att bära bestämda handlingar minskar. Handlingsutrymmet måste mätas hos hushållen och kan inte härledas ur ett nationellt inflationstal.<\/p>\n<h4>Ramverkselement<\/h4>\n<ul><li><b>Formell kontra realiserad kapacitet:<\/b> nettoinkomst jämfört med kassaflödesmarginal, buffert och avstådda basbehov, som redovisas separat.<\/li><li><b>Moving Map:<\/b> alla fyra dimensionerna operationaliseras var för sig: Actor Movement (externkodade partiändringar), Observer Movement (samma persons preferens för samma åtgärd), Reference-Point Shift (uppfattad normal politik) och Legitimacy-Boundary Shift (acceptans för att kringgå en kontrollregel). Ekonomisk prisreferens hålls skild från politisk referensstandard.<\/li><li><b>Rate mismatch (takt mot nivå):<\/b> den tydligaste kopplingen gäller inflationstakt jämfört med ackumulerad prisnivå (H2) och eftersläpande missnöje efter förbättrad marginal (H5). En uttrycklig jämförelse mellan efterfrågans förändringstakt och institutionernas responstakt saknas.<\/li><li><b>Saknas:<\/b> kapacitetsformelns övriga faktorer (faktisk åtkomst, handlingskompetens, institutionell tillåtelse) operationaliseras inte.<\/li><\/ul>\n<h4>Hypoteser<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Kod<\/th><th>Hypotes<\/th><th>Rivalförklaring<\/th><th>Vad som talar emot<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Ökade nödvändiga betalningar i förhållande till nettoinkomst förutsäger fler avstådda nödvändiga aktiviteter vid nästa mätning (inom hushåll)<\/td><td>Arbetslöshet, sjukdom, familjeförändring<\/td><td>Begränsningarna föregår kostnadsökningen eller förklaras helt av rivalhändelserna<\/td><\/tr><tr><td>H2<\/td><td>Betoning av inflationstakt respektive ackumulerad prisnivå påverkar bedömningen av ekonomin vid identiska fakta<\/td><td>Varianterna skiljer sig i begriplighet, upplevd avsändare eller partifärg snarare än i referenspunkt (tillagd i revision)<\/td><td>Ingen skillnad mellan grupperna; eller skillnaden försvinner när förståelse och upplevd avsändare kontrolleras med manipulationskontroll (tillagd i revision)<\/td><\/tr><tr><td>H3<\/td><td>Sambandet mellan försämrat handlingsutrymme och minskat regeringsstöd är starkare bland dem som tillskriver regeringen större påverkan<\/td><td>Tidigare partimotstånd skapar både ansvarstillskrivning och missnöje<\/td><td>Ingen interaktion<\/td><\/tr><tr><td>H4<\/td><td>Ett krisargument ökar acceptansen för att kringgå en demokratisk kontrollregel, utöver stödet för själva åtgärden<\/td><td>Obegriplig juridik, allmän krisoro<\/td><td>Endast regeringsstödet ändras och gränsen ligger still<\/td><\/tr><tr><td>H5<\/td><td>Missnöjet kvarstår längre efter förbättrad marginal hos personer med en oförändrad äldre prisreferens<\/td><td>Kvarstående skulder, förlorad buffert<\/td><td>Rivalerna förklarar eftersläpningen<\/td><\/tr><tr><td>H6<\/td><td>Försämrade marginaler kan samvariera med protest, oppositionsröst, tillbakadragande eller auktoritära preferenser (tvåsidigt test)<\/td><td>Regeringsställning, partiutbud<\/td><td>Ett påstått högersamband försvinner när dessa beaktas<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data och mätning<\/h4>\n<ul><li><b>Öppna data:<\/b> SCB KPI, KPIF och KPIF exklusive energi; INSEE (IPC/IPCH); BLS CPI-U. Jämförelser kräver samma basmånad, slutmånad och index.<\/li><li><b>Egen insamling:<\/b> hushållsmarginal, prisreferens, sakpreferens, politisk normalitetsstandard, legitimitetsgräns och politiska utfall. Det sker genom kognitiva intervjuer, en teknisk pilot och en senare panel i minst fyra vågor.<\/li><li><b>Kompletterande källa:<\/b> SCB:s undersökning av hushållens utgifter (HUT) och SCB:s statistik om boendeutgifter kan ge rimlighetskontroll av nödvändiga utgifter per hushållstyp.<\/li><li><b>Minsta effekt och styrka (planeringsförslag, tillagt i revision; fastställs vid förregistrering):<\/b> minsta meningsfulla effekt d = 0,20 för H2. Ett vinjettexperiment med två armar kräver då cirka 394 deltagare per arm (cirka 788 totalt) vid 80 % styrka och α = 0,05 (tvåsidigt). H4 dimensioneras separat enligt samma princip. Den tekniska piloten används inte för hypotesprövning.<\/li><\/ul>\n<h4>Stoppregler – vad som fäller fallet<\/h4>\n<ul><li><b>PASS:<\/b> frågorna skiljer begripligt ekonomisk referens, egen sakpreferens, politisk normalitet och legitimitet, och data kan samlas in utan orimlig börda.<\/li><li><b>REVISE:<\/b> systematisk begreppsblandning.<\/li><li><b>REDUCE:<\/b> endast en allmän missnöjesdimension kan identifieras.<\/li><li><b>ABSORB:<\/b> etablerade modeller förklarar resultaten lika väl och ingen särskiljande prediktion återstår.<\/li><li>Fyrdelningen i Moving Map får inte tvingas fram om delarna inte kan separeras empiriskt.<\/li><li><b>Numeriska kriterier (planeringsförslag, tillagt i revision; fastställs före piloten):<\/b> PASS om minst 8 av 10 intervjupersoner skiljer de fyra begreppen åt utan styrning; REVISE vid 5–7 av 10; REDUCE vid färre än 5 av 10 eller om en faktoranalys i piloten bara ger en dimension.<\/li><\/ul>\n<h4>Etablerad forskning och vad som kan vara nytt<\/h4>\n<p>Nyckelreferenser (bibliografiska uppgifter verifierade mot DOI-registret och förlagens metadata 2026-11-25):<\/p>\n<ul><li><b>Lewis-Beck och Stegmaier (2000):<\/b> översikt över ekonomisk röstning.<\/li><li><b>Duch och Stevenson (2008):<\/b> hur politiska och ekonomiska institutioner villkorar den ekonomiska rösten.<\/li><li><b>Stantcheva (2024):<\/b> varför människor ogillar inflation, bland annat upplevd köpkraftsförlust och bristande tilltro till att löner hinner ikapp.<\/li><li><b>D'Acunto, Malmendier, Ospina och Weber (2021):<\/b> inflationsförväntningar formas av priser på varor som hushållen ofta köper.<\/li><li><b>Kahneman och Tversky (1979):<\/b> värdering av vinster och förluster i förhållande till en referenspunkt.<\/li><li><b>Smith, Pettigrew, Pippin och Bialosiewicz (2012):<\/b> teoretisk och metaanalytisk översikt över relativ deprivation.<\/li><li><b>Graham och Svolik (2020):<\/b> väljare prioriterar ofta partitillhörighet och sakfrågor framför demokratiska principer.<\/li><li><b>Kotz, Kuik, Lis och Nickel (2024):<\/b> uppvärmning och värmeextremer som källa till inflationstryck, särskilt på livsmedel.<\/li><\/ul>\n<p>Det är väl belagt att ekonomiska förhållanden påverkar regeringsstöd, att ansvarstillskrivning villkorar sambandet, att prisuppfattningar formas av vardagliga köp och referenspunkter, och att stöd för demokratiska principer kan vika för partisympati. Det möjliga bidraget är empirisk åtskillnad mellan materiellt handlingsutrymme, ekonomisk referenspunkt, politisk normalitetsstandard och legitimitetsgräns, förutsatt att den ger en särskiljande förutsägelse.<\/p>\n<h4>Första steg för en forskare som vill pröva fallet<\/h4>\n<ol><li>Bygg ett källregister för varje prisuppgift med index, basmånad, slutmånad och källa.<\/li><li>Gör en systematisk litteratursökning (economic voting, inflation perceptions, affordability, reference dependence, democratic tradeoffs) och läs fulltexterna.<\/li><li>Revidera kodboken och genomför 8–12 kognitiva intervjuer för att pröva om måtten går att skilja åt.<\/li><li>Pröva H2 i en teknisk pilot med två randomiserade presentationsvarianter och identiska fakta. Pröva H4 separat.<\/li><li>Förregistrera en kausal panelmodell innan huvudinsamlingen börjar.<\/li><\/ol>\n<h4>Referenser<\/h4>\n<p>D'Acunto, F., Malmendier, U., Ospina, J., &amp; Weber, M. (2021). Exposure to grocery prices and inflation expectations. *Journal of Political Economy, 129*(5), 1615–1639. https://doi.org/10.1086/713192<\/p>\n<p>Duch, R. M., &amp; Stevenson, R. T. (2008). *The economic vote: How political and economic institutions condition election results*. Cambridge University Press. https://doi.org/10.1017/CBO9780511755934<\/p>\n<p>Graham, M. H., &amp; Svolik, M. W. (2020). Democracy in America? Partisanship, polarization, and the robustness of support for democracy in the United States. *American Political Science Review, 114*(2), 392–409. https://doi.org/10.1017/S0003055420000052<\/p>\n<p>Kahneman, D., &amp; Tversky, A. (1979). Prospect theory: An analysis of decision under risk. *Econometrica, 47*(2), 263–291. https://doi.org/10.2307/1914185<\/p>\n<p>Kotz, M., Kuik, F., Lis, E., &amp; Nickel, C. (2024). Global warming and heat extremes to enhance inflationary pressures. *Communications Earth &amp; Environment, 5*, Artikel 116. https://doi.org/10.1038/s43247-023-01173-x<\/p>\n<p>Lewis-Beck, M. S., &amp; Stegmaier, M. (2000). Economic determinants of electoral outcomes. *Annual Review of Political Science, 3*, 183–219. https://doi.org/10.1146/annurev.polisci.3.1.183<\/p>\n<p>Smith, H. J., Pettigrew, T. F., Pippin, G. M., &amp; Bialosiewicz, S. (2012). Relative deprivation: A theoretical and meta-analytic review. *Personality and Social Psychology Review, 16*(3), 203–232. https://doi.org/10.1177/1088868311430825<\/p>\n<p>Stantcheva, S. (2024). Why do we dislike inflation? *Brookings Papers on Economic Activity, 2024*(1), 1–46. https://doi.org/10.1353/eca.2024.a943913<\/p>\n<h4>Återstår före empirisk prövning<\/h4>\n<ul><li>Etikprövning, rekryteringsväg, samtyckesförfarande och dataskyddsplan.<\/li><li>Fulltextläsning av referenserna, varav flera ligger bakom betalvägg, och en systematisk litteratursökning (novelty audit) med söklogg.<\/li><li>Kontroll av att Kotz m.fl. (2024) är den publikation som forskningspromemorian avsåg; den identifierades utifrån författare och år.<\/li><li>Arkivering i daterad version av löpande webbsidor (bland annat BLS) och andra källor vid datainsamlingen.<\/li><li>Fastställande av minsta meningsfulla effekt, styrkeanalys, gate-kriterier och analysplan vid förregistrering.<\/li><\/ul>\n<h4>Revisionslogg (2026-11-25)<\/h4>\n<ul><li>Nytt fall-ID: CS-CB-06.<\/li><li>Utgångspunkten beskrivs generiskt; beroendet av en källartikel utan bibliografisk identitet är borttaget.<\/li><li>Litteraturavsnittet omskrivet med åtta verifierade referenser; avsnittet Referenser (APA 7, med DOI) tillagt.<\/li><li>Rivalförklaring och kompletterande falsifieringsregel för H2 tillagda.<\/li><li>Planeringsförslag för minsta effekt, styrka och numeriska gate-kriterier tillagda.<\/li><li>\"Måste åtgärdas före extern publicering\" ersatt av \"Återstår före empirisk prövning\".<\/li><\/ul>","te":"The cost of living, household room for manoeuvre and democratic judgements","he":"<p><b>Case ID:<\/b> CS-CB-06 (original: no ID) · <b>Starting point:<\/b> public debate in autumn 2026, developed in a research memorandum (v0.1, 2026-10-24) · <b>Status:<\/b> Design, not tested (no data collected)<\/p>\n<h4>Question<\/h4>\n<p>When, and through which observable steps, does a deterioration in economic room for manoeuvre turn into dissatisfaction with the incumbent government? Under what conditions does the reaction remain democratic criticism, and when does it coincide with changed boundaries of legitimate exercise of power? Can a changed reference standard be distinguished from changed material conditions and from one's own political preferences?<\/p>\n<h4>The gap: formal opportunity → realised capacity<\/h4>\n<p>Nominal income and a falling rate of inflation → an unchanged or higher price level and higher necessary payments → a smaller margin after necessary expenditure → forgone actions (independent living, commuting, participation). An income can thus rise while its capacity to sustain particular actions declines. Room for manoeuvre must be measured at household level and cannot be derived from a national inflation figure.<\/p>\n<h4>Framework elements<\/h4>\n<ul><li><b>Formal versus realised capacity:<\/b> net income compared with cash-flow margin, buffer and forgone basic needs, which are reported separately.<\/li><li><b>Moving Map:<\/b> all four dimensions are operationalised separately: Actor Movement (externally coded party changes), Observer Movement (the same person's preference for the same measure), Reference-Point Shift (perceived normal politics) and Legitimacy-Boundary Shift (acceptance of circumventing a control rule). The economic price reference is kept separate from the political reference standard.<\/li><li><b>Rate mismatch (rate versus level):<\/b> the clearest link concerns the rate of inflation compared with the accumulated price level (H2) and lagging dissatisfaction after an improved margin (H5). An explicit comparison between the rate of change in demand and the rate of institutional response is lacking.<\/li><li><b>Missing:<\/b> the other factors of the capacity formula (actual access, competence to act, institutional permission) are not operationalised.<\/li><\/ul>\n<h4>Hypotheses<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Code<\/th><th>Hypothesis<\/th><th>Rival explanation<\/th><th>Disconfirming evidence<\/th><\/tr><\/thead><tbody><tr><td>H1<\/td><td>Increased necessary payments relative to net income predict more forgone necessary activities at the next measurement (within households)<\/td><td>Unemployment, illness, family change<\/td><td>The constraints precede the cost increase or are fully explained by the rival events<\/td><\/tr><tr><td>H2<\/td><td>Emphasis on the rate of inflation versus the accumulated price level affects assessments of the economy given identical facts<\/td><td>The variants differ in comprehensibility, perceived sender or party colour rather than in reference point (added in revision)<\/td><td>No difference between the groups; or the difference disappears when comprehension and perceived sender are controlled for with a manipulation check (added in revision)<\/td><\/tr><tr><td>H3<\/td><td>The association between deteriorating room for manoeuvre and reduced government support is stronger among those who attribute greater influence to the government<\/td><td>Prior party opposition produces both attribution of responsibility and dissatisfaction<\/td><td>No interaction<\/td><\/tr><tr><td>H4<\/td><td>A crisis argument increases acceptance of circumventing a democratic control rule, over and above support for the measure itself<\/td><td>Incomprehensible legal detail, general crisis anxiety<\/td><td>Only government support changes and the boundary remains unchanged<\/td><\/tr><tr><td>H5<\/td><td>Dissatisfaction persists longer after an improved margin among people with an unchanged, older price reference<\/td><td>Remaining debts, lost buffer<\/td><td>The rivals explain the lag<\/td><\/tr><tr><td>H6<\/td><td>Deteriorating margins may covary with protest, opposition voting, withdrawal or authoritarian preferences (two-sided test)<\/td><td>Government status, party supply<\/td><td>A claimed right-wing association disappears when these are taken into account<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Data and measurement<\/h4>\n<ul><li><b>Open data:<\/b> Statistics Sweden (SCB) CPI, CPIF and CPIF excluding energy (KPI/KPIF); INSEE (IPC/IPCH); BLS CPI-U. Comparisons require the same base month, end month and index.<\/li><li><b>Own data collection:<\/b> household margin, price reference, policy preference, political normality standard, legitimacy boundary and political outcomes. This is carried out through cognitive interviews, a technical pilot and a later panel of at least four waves.<\/li><li><b>Supplementary source:<\/b> the SCB Household Budget Survey (HUT) and SCB statistics on housing expenditure can provide a plausibility check of necessary expenditure by household type.<\/li><li><b>Minimum effect and power (planning proposal, added in revision; to be fixed at preregistration):<\/b> minimum meaningful effect d = 0.20 for H2. A two-arm vignette experiment then requires approximately 394 participants per arm (approximately 788 in total) at 80% power and α = 0.05 (two-sided). H4 is sized separately according to the same principle. The technical pilot is not used for hypothesis testing.<\/li><\/ul>\n<h4>Stop rules – what would defeat the case<\/h4>\n<ul><li><b>PASS:<\/b> the questions comprehensibly distinguish economic reference, own policy preference, political normality and legitimacy, and data can be collected without an unreasonable burden.<\/li><li><b>REVISE:<\/b> systematic conflation of concepts.<\/li><li><b>REDUCE:<\/b> only a general dimension of dissatisfaction can be identified.<\/li><li><b>ABSORB:<\/b> established models explain the results equally well and no distinguishing prediction remains.<\/li><li>The fourfold division in Moving Map must not be forced if the parts cannot be separated empirically.<\/li><li><b>Numerical criteria (planning proposal, added in revision; to be fixed before the pilot):<\/b> PASS if at least 8 of 10 interviewees distinguish the four concepts without prompting; REVISE at 5–7 of 10; REDUCE at fewer than 5 of 10 or if a factor analysis in the pilot yields only one dimension.<\/li><\/ul>\n<h4>Established research and what may be new<\/h4>\n<p>Key references (bibliographic details verified against the DOI registry and publishers' metadata on 2026-11-25):<\/p>\n<ul><li><b>Lewis-Beck and Stegmaier (2000):<\/b> overview of economic voting.<\/li><li><b>Duch and Stevenson (2008):<\/b> how political and economic institutions condition the economic vote.<\/li><li><b>Stantcheva (2024):<\/b> why people dislike inflation, including perceived loss of purchasing power and a lack of confidence that wages will catch up.<\/li><li><b>D'Acunto, Malmendier, Ospina and Weber (2021):<\/b> inflation expectations are shaped by the prices of goods that households buy frequently.<\/li><li><b>Kahneman and Tversky (1979):<\/b> valuation of gains and losses relative to a reference point.<\/li><li><b>Smith, Pettigrew, Pippin and Bialosiewicz (2012):<\/b> theoretical and meta-analytic review of relative deprivation.<\/li><li><b>Graham and Svolik (2020):<\/b> voters often prioritise partisanship and policy issues over democratic principles.<\/li><li><b>Kotz, Kuik, Lis and Nickel (2024):<\/b> warming and heat extremes as a source of inflationary pressure, particularly on food.<\/li><\/ul>\n<p>It is well documented that economic conditions affect government support, that attribution of responsibility conditions the association, that price perceptions are shaped by everyday purchases and reference points, and that support for democratic principles can give way to partisan sympathy. The possible contribution is an empirical separation of material room for manoeuvre, economic reference point, political normality standard and legitimacy boundary, provided that it yields a distinguishing prediction.<\/p>\n<h4>First steps for a researcher wishing to test the case<\/h4>\n<ol><li>Build a source register for each price figure with index, base month, end month and source.<\/li><li>Conduct a systematic literature search (economic voting, inflation perceptions, affordability, reference dependence, democratic tradeoffs) and read the full texts.<\/li><li>Revise the codebook and conduct 8–12 cognitive interviews to test whether the measures can be distinguished.<\/li><li>Test H2 in a technical pilot with two randomised presentation variants and identical facts. Test H4 separately.<\/li><li>Preregister a causal panel model before the main data collection begins.<\/li><\/ol>\n<h4>References<\/h4>\n<p>D'Acunto, F., Malmendier, U., Ospina, J., &amp; Weber, M. (2021). Exposure to grocery prices and inflation expectations. *Journal of Political Economy, 129*(5), 1615–1639. https://doi.org/10.1086/713192<\/p>\n<p>Duch, R. M., &amp; Stevenson, R. T. (2008). *The economic vote: How political and economic institutions condition election results*. Cambridge University Press. https://doi.org/10.1017/CBO9780511755934<\/p>\n<p>Graham, M. H., &amp; Svolik, M. W. (2020). Democracy in America? Partisanship, polarization, and the robustness of support for democracy in the United States. *American Political Science Review, 114*(2), 392–409. https://doi.org/10.1017/S0003055420000052<\/p>\n<p>Kahneman, D., &amp; Tversky, A. (1979). Prospect theory: An analysis of decision under risk. *Econometrica, 47*(2), 263–291. https://doi.org/10.2307/1914185<\/p>\n<p>Kotz, M., Kuik, F., Lis, E., &amp; Nickel, C. (2024). Global warming and heat extremes to enhance inflationary pressures. *Communications Earth &amp; Environment, 5*, Article 116. https://doi.org/10.1038/s43247-023-01173-x<\/p>\n<p>Lewis-Beck, M. S., &amp; Stegmaier, M. (2000). Economic determinants of electoral outcomes. *Annual Review of Political Science, 3*, 183–219. https://doi.org/10.1146/annurev.polisci.3.1.183<\/p>\n<p>Smith, H. J., Pettigrew, T. F., Pippin, G. M., &amp; Bialosiewicz, S. (2012). Relative deprivation: A theoretical and meta-analytic review. *Personality and Social Psychology Review, 16*(3), 203–232. https://doi.org/10.1177/1088868311430825<\/p>\n<p>Stantcheva, S. (2024). Why do we dislike inflation? *Brookings Papers on Economic Activity, 2024*(1), 1–46. https://doi.org/10.1353/eca.2024.a943913<\/p>\n<h4>Remaining before empirical testing<\/h4>\n<ul><li>Ethical review, recruitment route, consent procedure and data protection plan.<\/li><li>Full-text reading of the references, several of which are behind a paywall, and a systematic literature search (novelty audit) with a search log.<\/li><li>Verification that Kotz et al. (2024) is the publication the research memorandum referred to; it was identified on the basis of authors and year.<\/li><li>Archiving, in dated versions, of continuously updated web pages (including BLS) and other sources at data collection.<\/li><li>Specification of the minimum meaningful effect, power analysis, gate criteria and analysis plan at preregistration.<\/li><\/ul>\n<h4>Revision log (2026-11-25)<\/h4>\n<ul><li>New case ID: CS-CB-06.<\/li><li>The starting point is described generically; the dependence on a source article without bibliographic identity has been removed.<\/li><li>Literature section rewritten with eight verified references; References section (APA 7, with DOIs) added.<\/li><li>Rival explanation and supplementary falsification rule for H2 added.<\/li><li>Planning proposals for minimum effect, power and numerical gate criteria added.<\/li><li>\"Must be addressed before external publication\" replaced by \"Remaining before empirical testing\".<\/li><\/ul>"}],"ranking":"<p><b>Underlag:<\/b> 35 dokument i Drive är lästa i sin helhet. Det är 31 fallnoter i 10_Pilots_and_Cases, Snyder-modulen och fyra fall ur undermapparna. Mappen Political_Narratives innehåller cirka 25 fall (CS-MM-CASE-002 till 023). Av dem är bara de två mest utvecklade bedömda, CASE-022 och CASE-023. Resten, liksom OpportunityShift CASE-003 och undermappen Workplace_Surveillance, är inte lästa.<\/p>\n<p><b>Bedömare:<\/b> fyra parallella genomläsningar med samma kriterier. GIGI har jag bedömt själv. Poängsättningen kan skilja något mellan genomläsningarna, så skillnader på 1 poäng ska inte övertolkas.<\/p>\n<h4>Kriterier (0–3 per kriterium, max 18)<\/h4>\n<ul><li><b>A Mognad:<\/b> version, djup och hur färdig designen är.<\/li><li><b>B Prövbarhet:<\/b> operationaliserade hypoteser och stoppregler.<\/li><li><b>C Datatillgång:<\/b> öppna data eller registerdata som en utomstående kan få.<\/li><li><b>D Ramverkspassning:<\/b> visar fallet glappet mellan formell möjlighet och realiserad kapacitet, Moving Map eller rate mismatch?<\/li><li><b>E Publiceringssäkerhet:<\/b> namngivna privatpersoner, anklagelser mot namngivna personer eller bolag, känsliga uppgifter.<\/li><li><b>F Nyhetsdisciplin:<\/b> erkänd tidigare forskning och avgränsning av vad som är nytt.<\/li><\/ul>\n<h4>Urvalsregel för casebooken<\/h4>\n<p>Ett fall tas med om det har <b>minst 14 poäng, minst 2 på E och minst 2 på D<\/b>. Bland de fall som klarar regeln väljs en första utgåva på 6 fall med spridning över ämnen och ramverkselement.<\/p>\n<h4>Rangordning<\/h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>#<\/th><th>Fall<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><th>F<\/th><th>Σ<\/th><th>Beslut<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>GIGI: könsgapet (SCB-mätpilot)<\/td><td>3<\/td><td>3<\/td><td>3<\/td><td>2<\/td><td>3<\/td><td>2<\/td><td>16<\/td><td><b>Utgåva 1<\/b><\/td><\/tr><tr><td>1<\/td><td>Minoritetsregerande och styrförmåga<\/td><td>2<\/td><td>3<\/td><td>2<\/td><td>3<\/td><td>3<\/td><td>3<\/td><td td><\/tr><tr><td>34<\/td><td>Demokratisk räckvidd, AI och kontroll<\/td><td>1<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>9<\/td><td>Ej publik<\/td><\/tr><tr><td>36<\/td><td>Stödtext och tolkningsmakt<\/td><td>2<\/td><td>2<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>2<\/td><td>8<\/td><td><b>Aldrig publik<\/b> (känsliga hälso- och relationsuppgifter)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Gemensamma iakttagelser<\/h4>\n<ul><li><b>Ingen data utom GIGI.<\/b> Inget fall utom GIGI har data, och nästan alla är v0.1. Poängen mäter designkvalitet, inte evidens.<\/li><li><b>Samma mall i nästan alla PM.<\/b> Mallen är kodbok, pilot med 24 enheter, alfa 0,80 och PASS/HOLD/ABSORB. Det ger jämförbarhet, men i en publicerad casebook måste varje fall stå på egna ben.<\/li><li><b>Tunn litteraturgrund.<\/b> Litteraturen bygger ofta på 1–4 källor eller bara abstracts. Det är den vanligaste svagheten.<\/li><li><b>Rate mismatch är sällan uttalat.<\/b> Begreppet nämns uttryckligen nästan aldrig. Det syns tydligast i Levnadskostnader (takt mot nivå), Musk (rättelsetid mot lanseringsfönster), Medborgarskap/kris H3 och Beredskap (återuppbyggnadstakt).<\/li><li><b>Bort före extern användning:<\/b> raden \"Underlag för Thomas Hedlund Leijon\", privatpersoners namn och e-postadresser samt overifierade citat.<\/li><li><b>Min tidigare förhandsbedömning höll inte helt.<\/b> Barns naturtillgång och Hyresrabatt passar ramverket väl, men nådde bara 12 poäng. Båda saknar den etablerade forskningen på sina områden.<\/li><\/ul>","ranking_en":"<p><b>Basis:<\/b> 35 documents in Drive have been read in full. These are 31 case notes in 10_Pilots_and_Cases, the Snyder module and four cases from the subfolders. The Political_Narratives folder contains about 25 cases (CS-MM-CASE-002 to 023). Of these, only the two most developed have been assessed, CASE-022 and CASE-023. The rest, as well as OpportunityShift CASE-003 and the Workplace_Surveillance subfolder, have not been read.<\/p>\n<p>
