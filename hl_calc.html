<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL-kalkylator</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f9f6f1;--paper-2:#f2ede5;--paper-3:#e8e0d4;--rule:#d8d0c4;--card:#fff;--ink:#1a1a1a;--ink-soft:#4a4a4a;--ink-light:#736b60;
--gold:#b8922a;--ok:#1e7a46;--bad:#a8321f;--warn:#9a6a0c;--blue:#2c6e9b;--serif:"Libre Baskerville",Georgia,serif;--sans:"Source Sans 3",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.eye{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif);font-size:28px;margin:6px 0}h2{font-family:var(--serif);font-size:21px;margin:26px 0 8px}h3{font-size:15px;margin:18px 0 6px}
p{margin:6px 0;max-width:900px;color:var(--ink-soft)}.note{font-size:13px;color:var(--ink-light)}
.lang{float:right;display:flex;gap:6px}
.lang button,.tabs button{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:var(--card);padding:6px 12px;border-radius:4px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.card .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-light)}
.card .v{font-family:var(--serif);font-size:24px;margin:4px 0 2px}.card .s{font-size:13px;color:var(--ink-soft)}
.formula{font-family:var(--mono);font-size:13px;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;margin:8px 0;overflow-x:auto;line-height:1.8}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;margin:10px 0}
.ctrl label{font-size:13px;color:var(--ink-soft);display:block}.ctrl input[type=range]{width:100%}
.ctrl output{font-family:var(--mono);font-size:12px;color:var(--ink)}
input[type=number],textarea,select{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--card);width:100%}
textarea{font-family:var(--mono);font-size:12px;min-height:70px}
.btn{font-family:var(--mono);font-size:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;margin:4px 6px 0 0}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--rule)}
.banner{border-left:4px solid var(--warn);background:#fbf3e2;padding:10px 14px;margin:12px 0;border-radius:3px;font-size:14px}
.banner.ok{border-color:var(--ok);background:#e9f4ec}.banner.bad{border-color:var(--bad);background:#fbeae6}.banner.info{border-color:var(--blue);background:#eaf1f7}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--paper-3);text-align:left;vertical-align:top}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);background:var(--paper-2)}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
.bar{height:12px;background:var(--paper-3);border-radius:6px;position:relative;margin:18px 0 22px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar .mk{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--bad)}
.bar .mk b{position:absolute;top:-17px;left:-4px;font:500 10px var(--mono);white-space:nowrap;color:var(--ink-soft)}
.bar .mk.g{border-color:var(--gold)}.bar .mk.l{border-color:#b9b0a3}
.chart{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px}.chart svg{display:block;width:100%;height:auto}
.ref{font-family:var(--mono);font-size:11px;color:var(--blue);background:#eaf1f7;border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap}
.ref:hover{text-decoration:underline}
.basis{font-size:13px;color:var(--ink-soft);margin:4px 0 10px}
.el{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:4px;padding:10px 14px;margin:8px 0;scroll-margin-top:12px}
.el.def{border-left-color:var(--blue)}.el.ass{border-left-color:var(--warn)}.el.thm{border-left-color:var(--ok)}
.el.hit{box-shadow:0 0 0 3px rgba(184,146,42,.45)}
.el .id{font-family:var(--mono);font-size:12px;font-weight:500;margin-right:6px}
.el .src{font-family:var(--mono);font-size:10.5px;color:var(--ink-light);float:right;margin-left:8px}
.el .pf{margin-top:8px;padding-top:8px;border-top:1px dashed var(--paper-3);font-size:14px;color:var(--ink-soft)}
.el .pf i.qed{font-style:normal;float:right}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media (max-width:760px){h1{font-size:23px}.lang{float:none;margin-bottom:8px}.el .src{float:none;display:block;margin:0 0 4px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* HL-kalkylator v2 (2026-11-25), byggd i euklidisk ordning: Definition → Antagande → Sats → Bevis.
   Källor: K1 Mathematical Definition of the HL Principle and the CDRS Model; K2 Technical Paper v9;
   K3 Metoddokument v1.0; K4 FieldShift och hexagonens lag v0.2 (2026-11-21, forskningsversion, ej kanonisk);
   K5 FS-ADS-002 Granskning v0.3. Inga utfall eller konstanter hittas på. */
(function(){
var qs=new URLSearchParams(location.search), LANG=qs.get('lang')==='en'?'en':'sv', TAB=qs.get('tab')||'grund', EMB=qs.get('embed')==='1';
var H0=1.724, CI=[1.53,1.96], KAPPA=H0/8, KCDRS=1-KAPPA, WARN=0.52, CL=0.22, SQ3=Math.sqrt(3);
var S={F:.3,C:.3,O:.3,N:.3,R:.3,wF:.2,wC:.2,wO:.2,wN:.2,wR:.2,custom:false,p:.3,cfp:1,cfn:4,
       ero:'',rec:'',ann:'',B:2000,dM:.20,deq:.6,a0:.25,delta:.05,T:20,phi:0,z:50,zmin:0,zmax:100,zdir:'stress',
       kp:2,kK:12,es:3,eR:120,th:45,gq:2};
var sv=function(){return LANG==='sv';};
var L=function(a,b){return sv()?a:b;};
var f=function(x,d){if(x==null||!isFinite(x))return '–';var s=Number(x).toFixed(d==null?3:d);return sv()?s.replace('.',','):s;};

/* ================= matematik ================= */
function cdrs(){var w=S.custom?[S.wF,S.wC,S.wO,S.wN,S.wR]:[.2,.2,.2,.2,.2],x=[S.F,S.C,S.O,S.N,S.R],sw=w.reduce(function(a,b){return a+b;},0);
 if(!(sw>0))return null;return x.reduce(function(a,v,i){return a+v*w[i]/sw;},0);}                       // D7
function norm(z,mn,mx,dir){if(mx===mn)return null;var x=(z-mn)/(mx-mn);x=Math.max(0,Math.min(1,x));return dir==='stress'?x:1-x;} // D6
function parse(s,signed){return String(s||'').split(/[\s;]+|,(?=\s)|,(?=-)/).map(function(v){return parseFloat(String(v).replace(',','.'));}).filter(function(v){return isFinite(v)&&(signed?v!==0:v>0);});}
function mean(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var r=Math.imul(seed^seed>>>15,1|seed);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;};}
function bootstrapH(rec,ero,B){var r=rng(20261125),out=[];for(var b=0;b<B;b++){var sr=0,se=0;for(var i=0;i<rec.length;i++)sr+=rec[Math.floor(r()*rec.length)];for(var j=0;j<ero.length;j++)se+=ero[Math.floor(r()*ero.length)];out.push((sr/rec.length)/(se/ero.length));}
 out.sort(function(a,b){return a-b;});var q=function(p){return out[Math.min(out.length-1,Math.floor(p*out.length))];};return{med:q(.5),lo:q(.025),hi:q(.975)};}
function band(c){var B=sv()?[['Mycket låg risk',.24],['Låg risk',.37],['Bevakningszon',.51],['Varning',.65],['Kritisk',.79],['Kris',1.01]]:[['Very low risk',.24],['Low risk',.37],['Watch zone',.51],['Warning',.65],['Critical',.79],['Crisis',1.01]];
 for(var i=0;i<B.length;i++)if(c<=B[i][1]+1e-9)return B[i][0];return B[5][0];}
// ζ(s), s>1: delsumma + Euler–Maclaurin-svans
function zeta(s){if(!(s>1))return Infinity;var N=50,a=0;for(var n=1;n<=N;n++)a+=Math.pow(n,-s);
 return a+Math.pow(N,1-s)/(s-1)-Math.pow(N,-s)/2+s*Math.pow(N,-s-1)/12-s*(s+1)*(s+2)*Math.pow(N,-s-3)/720;}
// L(s,χ₋₃) = Σ χ(n) n^{-s}, χ(n)=+1 (n≡1), −1 (n≡2), 0 (n≡0 mod 3)
function Lchi3(s){var a=0;for(var m=0;m<200000;m++)a+=Math.pow(3*m+1,-s)-Math.pow(3*m+2,-s);return a;}
// Z_hex(s) = Σ' (a²+ab+b²)^{-s} över a²+ab+b² ≤ X, plus svanskorrektion (2π/√3)·X^{1-s}/(s-1)
function epsteinHex(s,R){var X=R*R,a=0,cnt=0,B=Math.ceil(2*R/SQ3)+1;for(var i=-B;i<=B;i++)for(var j=-B;j<=B;j++){if(!i&&!j)continue;var q=i*i+i*j+j*j;if(q<=X){a+=Math.pow(q,-s);cnt++;}}
 return{partial:a,corrected:a+(2*Math.PI/SQ3)*Math.pow(X,1-s)/(s-1),points:cnt};}
// D10: ändlig minneskärna
function kernel(p,K){var w=[],z=0;for(var k=0;k<=K;k++){w.push(Math.pow(k+1,-p));z+=w[k];}return{w:w.map(function(x){return x/z;}),Z:z};}
function alarmThreshold(cfp,cfn){return cfp/(cfp+cfn);}                                                     // S16

/* ================= euklidisk grund: definitioner, antaganden, satser ================= */
var SRC={K1:['Mathematical Definition of the HL Principle and the CDRS Model','Mathematical Definition of the HL Principle and the CDRS Model'],
 K2:['Technical Paper v9','Technical Paper v9'],K3:['Metoddokument v1.0 (docs/methodology_v1.html)','Methodology document v1.0 (docs/methodology_v1.html)'],
 K4:['FieldShift och hexagonens lag v0.2, 2026-11-21 (forskningsversion, ej kanonisk)','FieldShift and the law of the hexagon v0.2, 2026-11-21 (research version, not canonical)'],
 K5:['FS-ADS-002 Granskning v0.3','FS-ADS-002 Review v0.3'],K6:['JoD-manus v8 (jod_v8_final_revised6.docx): 17 kollapsepisoder 2010–2023; 4,7/8,3 år ur V-Dems ERT-data (Lührmann och Lindberg 2019); test 2019–2023: 13 av 15 rätt (86,7 %), AUC 0,96','JoD manuscript v8 (jod_v8_final_revised6.docx): 17 collapse episodes 2010–2023; 4.7/8.3 years from V-Dem ERT data (Lührmann and Lindberg 2019); test 2019–2023: 13 of 15 correct (86.7%), AUC 0.96'],R1:['NIST DLMF §25.6 (ζ(2) = π²/6)','NIST DLMF §25.6 (ζ(2) = π²/6)'],R2:['Clay Mathematics Institute: Riemannhypotesen (olöst)','Clay Mathematics Institute: Riemann Hypothesis (unsolved)'],
 DS:['Dashboardens landdata, beräknat 2026-11-25','Dashboard country data, computed 2026-11-25']};
function G(){return [
 // ---------- Definitioner ----------
 ['def','D1','K1',L('<b>Demokratinivå.</b> D<sub>c,t</sub> ∈ [0, 1] är land c:s demokratiindex år t. Högre värde betyder mer demokrati.','<b>Democracy level.</b> D<sub>c,t</sub> ∈ [0, 1] is country c\'s democracy index in year t. A higher value means more democracy.')],
 ['def','D2','K1',L('<b>Episoder.</b> En erosionsepisod e har storleken M<sub>e</sub><sup>−</sup> = D(t<sub>e,0</sub>) − D(t<sub>e,1</sub>) &gt; 0. En återhämtningsepisod r har storleken M<sub>r</sub><sup>+</sup> = D(t<sub>r,1</sub>) − D(t<sub>r,0</sub>) &gt; 0. Antalet episoder är E respektive R.','<b>Episodes.</b> An erosion episode e has magnitude M<sub>e</sub><sup>−</sup> = D(t<sub>e,0</sub>) − D(t<sub>e,1</sub>) &gt; 0. A recovery episode r has magnitude M<sub>r</sub><sup>+</sup> = D(t<sub>r,1</sub>) − D(t<sub>r,0</sub>) &gt; 0. The numbers of episodes are E and R.')],
 ['def','D3','K1',L('<b>HL-kvoten som medelvärdeskvot.</b> ℋ<sub>1</sub> = [(1/R) Σ<sub>r</sub> M<sub>r</sub><sup>+</sup>] / [(1/E) Σ<sub>e</sub> M<sub>e</sub><sup>−</sup>].','<b>HL ratio as a ratio of means.</b> ℋ<sub>1</sub> = [(1/R) Σ<sub>r</sub> M<sub>r</sub><sup>+</sup>] / [(1/E) Σ<sub>e</sub> M<sub>e</sub><sup>−</sup>].')],
 ['def','D4','K2',L('<b>HL-kvoten som summakvot.</b> ℋ<sub>2</sub> = Σ Δ<sup>+</sup> / Σ |Δ<sup>−</sup>|, där Δ<sup>+</sup> och Δ<sup>−</sup> är de positiva respektive negativa årliga förändringarna av D.','<b>HL ratio as a ratio of sums.</b> ℋ<sub>2</sub> = Σ Δ<sup>+</sup> / Σ |Δ<sup>−</sup>|, where Δ<sup>+</sup> and Δ<sup>−</sup> are the positive and negative annual changes of D.')],
 ['def','D5','K1, K2',L('<b>Kritisk tröskel.</b> κ = ℋ/8. Faktorn 8 är en definition. K2 kallar den en skalningsregularitet, inte ett strikt bevis.','<b>Critical threshold.</b> κ = ℋ/8. The factor 8 is a definition. K2 calls it a scaling regularity, not a strict proof.')],
 ['def','D6','K1',L('<b>Normaliserad stress.</b> För en rå indikator Z: X = (Z − min Z)/(max Z − min Z) om högre Z betyder mer stress, annars X = 1 − (Z − min Z)/(max Z − min Z). Då gäller X ∈ [0, 1].','<b>Normalised stress.</b> For a raw indicator Z: X = (Z − min Z)/(max Z − min Z) if a higher Z means more stress, otherwise X = 1 − (Z − min Z)/(max Z − min Z). Then X ∈ [0, 1].')],
 ['def','D7','K1',L('<b>CDRS.</b> CDRS<sub>c,t</sub> = Σ<sub>j</sub> w<sub>j</sub> X<sub>j,c,t</sub> över dimensionerna F, C, O, N, R, med w<sub>j</sub> ≥ 0 och Σ w<sub>j</sub> = 1. Baslinjen är w<sub>j</sub> = 1/5. CDRS mäter stress: högre värde är sämre.','<b>CDRS.</b> CDRS<sub>c,t</sub> = Σ<sub>j</sub> w<sub>j</sub> X<sub>j,c,t</sub> over the dimensions F, C, O, N, R, with w<sub>j</sub> ≥ 0 and Σ w<sub>j</sub> = 1. The baseline is w<sub>j</sub> = 1/5. CDRS measures stress: a higher value is worse.')],
 ['def','D8','K3',L('<b>Riskband.</b> Mycket låg ≤ 0,24 &lt; Låg ≤ 0,37 &lt; Bevakning ≤ 0,51 &lt; Varning ≤ 0,65 &lt; Kritisk ≤ 0,79 &lt; Kris. Varning gäller alltså från CDRS ≥ 0,52.','<b>Risk bands.</b> Very low ≤ 0.24 &lt; Low ≤ 0.37 &lt; Watch ≤ 0.51 &lt; Warning ≤ 0.65 &lt; Critical ≤ 0.79 &lt; Crisis. Warning therefore applies from CDRS ≥ 0.52.')],
 ['def','D9','K4 §10',L('<b>Hexagonens referenstal.</b> κ<sub>1</sub> = √3/8 ≈ 0,216506; κ<sub>2</sub> = √3/4 ≈ 0,433013; κ<sub>3</sub> = √3/√7 ≈ 0,654654; κ<sub>4</sub> = 1/√2 ≈ 0,707107. Det är exakta taldefinitioner.','<b>Reference numbers of the hexagon.</b> κ<sub>1</sub> = √3/8 ≈ 0.216506; κ<sub>2</sub> = √3/4 ≈ 0.433013; κ<sub>3</sub> = √3/√7 ≈ 0.654654; κ<sub>4</sub> = 1/√2 ≈ 0.707107. These are exact definitions of numbers.')],
 ['def','D10','K4 §8',L('<b>Minneskärna (M6).</b> För p &gt; 0 och K ≥ 0 är w<sub>k</sub> = (k+1)<sup>−p</sup> / Σ<sub>j=0..K</sub> (j+1)<sup>−p</sup> för k = 0, …, K. Historikens viktade medelvärde är m<sub>K</sub>(x) = Σ<sub>k</sub> w<sub>k</sub> x<sub>t−k</sub>.','<b>Memory kernel (M6).</b> For p &gt; 0 and K ≥ 0, w<sub>k</sub> = (k+1)<sup>−p</sup> / Σ<sub>j=0..K</sub> (j+1)<sup>−p</sup> for k = 0, …, K. The weighted history mean is m<sub>K</sub>(x) = Σ<sub>k</sub> w<sub>k</sub> x<sub>t−k</sub>.')],
 ['def','D11','R1, R2',L('<b>Riemanns zetafunktion.</b> ζ(s) = Σ<sub>n≥1</sub> n<sup>−s</sup> för reellt s &gt; 1. <b>Riemannhypotesen</b> säger att alla icke-triviala nollställen till den analytiska fortsättningen av ζ har realdel 1/2. Den är olöst.','<b>Riemann zeta function.</b> ζ(s) = Σ<sub>n≥1</sub> n<sup>−s</sup> for real s &gt; 1. The <b>Riemann hypothesis</b> states that every non-trivial zero of the analytic continuation of ζ has real part 1/2. It is unsolved.')],
 ['def','D12','K4 §8, K5',L('<b>Hexagonalt gitter och Epstein-zeta.</b> Gittret är Λ = {a + bω : a, b ∈ ℤ} med ω = e<sup>iπ/3</sup>, så |a + bω|² = a² + ab + b². Z<sub>hex</sub>(s) = Σ′ (a² + ab + b²)<sup>−s</sup> över (a, b) ≠ (0, 0). Dirichlets L-funktion är L(s, χ<sub>−3</sub>) = Σ χ<sub>−3</sub>(n) n<sup>−s</sup>, där χ<sub>−3</sub>(n) = 1 om n ≡ 1, −1 om n ≡ 2 och 0 om n ≡ 0 (mod 3).','<b>Hexagonal lattice and Epstein zeta.</b> The lattice is Λ = {a + bω : a, b ∈ ℤ} with ω = e<sup>iπ/3</sup>, so |a + bω|² = a² + ab + b². Z<sub>hex</sub>(s) = Σ′ (a² + ab + b²)<sup>−s</sup> over (a, b) ≠ (0, 0). The Dirichlet L-function is L(s, χ<sub>−3</sub>) = Σ χ<sub>−3</sub>(n) n<sup>−s</sup>, where χ<sub>−3</sub>(n) = 1 if n ≡ 1, −1 if n ≡ 2 and 0 if n ≡ 0 (mod 3).')],
 ['def','D13','K4 P8',L('<b>Larmbeslut.</b> p är en kalibrerad sannolikhet för en händelse inom en given horisont. C<sub>FP</sub> &gt; 0 är kostnaden för falsklarm och C<sub>FN</sub> &gt; 0 kostnaden för en missad händelse. Ett rätt beslut kostar 0.','<b>Alarm decision.</b> p is a calibrated probability of an event within a given horizon. C<sub>FP</sub> &gt; 0 is the cost of a false alarm and C<sub>FN</sub> &gt; 0 the cost of a missed event. A correct decision costs 0.')],
 ['def','D14','K1',L('<b>Illustrativ dynamik.</b> D(t) = D<sub>eq</sub> + A<sub>0</sub> e<sup>−δt</sup> sin(ℋt/T + φ) med δ ≥ 0, A<sub>0</sub> ≥ 0 och T &gt; 0.','<b>Illustrative dynamics.</b> D(t) = D<sub>eq</sub> + A<sub>0</sub> e<sup>−δt</sup> sin(ℋt/T + φ) with δ ≥ 0, A<sub>0</sub> ≥ 0 and T &gt; 0.')],
 // ---------- Antaganden ----------
 ['ass','A1','K1, K2',L('<b>Empirisk skattning av ℋ.</b> ℋ̂ = 1,724 med 95 %-intervall [1,53; 1,96]. K1 anger 109,4/63,5 med bootstrap B = 10 000. K2 anger 109,38/63,46 = 1,7236. Skattningen är empirisk och bevisas inte här.','<b>Empirical estimate of ℋ.</b> ℋ̂ = 1.724 with 95% interval [1.53, 1.96]. K1 gives 109.4/63.5 with bootstrap B = 10,000. K2 gives 109.38/63.46 = 1.7236. The estimate is empirical and is not proven here.')],
 ['ass','A2','DS',L('<b>Skalöversättning (tolkning).</b> CDRS<sub>c,t</sub> ≈ 1 − D<sub>c,t</sub>, alltså är stressindex ungefär komplementet till demokratinivån. Detta är en tolkning som måste prövas mot data. Den följer inte ur D1–D7.','<b>Scale translation (interpretation).</b> CDRS<sub>c,t</sub> ≈ 1 − D<sub>c,t</sub>, so the stress index is roughly the complement of the democracy level. This is an interpretation that must be tested against data. It does not follow from D1–D7.')],
 ['ass','A3','K3, K6',L('<b>Empirisk varningsgräns.</b> Gränsen 0,52 är kalibrerad. Enligt K3 föregicks 14 av 17 övergångar från valdemokrati till valautokrati 2010–2023 av CDRS över 0,52 året före V-Dems omklassificering. (Medianen 0,518 gäller alla 163 länder 2023, inte övergångarna.) I K6, tabell 1, ligger 10 av de 17 över 0,52 vid episodens start; tidpunkterna skiljer sig. Gränsen är empirisk och bevisas inte här. Den kalibrerades på den tidigare dataserien och är inte omkalibrerad för dataserie v16.','<b>Empirical warning threshold.</b> The threshold 0.52 is calibrated. According to K3, 14 of 17 transitions from electoral democracy to electoral autocracy in 2010–2023 were preceded by CDRS above 0.52 in the year before V-Dem’s reclassification. (The median 0.518 refers to all 163 countries in 2023, not to the transitions.) In K6, Table 1, 10 of the 17 are above 0.52 at episode onset; the time points differ. The threshold is empirical and is not proven here. It was calibrated on the earlier data series and has not been recalibrated for data series v16.')],
 ['ass','A4','DS',L('<b>Empirisk fördelning.</b> I dashboardens landdata (dataserie v16, 2025) har 128 av 163 länder (79 %) CDRS ≥ 0,216. I den tidigare dataserien (2023) var andelen minst 89 %.','<b>Empirical distribution.</b> In the dashboard’s country data (data series v16, 2025), 128 of 163 countries (79%) have CDRS ≥ 0.216. In the earlier data series (2023) the share was at least 89%.')],
 ['ass','A5','K4 §3, §15',L('<b>Kalibrering saknas.</b> Det finns ännu ingen kalibrerad sannolikhetsmodell p för FieldShift-händelser. K4 visar att basmodellen gav 5,09 % genomsnittlig risk när 2,69 % av fönstren var positiva. CDRS är ett index, inte en sannolikhet.','<b>No calibration yet.</b> There is not yet a calibrated probability model p for FieldShift events. K4 shows that the base model gave an average risk of 5.09% when 2.69% of windows were positive. CDRS is an index, not a probability.')],
 ['ass','A6','K6',L('<b>Empirisk ledtidsgräns.</b> c<sub>L</sub> ≈ 0,22 på CDRS-skalan (område 0,20–0,25). Enligt K6 är gränsen vald för att maximera ledtiden mellan första signal och bekräftad kollaps, i genomsnitt 3,3 år. Den prognosoptimala gränsen ligger nära 0,32, och lägsta CDRS vid kollapsstart är 0,362. Gränsen är empirisk och härleds inte ur ℋ. Den bestämdes på den tidigare dataserien och är inte omkalibrerad för dataserie v16.','<b>Empirical lead-time threshold.</b> c<sub>L</sub> ≈ 0.22 on the CDRS scale (range 0.20–0.25). According to K6 the threshold is chosen to maximise the lead time between the first signal and confirmed collapse, on average 3.3 years. The prediction-optimal threshold is near 0.32, and the lowest CDRS at collapse onset is 0.362. The threshold is empirical and is not derived from ℋ. It was set on the earlier data series and has not been recalibrated for data series v16.')],
 // ---------- Satser ----------
 ['thm','S1','D3, D4',L('<b>Estimatorernas relation.</b> Låt ℋ<sub>Σ</sub> = Σ M<sup>+</sup> / Σ M<sup>−</sup> vara summakvoten över samma episoder. Då är ℋ<sub>1</sub> = ℋ<sub>Σ</sub> · E/R. Därmed är ℋ<sub>1</sub> = ℋ<sub>Σ</sub> om och endast om R = E.','<b>Relation between the estimators.</b> Let ℋ<sub>Σ</sub> = Σ M<sup>+</sup> / Σ M<sup>−</sup> be the ratio of sums over the same episodes. Then ℋ<sub>1</sub> = ℋ<sub>Σ</sub> · E/R. Hence ℋ<sub>1</sub> = ℋ<sub>Σ</sub> if and only if R = E.'),
  L('ℋ<sub>1</sub> = (Σ M<sup>+</sup>/R)/(Σ M<sup>−</sup>/E) = (Σ M<sup>+</sup>/Σ M<sup>−</sup>)·(E/R). Faktorn E/R är 1 precis när R = E. <b>Följd:</b> samma talpar 109,4 och 63,5 kan inte både vara medelvärden (K1) och summor (K2) av samma episoder, om inte R = E. K1 och K2 räknar därför på olika sätt.','ℋ<sub>1</sub> = (Σ M<sup>+</sup>/R)/(Σ M<sup>−</sup>/E) = (Σ M<sup>+</sup>/Σ M<sup>−</sup>)·(E/R). The factor E/R equals 1 exactly when R = E. <b>Corollary:</b> the same pair 109.4 and 63.5 cannot be both means (K1) and sums (K2) of the same episodes unless R = E. K1 and K2 therefore compute differently.')],
 ['thm','S2','D5, A1',L('<b>κ:s värde.</b> Under A1 är κ = 0,2155, med 95 %-intervall [0,191; 0,245].','<b>Value of κ.</b> Under A1, κ = 0.2155, with 95% interval [0.191, 0.245].'),
  L('κ = ℋ/8 = 1,724/8 = 0,2155. Avbildningen x ↦ x/8 är strängt växande, så intervallet avbildas på [1,53/8; 1,96/8] = [0,191; 0,245].','κ = ℋ/8 = 1.724/8 = 0.2155. The map x ↦ x/8 is strictly increasing, so the interval maps to [1.53/8, 1.96/8] = [0.191, 0.245].')],
 ['thm','S3','D1, D5, D7, D8, A2',L('<b>κ på CDRS-skalan.</b> κ är en gräns på nivåskalan (D1): D ≤ κ. Under A2 gäller D ≤ κ ⇔ CDRS ≥ 1 − κ = 0,7845, med intervall [0,755; 0,809]. Värdet ligger 0,006 från bandgränsen 0,79 mellan Kritisk och Kris (D8).','<b>κ on the CDRS scale.</b> κ is a threshold on the level scale (D1): D ≤ κ. Under A2, D ≤ κ ⇔ CDRS ≥ 1 − κ = 0.7845, with interval [0.755, 0.809]. The value lies 0.006 from the band boundary 0.79 between Critical and Crisis (D8).'),
  L('Med CDRS = 1 − D gäller D ≤ κ ⇔ 1 − D ≥ 1 − κ ⇔ CDRS ≥ 1 − κ. Enligt S2 är 1 − κ = 0,7845. Avbildningen x ↦ 1 − x är strängt avtagande, så κ-intervallet [0,191; 0,245] avbildas på [0,755; 0,809]. Avståndet är |0,79 − 0,7845| = 0,0055. Att avståndet är litet är en observation, inte en härledning av bandgränsen.','With CDRS = 1 − D, D ≤ κ ⇔ 1 − D ≥ 1 − κ ⇔ CDRS ≥ 1 − κ. By S2, 1 − κ = 0.7845. The map x ↦ 1 − x is strictly decreasing, so the κ interval [0.191, 0.245] maps to [0.755, 0.809]. The distance is |0.79 − 0.7845| = 0.0055. That the distance is small is an observation, not a derivation of the band boundary.')],
 ['thm','S4','D8, A2, A3, S3',L('<b>Varningsgränsen och κ är förenliga.</b> Under A2 motsvarar varningen CDRS ≥ 0,52 nivån D ≤ 0,48. Varje land som passerat κ (D ≤ 0,2155) är därför också i varning, men inte omvänt. Gränsen 0,52 kommer från A3 och följer inte ur ℋ.','<b>The warning threshold and κ are compatible.</b> Under A2, the warning CDRS ≥ 0.52 corresponds to the level D ≤ 0.48. Every country beyond κ (D ≤ 0.2155) is therefore also in warning, but not conversely. The threshold 0.52 comes from A3 and does not follow from ℋ.'),
  L('CDRS ≥ 0,52 ⇔ 1 − D ≥ 0,52 ⇔ D ≤ 0,48. Eftersom 0,2155 &lt; 0,48 gäller {D ≤ κ} ⊂ {D ≤ 0,48}. Inklusionen är strikt, eftersom D = 0,3 ligger i den andra mängden men inte i den första. Talet 0,52 förekommer inte i D1–D7 eller A1. Det införs genom A3.','CDRS ≥ 0.52 ⇔ 1 − D ≥ 0.52 ⇔ D ≤ 0.48. Since 0.2155 &lt; 0.48, {D ≤ κ} ⊂ {D ≤ 0.48}. The inclusion is strict, since D = 0.3 lies in the second set but not in the first. The number 0.52 does not occur in D1–D7 or A1. It is introduced by A3.')],
 ['thm','S5','D7, D8, S2, A4',L('<b>κ direkt på CDRS skiljer inte mellan länder.</b> Om regeln CDRS ≥ κ användes som varning skulle varje land utanför bandet Mycket låg risk få varning. Under A4 gäller det 79 % av länderna (2025).','<b>κ applied directly to CDRS does not discriminate.</b> If the rule CDRS ≥ κ were used as a warning, every country outside the Very low risk band would get a warning. Under A4 that is 79% of countries (2025).'),
  L('Enligt S2 är κ = 0,2155 &lt; 0,24, som är övre gränsen för Mycket låg risk (D8). Varje land med CDRS &gt; 0,24 uppfyller därför CDRS ≥ κ. Andelen kommer direkt från A4. Därför används κ på nivåskalan (S3) och inte på CDRS.','By S2, κ = 0.2155 &lt; 0.24, the upper limit of Very low risk (D8). Every country with CDRS &gt; 0.24 therefore satisfies CDRS ≥ κ. The share comes directly from A4. That is why κ is used on the level scale (S3), not on CDRS.')],
 ['thm','S6','D2, D3, A1',L('<b>Återhämtningskrav.</b> Om förlusten är ΔM<sup>−</sup>, kräver en genomsnittlig återhämtning enligt kvoten ℋ en kumulativ rörelse på ℋ·ΔM<sup>−</sup>. Utöver förlusten är det (ℋ − 1)·ΔM<sup>−</sup>. Kvoten gäller storlek, inte tid.','<b>Recovery requirement.</b> If the loss is ΔM<sup>−</sup>, an average recovery according to the ratio ℋ requires a cumulative movement of ℋ·ΔM<sup>−</sup>. Beyond the loss that is (ℋ − 1)·ΔM<sup>−</sup>. The ratio concerns magnitude, not time.'),
  L('Enligt D3 är ℋ kvoten mellan genomsnittlig återhämtnings- och erosionsstorlek. Om en förlust ΔM<sup>−</sup> skalas med samma kvot blir motsvarande återhämtningsrörelse ℋ·ΔM<sup>−</sup>, och skillnaden blir ℋ·ΔM<sup>−</sup> − ΔM<sup>−</sup>. D2 och D3 innehåller inga tidsvariabler, så ingen tidsslutsats följer.','By D3, ℋ is the ratio of mean recovery magnitude to mean erosion magnitude. If a loss ΔM<sup>−</sup> is scaled by the same ratio, the corresponding recovery movement is ℋ·ΔM<sup>−</sup>, and the difference is ℋ·ΔM<sup>−</sup> − ΔM<sup>−</sup>. D2 and D3 contain no time variables, so no conclusion about time follows.')],
 ['thm','S7','D9 (K4 P1)',L('<b>Geometrisk referens.</b> Låt 0 &lt; θ &lt; π/2, S = sin θ och Q = cot θ. Då är Q = √(1 − S²)/S, och Q = 1 ⇔ S = 1/√2 = κ<sub>4</sub>.','<b>Geometric reference.</b> Let 0 &lt; θ &lt; π/2, S = sin θ and Q = cot θ. Then Q = √(1 − S²)/S, and Q = 1 ⇔ S = 1/√2 = κ<sub>4</sub>.'),
  L('På intervallet är cos θ &gt; 0, så cos θ = √(1 − S²) och Q = cos θ / sin θ = √(1 − S²)/S. Q = 1 ⇔ √(1 − S²) = S ⇔ 1 − S² = S² ⇔ S = 1/√2, eftersom S &gt; 0. Satsen innehåller ingen variabel för skada eller tid. Den kan därför inte ensam bära en slutsats om kollaps.','On the interval cos θ &gt; 0, so cos θ = √(1 − S²) and Q = cos θ / sin θ = √(1 − S²)/S. Q = 1 ⇔ √(1 − S²) = S ⇔ 1 − S² = S² ⇔ S = 1/√2, since S &gt; 0. The proposition contains no variable for damage or time. It therefore cannot on its own support a conclusion about collapse.')],
 ['thm','S8','D9 (K4 P2)',L('<b>Numeriska trösklar är skalberoende.</b> Låt händelsen vara S ≥ κ<sub>1</sub>, och låt g vara strängt växande. Händelsen är densamma som g(S) ≥ g(κ<sub>1</sub>). I allmänhet är g(κ<sub>1</sub>) ≠ κ<sub>1</sub>.','<b>Numerical thresholds depend on scale.</b> Let the event be S ≥ κ<sub>1</sub>, and let g be strictly increasing. The event is the same as g(S) ≥ g(κ<sub>1</sub>). In general g(κ<sub>1</sub>) ≠ κ<sub>1</sub>.'),
  L('Strängt växande g bevarar ordningen, så S ≥ κ<sub>1</sub> ⇔ g(S) ≥ g(κ<sub>1</sub>). Med g(S) = S² blir g(κ<sub>1</sub>) = 3/64 = 0,0469 ≠ 0,2165. Ett universellt tal kräver alltså en vald, kanonisk skala. Detta är skälet till beslut D15 (K5): hexagonzonerna används inte som larmregel.','A strictly increasing g preserves order, so S ≥ κ<sub>1</sub> ⇔ g(S) ≥ g(κ<sub>1</sub>). With g(S) = S², g(κ<sub>1</sub>) = 3/64 = 0.0469 ≠ 0.2165. A universal number therefore requires a chosen, canonical scale. This is the reason for decision D15 (K5): the hexagon zones are not used as an alarm rule.')],
 ['thm','S9','D10 (K4 P3)',L('<b>Ändligt minne är en konvex sammanvägning.</b> Vikterna i D10 är icke-negativa med summa 1. Därför ligger m<sub>K</sub>(x) mellan historikens minsta och största värde, och |m<sub>K</sub>(x) − m<sub>K</sub>(y)| ≤ max<sub>k</sub> |x<sub>t−k</sub> − y<sub>t−k</sub>|.','<b>Finite memory is a convex combination.</b> The weights in D10 are non-negative and sum to 1. Therefore m<sub>K</sub>(x) lies between the smallest and largest value of the history, and |m<sub>K</sub>(x) − m<sub>K</sub>(y)| ≤ max<sub>k</sub> |x<sub>t−k</sub> − y<sub>t−k</sub>|.'),
  L('Multiplicera min x ≤ x<sub>t−k</sub> ≤ max x med w<sub>k</sub> ≥ 0 och summera. Eftersom Σ w<sub>k</sub> = 1 ger det min x ≤ m<sub>K</sub>(x) ≤ max x. Triangelolikheten ger |Σ w<sub>k</sub>(x<sub>k</sub> − y<sub>k</sub>)| ≤ Σ w<sub>k</sub>|x<sub>k</sub> − y<sub>k</sub>| ≤ max|x<sub>k</sub> − y<sub>k</sub>|.','Multiply min x ≤ x<sub>t−k</sub> ≤ max x by w<sub>k</sub> ≥ 0 and sum. Since Σ w<sub>k</sub> = 1 this gives min x ≤ m<sub>K</sub>(x) ≤ max x. The triangle inequality gives |Σ w<sub>k</sub>(x<sub>k</sub> − y<sub>k</sub>)| ≤ Σ w<sub>k</sub>|x<sub>k</sub> − y<sub>k</sub>| ≤ max|x<sub>k</sub> − y<sub>k</sub>|.')],
 ['thm','S10','D10, D11, R1',L('<b>Riemanns zeta normaliserar oändligt minne.</b> För K → ∞ konvergerar nämnaren i D10 om och endast om p &gt; 1. Gränsvärdet är ζ(p), och w<sub>k</sub><sup>∞</sup> = (k+1)<sup>−p</sup>/ζ(p). För p = 2 är ζ(2) = π²/6, alltså w<sub>k</sub> = 6/[π²(k+1)²] och w<sub>0</sub> = 6/π² ≈ 0,6079.','<b>The Riemann zeta function normalises infinite memory.</b> As K → ∞ the denominator in D10 converges if and only if p &gt; 1. The limit is ζ(p), and w<sub>k</sub><sup>∞</sup> = (k+1)<sup>−p</sup>/ζ(p). For p = 2, ζ(2) = π²/6, so w<sub>k</sub> = 6/[π²(k+1)²] and w<sub>0</sub> = 6/π² ≈ 0.6079.'),
  L('Σ<sub>j=0..K</sub>(j+1)<sup>−p</sup> = Σ<sub>n=1..K+1</sub> n<sup>−p</sup> är delsummor av ζ(p). Integraljämförelse med ∫<sub>1</sub><sup>∞</sup> x<sup>−p</sup> dx visar konvergens precis när p &gt; 1. Värdet ζ(2) = π²/6 är Eulers lösning av Baselproblemet. Det är etablerad matematik (R1, DLMF 25.6.1) och citeras här i stället för att bevisas på nytt.','Σ<sub>j=0..K</sub>(j+1)<sup>−p</sup> = Σ<sub>n=1..K+1</sub> n<sup>−p</sup> are partial sums of ζ(p). Comparison with ∫<sub>1</sub><sup>∞</sup> x<sup>−p</sup> dx shows convergence exactly when p &gt; 1. The value ζ(2) = π²/6 is Euler\'s solution of the Basel problem. It is established mathematics (R1, DLMF 25.6.1) and is cited here rather than proved again.')],
 ['thm','S11','D10, D11, S10',L('<b>Medelfördröjning.</b> För den oändliga kärnan är Σ k w<sub>k</sub><sup>∞</sup> = [ζ(p − 1) − ζ(p)]/ζ(p). Den är ändlig om och endast om p &gt; 2. Inverskvadratkärnan (p = 2) har alltså oändlig medelfördröjning, trots att vikterna summerar till 1.','<b>Mean lag.</b> For the infinite kernel, Σ k w<sub>k</sub><sup>∞</sup> = [ζ(p − 1) − ζ(p)]/ζ(p). It is finite if and only if p &gt; 2. The inverse-square kernel (p = 2) therefore has infinite mean lag, even though its weights sum to 1.'),
  L('Sätt n = k + 1. Då är Σ k(k+1)<sup>−p</sup> = Σ<sub>n≥1</sub>(n − 1)n<sup>−p</sup> = Σ n<sup>1−p</sup> − Σ n<sup>−p</sup> = ζ(p − 1) − ζ(p). Den första serien konvergerar precis när p − 1 &gt; 1 (S10). Dela med ζ(p).','Set n = k + 1. Then Σ k(k+1)<sup>−p</sup> = Σ<sub>n≥1</sub>(n − 1)n<sup>−p</sup> = Σ n<sup>1−p</sup> − Σ n<sup>−p</sup> = ζ(p − 1) − ζ(p). The first series converges exactly when p − 1 &gt; 1 (S10). Divide by ζ(p).')],
 ['thm','S12','D10, S9, S10',L('<b>Trunkeringsfel.</b> Låt p &gt; 1, observationerna ligga i [0, 1] och τ<sub>K</sub> = 1 − Z<sub>K</sub>/ζ(p) vara svansens vikt. Då är |m<sub>∞</sub> − m<sub>K</sub>| ≤ τ<sub>K</sub> ≤ (K+1)<sup>1−p</sup>/[(p − 1)ζ(p)].','<b>Truncation error.</b> Let p &gt; 1, the observations lie in [0, 1] and τ<sub>K</sub> = 1 − Z<sub>K</sub>/ζ(p) be the weight of the tail. Then |m<sub>∞</sub> − m<sub>K</sub>| ≤ τ<sub>K</sub> ≤ (K+1)<sup>1−p</sup>/[(p − 1)ζ(p)].'),
  L('Det fulla medelvärdet är en konvex blandning: m<sub>∞</sub> = (1 − τ<sub>K</sub>)m<sub>K</sub> + τ<sub>K</sub>m<sub>svans</sub>. Därför är |m<sub>∞</sub> − m<sub>K</sub>| = τ<sub>K</sub>|m<sub>svans</sub> − m<sub>K</sub>| ≤ τ<sub>K</sub>, eftersom båda medelvärdena ligger i [0, 1] (S9). Svansen uppfyller Σ<sub>n≥K+2</sub> n<sup>−p</sup> ≤ ∫<sub>K+1</sub><sup>∞</sup> x<sup>−p</sup> dx = (K+1)<sup>1−p</sup>/(p − 1).','The full mean is a convex mixture: m<sub>∞</sub> = (1 − τ<sub>K</sub>)m<sub>K</sub> + τ<sub>K</sub>m<sub>tail</sub>. Hence |m<sub>∞</sub> − m<sub>K</sub>| = τ<sub>K</sub>|m<sub>tail</sub> − m<sub>K</sub>| ≤ τ<sub>K</sub>, since both means lie in [0, 1] (S9). The tail satisfies Σ<sub>n≥K+2</sub> n<sup>−p</sup> ≤ ∫<sub>K+1</sub><sup>∞</sup> x<sup>−p</sup> dx = (K+1)<sup>1−p</sup>/(p − 1).')],
 ['thm','S13','D11, D12, K5',L('<b>Epstein-zeta för hexagonalt gitter.</b> För s &gt; 1 gäller Z<sub>hex</sub>(s) = 6 ζ(s) L(s, χ<sub>−3</sub>). Spåret är geometriskt. K4 §8 säger att det inte används som riskmultiplikator i FEWS.','<b>Epstein zeta for the hexagonal lattice.</b> For s &gt; 1, Z<sub>hex</sub>(s) = 6 ζ(s) L(s, χ<sub>−3</sub>). The track is geometric. K4 §8 states that it is not used as a risk multiplier in FEWS.'),
  L('Låt r(n) vara antalet (a, b) med a² + ab + b² = n. Formen a² + ab + b² är normen i Eisensteinheltalen ℤ[ω], som har sex enheter och entydig faktorisering. Därmed gäller den klassiska formeln r(n) = 6 Σ<sub>d|n</sub> χ<sub>−3</sub>(d). Då är Z<sub>hex</sub>(s) = Σ r(n) n<sup>−s</sup> = 6 Σ<sub>n</sub> Σ<sub>d|n</sub> χ<sub>−3</sub>(d) n<sup>−s</sup> = 6 ζ(s) L(s, χ<sub>−3</sub>), genom multiplikation av absolut konvergenta Dirichletserier (s &gt; 1). Formeln för r(n) är etablerad talteori och citeras. K5 kontrollerade identiteten numeriskt vid s = 3, med relativt fel 2,5·10<sup>−12</sup>. Fliken Riemann och zeta upprepar kontrollen.','Let r(n) be the number of (a, b) with a² + ab + b² = n. The form a² + ab + b² is the norm in the Eisenstein integers ℤ[ω], which have six units and unique factorisation. Hence the classical formula r(n) = 6 Σ<sub>d|n</sub> χ<sub>−3</sub>(d) holds. Then Z<sub>hex</sub>(s) = Σ r(n) n<sup>−s</sup> = 6 Σ<sub>n</sub> Σ<sub>d|n</sub> χ<sub>−3</sub>(d) n<sup>−s</sup> = 6 ζ(s) L(s, χ<sub>−3</sub>), by multiplying absolutely convergent Dirichlet series (s &gt; 1). The formula for r(n) is established number theory and is cited. K5 checked the identity numerically at s = 3, with relative error 2.5·10<sup>−12</sup>. The Riemann and zeta tab repeats the check.')],
 ['thm','S14','S10–S13, D11, R2',L('<b>Riemannhypotesen behövs inte.</b> Inget bevis i S1–S13 använder Riemannhypotesen. Den stöder inte heller referenstalen i D9 (K4 D07, K5 D19).','<b>The Riemann hypothesis is not needed.</b> No proof in S1–S13 uses the Riemann hypothesis. Nor does it support the reference numbers in D9 (K4 D07, K5 D19).'),
  L('Genomgång av bevisen visar att zeta och L bara används för reellt s &gt; 1, där serierna konvergerar absolut. Riemannhypotesen gäller nollställen i den kritiska remsan 0 &lt; Re s &lt; 1, som inget bevis ovan berör. K4 fann ingen beviskedja från hypotesen till de fyra talen i D9. Hypotesen är fortfarande olöst (R2).','Going through the proofs shows that zeta and L are used only for real s &gt; 1, where the series converge absolutely. The Riemann hypothesis concerns zeros in the critical strip 0 &lt; Re s &lt; 1, which no proof above touches. K4 found no chain of proof from the hypothesis to the four numbers in D9. The hypothesis remains unsolved (R2).')],
 ['thm','S15','D5, D9, S10, A1',L('<b>Talen med π.</b> (a) Det π-uttryck som kommer från zetaspåret är ζ(2) = π²/6 ≈ 1,6449 (S10), inte π/6 eller π/8. (b) κ = ℋ/8 och κ<sub>1</sub> = √3/8 är inte π/8: π/8 ≈ 0,3927, medan √3/8 ≈ 0,2165. I K2 förekommer π/8 bara som fasvinkel. (c) √3 ≈ 1,7321 ligger inom 95 %-intervallet för ℋ, så data i A1 kan inte skilja ℋ = √3 från ℋ̂ = 1,724.','<b>The numbers involving π.</b> (a) The π expression that comes from the zeta track is ζ(2) = π²/6 ≈ 1.6449 (S10), not π/6 or π/8. (b) κ = ℋ/8 and κ<sub>1</sub> = √3/8 are not π/8: π/8 ≈ 0.3927, whereas √3/8 ≈ 0.2165. In K2, π/8 appears only as a phase angle. (c) √3 ≈ 1.7321 lies inside the 95% interval for ℋ, so the data in A1 cannot distinguish ℋ = √3 from ℋ̂ = 1.724.'),
  L('(a) följer av S10. (b) Direkt beräkning: π/8 − √3/8 = (π − √3)/8 ≈ 0,176 ≠ 0. (c) 1,53 &lt; 1,7321 &lt; 1,96. Om ℋ = √3 är κ = κ<sub>1</sub> enligt D5 och D9. Det är en hypotes (K4: H), inte ett resultat.','(a) follows from S10. (b) Direct computation: π/8 − √3/8 = (π − √3)/8 ≈ 0.176 ≠ 0. (c) 1.53 &lt; 1.7321 &lt; 1.96. If ℋ = √3, then κ = κ<sub>1</sub> by D5 and D9. That is a hypothesis (K4: H), not a result.')],
 ['thm','S16','D13 (K4 P8)',L('<b>Kostnadsoptimal larmgräns.</b> Under D13 minimerar man förväntad förlust genom att larma om och endast om p ≥ C<sub>FP</sub>/(C<sub>FP</sub> + C<sub>FN</sub>).','<b>Cost-optimal alarm threshold.</b> Under D13 the expected loss is minimised by alarming if and only if p ≥ C<sub>FP</sub>/(C<sub>FP</sub> + C<sub>FN</sub>).'),
  L('Med larm är den förväntade förlusten (1 − p)C<sub>FP</sub>. Utan larm är den p·C<sub>FN</sub>. Larm är minst lika bra ⇔ (1 − p)C<sub>FP</sub> ≤ p C<sub>FN</sub> ⇔ C<sub>FP</sub> ≤ p(C<sub>FP</sub> + C<sub>FN</sub>). Gränsen beror på kostnaderna. Ingen geometrisk konstant är automatiskt optimal. Enligt A5 finns ännu inget kalibrerat p.','With an alarm the expected loss is (1 − p)C<sub>FP</sub>. Without an alarm it is p·C<sub>FN</sub>. An alarm is at least as good ⇔ (1 − p)C<sub>FP</sub> ≤ p C<sub>FN</sub> ⇔ C<sub>FP</sub> ≤ p(C<sub>FP</sub> + C<sub>FN</sub>). The threshold depends on the costs. No geometric constant is automatically optimal. By A5, no calibrated p exists yet.')],
 ['thm','S17','D14 (K4 §7)',L('<b>Den illustrativa dynamiken återgår till jämvikt.</b> För δ &gt; 0 gäller |D(t) − D<sub>eq</sub>| ≤ A<sub>0</sub>e<sup>−δt</sup> → 0. Formen kan alltså inte ensam representera kollaps. D(t) ∈ [0, 1] för alla t är garanterat om A<sub>0</sub> ≤ min(D<sub>eq</sub>, 1 − D<sub>eq</sub>).','<b>The illustrative dynamics return to equilibrium.</b> For δ &gt; 0, |D(t) − D<sub>eq</sub>| ≤ A<sub>0</sub>e<sup>−δt</sup> → 0. The form therefore cannot on its own represent collapse. D(t) ∈ [0, 1] for all t is guaranteed if A<sub>0</sub> ≤ min(D<sub>eq</sub>, 1 − D<sub>eq</sub>).'),
  L('|sin(·)| ≤ 1 ger gränsen, och e<sup>−δt</sup> → 0 när δ &gt; 0. Om A<sub>0</sub> ≤ min(D<sub>eq</sub>, 1 − D<sub>eq</sub>) gäller D<sub>eq</sub> − A<sub>0</sub> ≥ 0 och D<sub>eq</sub> + A<sub>0</sub> ≤ 1. K4 §7 visar dessutom att sinus inte är en oscillators allmänna lösning utan särskilda villkor, och för den korrigerade kandidaten M12 är energin avtagande utan drivning.','|sin(·)| ≤ 1 gives the bound, and e<sup>−δt</sup> → 0 when δ &gt; 0. If A<sub>0</sub> ≤ min(D<sub>eq</sub>, 1 − D<sub>eq</sub>), then D<sub>eq</sub> − A<sub>0</sub> ≥ 0 and D<sub>eq</sub> + A<sub>0</sub> ≤ 1. K4 §7 also shows that a sine is not the general solution of an oscillator without special conditions, and for the corrected candidate M12 the energy decreases without forcing.')],
 ['thm','S18','D5, D7, A2, A4, A6, S3, S8',L('<b>Ledtidsgränsen är inte κ.</b> c<sub>L</sub> (A6) och κ (D5) är olika gränser. Under A2 motsvarar c<sub>L</sub> = 0,22 på CDRS-skalan nivån D ≈ 0,78, medan κ = 0,2155 på nivåskalan motsvarar CDRS ≈ 0,7845 (S3). Som larm skulle c<sub>L</sub> flagga 79 % av länderna (A4). c<sub>L</sub> är därför en tidig ledtidssignal, och varningen ges vid 0,52 (A3).','<b>The lead-time threshold is not κ.</b> c<sub>L</sub> (A6) and κ (D5) are different thresholds. Under A2, c<sub>L</sub> = 0.22 on the CDRS scale corresponds to the level D ≈ 0.78, whereas κ = 0.2155 on the level scale corresponds to CDRS ≈ 0.7845 (S3). As an alarm, c<sub>L</sub> would flag 79% of countries (A4). c<sub>L</sub> is therefore an early lead-time signal, and the warning is given at 0.52 (A3).'),
  L('A2 avbildar x på CDRS-skalan på 1 − x på nivåskalan. Då blir c<sub>L</sub> ↦ 1 − 0,22 = 0,78 och κ ↦ 1 − 0,2155 = 0,7845. På en gemensam skala skiljer sig gränserna alltså med ungefär 0,56. Att 0,22 och 0,2155 ligger nära varandra jämför tal på olika skalor och säger därför ingenting om sambandet (S8). Andelen länder följer direkt ur A4. Därmed bär manusets påstående om en konvergens mellan ℋ och varningsområdet inte, men ledtidsresultatet i K6 står kvar som ett empiriskt fynd.','A2 maps x on the CDRS scale to 1 − x on the level scale. Then c<sub>L</sub> ↦ 1 − 0.22 = 0.78 and κ ↦ 1 − 0.2155 = 0.7845. On a common scale the thresholds therefore differ by about 0.56. That 0.22 and 0.2155 are close compares numbers on different scales and therefore says nothing about their relationship (S8). The share of countries follows directly from A4. The manuscript’s claim of a convergence between ℋ and the warning region therefore does not hold, but the lead-time result in K6 stands as an empirical finding.')]
];}
function ref(ids){return String(ids).split(/,\s*/).map(function(x){var id=x.trim().split(' ')[0].split('–')[0];return /^[DAS]\d/.test(id)?'<span class="ref" data-ref="'+id+'">'+x.trim()+'</span>':'<span class="note">'+x.trim()+'</span>';}).join(' ');}
function basis(ids){return '<div class="basis">'+L('Bygger på','Based on')+': '+ref(ids)+'</div>';}

function slider(id,lab,min,max,step,val,dec){return '<label>'+lab+' <output id="o-'+id+'">'+f(val,dec!=null?dec:(step<1?2:0))+'</output><input type="range" id="s-'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" data-dec="'+(dec!=null?dec:(step<1?2:0))+'"></label>';}
function vG(){var g=G(),h='<h2>'+L('Grund: definition, antagande, sats och bevis','Foundation: definition, assumption, proposition and proof')+'</h2>';
 h+='<p>'+L('All matematik i kalkylatorn står här i euklidisk ordning. Varje symbol definieras innan den används. Empiriska värden och tolkningar anges som antaganden med källa och bevisas inte. Varje sats bevisas ur definitionerna och de antaganden som anges. De andra flikarna hänvisar hit med D-, A- och S-nummer. Klicka på ett nummer för att gå till det.','All mathematics in the calculator is set out here in Euclidean order. Every symbol is defined before it is used. Empirical values and interpretations are stated as assumptions with their source and are not proven. Every proposition is proved from the definitions and the stated assumptions. The other tabs refer here by D, A and S numbers. Click a number to go to it.')+'</p>';
 h+='<div class="banner info">'+L('Status: K4 (v0.2, 21 november 2026) är en forskningsversion. Den blir inte kanonisk utan ett uttryckligt senare beslut. Dess bevis är analytiska härledningar och är inte verifierade i Lean eller Isabelle.','Status: K4 (v0.2, 21 November 2026) is a research version. It does not become canonical without an explicit later decision. Its proofs are analytical derivations and are not verified in Lean or Isabelle.')+'</div>';
 h+='<h3>'+L('Källor','Sources')+'</h3><div class="scroll"><table class="tbl"><tbody>'+Object.keys(SRC).map(function(k){return '<tr><td style="width:60px"><b>'+k+'</b></td><td>'+SRC[k][sv()?0:1]+'</td></tr>';}).join('')+'</tbody></table></div>';
 h+='<div class="toc">'+g.map(function(e){return '<span class="ref" data-ref="'+e[1]+'">'+e[1]+'</span>';}).join('')+'</div>';
 var sec=[['def',L('1. Definitioner','1. Definitions')],['ass',L('2. Antaganden (empiriska och tolkningar, bevisas inte)','2. Assumptions (empirical and interpretive, not proven)')],['thm',L('3. Satser med bevis','3. Propositions with proofs')]];
 sec.forEach(function(s){h+='<h3>'+s[1]+'</h3>';g.filter(function(e){return e[0]===s[0];}).forEach(function(e){
  h+='<div class="el '+e[0]+'" id="el-'+e[1]+'"><span class="src">'+ref(e[2])+'</span><span class="id">'+e[1]+'</span>'+e[3];
  if(e[4])h+='<div class="pf"><b>'+L('Bevis.','Proof.')+'</b> '+e[4]+' <i class="qed">∎</i></div>';
  h+='</div>';});});
 return h;}
function vC(){var c=cdrs(),lev=1-c,b=band(c),warn=c>=WARN,crit=c>=KCDRS;
 var LB=sv()?{F:'F · finanspolitisk integritet',C:'C · konstitutionella begränsningar',O:'O · organisatorisk konkurrens',N:'N · demokratiska normer',R:'R · institutionell motståndskraft'}:{F:'F · fiscal integrity',C:'C · constitutional constraint',O:'O · organizational competition',N:'N · democratic norms',R:'R · institutional resilience'};
 var h='<h2>'+L('CDRS och trösklar','CDRS and thresholds')+'</h2>'+basis('D7, D8, A2, A3, A6, S3, S4, S5, S18');
 h+=('<div class="formula">CDRS = Σ w<sub>j</sub>·X<sub>j</sub> (D7) · '+L('varning','warning')+': CDRS ≥ 0,52 (D8, A3) · κ '+L('på CDRS-skalan','on the CDRS scale')+': CDRS ≥ 1 − κ = 0,7845 (S3) · '+L('ledtidsgräns','lead-time threshold')+' c<sub>L</sub> ≈ 0,22 (A6, S18)</div>').replace(/0,(\d)/g,sv()?'0,$1':'0.$1');
 h+='<div class="ctrl">'+['F','C','O','N','R'].map(function(k){return slider(k,LB[k],0,1,.01,S[k]);}).join('')+'</div>';

 if(S.custom)h+='<div class="ctrl">'+['F','C','O','N','R'].map(function(k){return slider('w'+k,'w<sub>'+k+'</sub>',0,1,.05,S['w'+k]);}).join('')+'</div>';
 h+='<div class="bar"><i style="width:'+(c*100)+'%;background:'+(crit?'var(--bad)':warn?'var(--warn)':'var(--ok)')+'"></i>'
   +'<span class="mk l" style="left:'+(CL*100)+'%"><b>c<sub>L</sub> (A6)</b></span><span class="mk g" style="left:'+(WARN*100)+'%"><b>'+f(WARN,2)+'</b></span><span class="mk" style="left:'+(KCDRS*100)+'%"><b>1−κ</b></span></div>';
 h+='<div class="cards"><div class="card"><div class="k">CDRS (D7)</div><div class="v">'+f(c,3)+'</div><div class="s">'+L('Riskband (D8)','Risk band (D8)')+': <b>'+b+'</b></div></div>';
 h+='<div class="card"><div class="k">'+L('Ledtidssignal c<sub>L</sub> (A6, S18)','Lead-time signal c<sub>L</sub> (A6, S18)')+'</div><div class="v" style="font-size:20px">'+(c>=CL?L('Ja','Yes'):L('Nej','No'))+'</div><div class="s">CDRS '+(c>=CL?'≥':'&lt;')+' '+f(CL,2)+'</div></div>';
 h+='<div class="card"><div class="k">'+L('Empirisk varning (A3, S4)','Empirical warning (A3, S4)')+'</div><div class="v" style="font-size:20px;color:'+(warn?'var(--bad)':'var(--ok)')+'">'+(warn?L('Ja','Yes'):L('Nej','No'))+'</div><div class="s">CDRS '+(warn?'≥':'&lt;')+' '+f(WARN,2)+'</div></div>';
 h+='<div class="card"><div class="k">'+L('Motsvarande nivå D (A2)','Corresponding level D (A2)')+'</div><div class="v">'+f(lev,3)+'</div><div class="s">D ≈ 1 − CDRS</div></div>';
 h+='<div class="card"><div class="k">'+L('Under κ på nivåskalan (S3)','Below κ on the level scale (S3)')+'</div><div class="v" style="font-size:20px;color:'+(crit?'var(--bad)':'var(--ok)')+'">'+(crit?L('Ja','Yes'):L('Nej','No'))+'</div><div class="s">D '+(crit?'≤':'&gt;')+' κ = '+f(KAPPA,4)+' ⇔ CDRS '+(crit?'≥':'&lt;')+' '+f(KCDRS,4)+'</div></div></div>';
 h+='<p class="note">'+L('Den grå markeringen är ledtidsgränsen c<sub>L</sub> ≈ 0,22 (A6). Den ger den tidigaste signalen men är inget larm, eftersom de flesta länder ligger över den (S18). Den är inte κ: κ hör till nivåskalan och motsvarar 1 − κ = 0,7845 här (S3).','The grey marker is the lead-time threshold c<sub>L</sub> ≈ 0.22 (A6). It gives the earliest signal but is not an alarm, since most countries lie above it (S18). It is not κ: κ belongs to the level scale and corresponds to 1 − κ = 0.7845 here (S3).')+'</p>';
 var th=alarmThreshold(S.cfp,S.cfn),al=S.p>=th;
 h+='<h3>'+L('Kostnadsbaserad larmgräns','Cost-based alarm threshold')+'</h3>'+basis('D13, A5, S16');
 h+='<div class="ctrl">'+slider('p',L('Kalibrerad sannolikhet p','Calibrated probability p'),0,1,.01,S.p)+slider('cfp','C<sub>FP</sub> ('+L('falsklarm','false alarm')+')',.1,10,.1,S.cfp,1)+slider('cfn','C<sub>FN</sub> ('+L('missad händelse','missed event')+')',.1,10,.1,S.cfn,1)+'</div>';
 h+='<div class="cards"><div class="card"><div class="k">'+L('Gräns p*','Threshold p*')+'</div><div class="v">'+f(th,3)+'</div><div class="s">C<sub>FP</sub>/(C<sub>FP</sub> + C<sub>FN</sub>)</div></div><div class="card"><div class="k">'+L('Beslut (S16)','Decision (S16)')+'</div><div class="v" style="font-size:20px;color:'+(al?'var(--bad)':'var(--ok)')+'">'+(al?L('Larma','Alarm'):L('Inget larm','No alarm'))+'</div><div class="s">p '+(al?'≥':'&lt;')+' p*</div></div></div>';
 h+='<div class="banner">'+L('Enligt A5 finns ännu inget kalibrerat p. CDRS ska inte matas in som p. Verktyget visar hur beslutsregeln fungerar.','By A5 there is no calibrated p yet. CDRS must not be entered as p. The tool shows how the decision rule works.')+'</div>';
 return h;}
function vH(){var rec=parse(S.rec),ero=parse(S.ero),ann=parse(S.ann,true),ok=rec.length&&ero.length;
 var h='<h2>'+L('Skatta ℋ','Estimate ℋ')+'</h2>'+basis('D2, D3, D4, D5, A1, S1, S2');
 h+='<div class="formula">ℋ<sub>1</sub> = [(1/R) Σ M<sup>+</sup>] / [(1/E) Σ M<sup>−</sup>] (D3) · ℋ<sub>2</sub> = Σ Δ<sup>+</sup> / Σ |Δ<sup>−</sup>| (D4) · ℋ<sub>1</sub> = ℋ<sub>Σ</sub>·E/R (S1) · κ = ℋ/8 (D5)</div>';
 h+='<h3>'+L('E1: episoder (K1)','E1: episodes (K1)')+'</h3><p>'+L('Klistra in storleken på varje episod som positiva tal, åtskilda med mellanslag, semikolon eller radbrytning. Bootstrap drar episoder med återläggning.','Paste the magnitude of each episode as positive numbers separated by spaces, semicolons or line breaks. The bootstrap resamples episodes with replacement.')+'</p>';
 h+='<div class="ctrl"><label>'+L('Erosionsepisoder M⁻','Erosion episodes M⁻')+'<textarea id="t-ero">'+S.ero+'</textarea></label><label>'+L('Återhämtningsepisoder M⁺','Recovery episodes M⁺')+'<textarea id="t-rec">'+S.rec+'</textarea></label></div>';
 h+='<div class="ctrl">'+slider('B',L('Bootstrapdrag B','Bootstrap draws B'),500,10000,500,S.B)+'</div>';
 h+='<button class="btn" id="b-run">'+L('Beräkna','Compute')+'</button><button class="btn ghost" id="b-doc">'+L('Visa dokumentets tal (109,4 / 63,5)','Show the document\'s numbers (109.4 / 63.5)')+'</button>';
 if(ok){var pt=mean(rec)/mean(ero),hs=sum(rec)/sum(ero),bs=(rec.length>1||ero.length>1)?bootstrapH(rec,ero,S.B):null;
  h+='<div class="cards"><div class="card"><div class="k">ℋ<sub>1</sub> (D3)</div><div class="v">'+f(pt,3)+'</div><div class="s">R = '+rec.length+', E = '+ero.length+'</div></div>';
  h+='<div class="card"><div class="k">ℋ<sub>Σ</sub> (S1)</div><div class="v">'+f(hs,3)+'</div><div class="s">ℋ<sub>Σ</sub>·E/R = '+f(hs*ero.length/rec.length,3)+(rec.length===ero.length?L(' (R = E, lika)',' (R = E, equal)'):L(' (R ≠ E, olika)',' (R ≠ E, different)'))+'</div></div>';
  h+='<div class="card"><div class="k">'+L('Bootstrap-median','Bootstrap median')+'</div><div class="v">'+(bs?f(bs.med,3):'–')+'</div><div class="s">95 %: '+(bs?f(bs.lo,3)+' – '+f(bs.hi,3):L('kräver fler än en episod','needs more than one episode'))+'</div></div>';
  h+='<div class="card"><div class="k">κ = ℋ<sub>1</sub>/8 (D5)</div><div class="v">'+f(pt/8,4)+'</div><div class="s">1 − κ = '+f(1-pt/8,4)+' (S3)</div></div></div>';}
 h+='<h3>'+L('E2: årliga förändringar (K2)','E2: annual changes (K2)')+'</h3><p>'+L('Klistra in årliga förändringar av D med tecken, till exempel 0.02 -0.05 0.01.','Paste annual changes of D with sign, for example 0.02 -0.05 0.01.')+'</p>';
 h+='<div class="ctrl"><label>Δ<textarea id="t-ann">'+S.ann+'</textarea></label></div><button class="btn" id="b-ann">'+L('Beräkna ℋ₂','Compute ℋ₂')+'</button>';
 if(ann.length){var P=sum(ann.filter(function(x){return x>0;})),N=-sum(ann.filter(function(x){return x<0;}));
  h+='<div class="cards"><div class="card"><div class="k">ℋ<sub>2</sub> (D4)</div><div class="v">'+(N>0?f(P/N,3):'–')+'</div><div class="s">Σ Δ<sup>+</sup> = '+f(P,3)+', Σ |Δ<sup>−</sup>| = '+f(N,3)+'</div></div></div>';}
 h+='<p class="note">'+L('A1: K1 anger 109,4/63,5 och K2 anger 109,38/63,46, båda ≈ 1,724. Enligt S1 kan talparet inte vara både medelvärden och summor av samma episoder om R ≠ E. Episoderna bakom skattningen finns inte i dokumenten, så intervallet [1,53; 1,96] kan inte återskapas här.','A1: K1 gives 109.4/63.5 and K2 gives 109.38/63.46, both ≈ 1.724. By S1 the pair cannot be both means and sums of the same episodes if R ≠ E. The episodes behind the estimate are not in the documents, so the interval [1.53, 1.96] cannot be reproduced here.')+'</p>';
 return h;}
function vR(){var need=S.dM*H0;
 var h='<h2>'+L('Återhämtningskrav','Recovery requirement')+'</h2>'+basis('D2, D3, A1, S6')+'<div class="formula">'+L('Krav','Requirement')+' = ℋ · ΔM<sup>−</sup> · '+L('utöver förlusten','beyond the loss')+' = (ℋ − 1) · ΔM<sup>−</sup> (S6)</div>';
 h+='<div class="ctrl">'+slider('dM',L('Förlorad demokratinivå ΔM⁻ (skala 0–1)','Democracy lost ΔM⁻ (0–1 scale)'),0.01,0.8,0.01,S.dM)+'</div>';
 h+='<div class="cards"><div class="card"><div class="k">'+L('Kumulativ återhämtningsrörelse','Cumulative restorative movement')+'</div><div class="v">'+f(need,3)+'</div><div class="s">95 %: '+f(S.dM*CI[0],3)+' – '+f(S.dM*CI[1],3)+' (A1)</div></div>';
 h+='<div class="card"><div class="k">'+L('Rörelse utöver förlusten','Movement beyond the loss')+'</div><div class="v">'+f(need-S.dM,3)+'</div><div class="s">(ℋ − 1) · ΔM<sup>−</sup></div></div></div>';
 h+='<p class="note">'+L('Enligt S6 gäller kvoten storlek, inte tid. Kalkylatorn räknar därför inte om kravet till år.','By S6 the ratio concerns magnitude, not time. The calculator therefore does not convert the requirement into years.')+'</p>';return h;}
function vZ(){var p=S.kp,K=S.kK,kr=kernel(p,K),zp=p>1?zeta(p):Infinity,tau=p>1?1-kr.Z/zp:null,tb=p>1?Math.pow(K+1,1-p)/((p-1)*zp):null,lag=p>2?(zeta(p-1)-zp)/zp:Infinity,lagK=kr.w.reduce(function(a,w,k){return a+k*w;},0);
 var h='<h2>'+L('Riemann och zeta','Riemann and zeta')+'</h2>'+basis('D10, D11, D12, S9, S10, S11, S12, S13, S14, S15');

var VIEWS={grund:vG,cdrs:vC,h:vH,rec:vR,zeta:vZ,hex:vHex,dyn:vD,norm:vN,x:vX};
function post(){try{if(parent!==window)parent.postMessage({type:'gc-height',src:'hlcalc',height:Math.ceil(document.getElementById('app').getBoundingClientRect().height)+8},'*');}catch(e){}}
function goRef(id){if(TAB!=='grund'){TAB='grund';render();}var el=document.getElementById('el-'+id);if(!el)return;
 document.querySelectorAll('.el.hit').forEach(function(x){x.classList.remove('hit');});el.classList.add('hit');
 if(parent!==window){try{parent.postMessage({type:'gc-scroll',src:'hlcalc',top:el.getBoundingClientRect().top+window.scrollY},'*');}catch(e){}}
 el.scrollIntoView({block:'start'});}
function render(){var TB=[['grund',L('Grund: D → S → bevis','Foundation: D → P → proof')],['cdrs',L('CDRS och trösklar','CDRS and thresholds')],['h',L('Skatta ℋ','Estimate ℋ')],['rec',L('Återhämtningskrav','Recovery requirement')],['zeta',L('Riemann och zeta','Riemann and zeta')],['hex',L('Hexagonen','The hexagon')],['dyn',L('Dynamik','Dynamics')],['norm',L('Normalisering','Normalisation')],['x',L('Avvikelser','Discrepancies')]];
 if(!VIEWS[TAB])TAB='grund';
 var h='<div class="lang"><button data-l="sv" aria-pressed="'+sv()+'">SV</button><button data-l="en" aria-pressed="'+(!sv())+'">EN</button></div>';
 if(!EMB)h+='<div class="eye">'+L('FieldShift · Hedlund-Leijon-principen · kalkylator','FieldShift · Hedlund-Leijon Principle · calculator')+'</div><h1>'+L('HL-kalkylator i euklidisk form','HL calculator in Euclidean form')+'</h1>';
 h+='<p>'+L('Kalkylatorn bygger på definitioner, uttalade antaganden och bevisade satser (fliken Grund). Den använder den senaste matematiska dokumentationen, FieldShift och hexagonens lag v0.2, tillsammans med de tidigare HL-dokumenten. κ är en gräns på demokratinivåns skala. På CDRS-skalan motsvarar den 0,7845. Varningsgränsen 0,52 är en empirisk kalibrering. Ledtidsgränsen 0,22 på CDRS-skalan är också empirisk och är inte κ (A6, S18).','The calculator is built from definitions, stated assumptions and proven propositions (the Foundation tab). It uses the latest mathematical documentation, FieldShift and the law of the hexagon v0.2, together with the earlier HL documents. κ is a threshold on the democracy-level scale. On the CDRS scale it corresponds to 0.7845. The warning threshold 0.52 is an empirical calibration. The lead-time threshold 0.22 on the CDRS scale is also empirical and is not κ (A6, S18).')+'</p>';
 h+='<div class="formula">'+L('ℋ̂ = 1,724 (95 %: 1,53–1,96, A1) · κ = ℋ/8 = 0,2155 (S2) · 1 − κ = 0,7845 (S3) · '+'ζ(2) = π²/6 (S10) · Riemannhypotesen behövs inte (S14)','ℋ̂ = 1.724 (95%: 1.53–1.96, A1) · κ = ℋ/8 = 0.2155 (S2) · 1 − κ = 0.7845 (S3) · ζ(2) = π²/6 (S10) · the Riemann hypothesis is not needed (S14)')+'</div>';
 h+='<div class="tabs" role="tablist">'+TB.map(function(x){return '<button role="tab" data-t="'+x[0]+'" aria-selected="'+(TAB===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
 h+=VIEWS[TAB]();
 var app=document.getElementById('app');app.innerHTML=h;document.documentElement.lang=LANG;document.title=L('HL-kalkylator','HL calculator');
 app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){LANG=b.dataset.l;render();};});
 app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;render();};});
 app.querySelectorAll('[data-ref]').forEach(function(b){b.setAttribute('role','link');b.setAttribute('tabindex','0');b.onclick=function(){goRef(b.dataset.ref);};b.onkeydown=function(e){if(e.key==='Enter')goRef(b.dataset.ref);};});
 app.querySelectorAll('input[type=range]').forEach(function(s){s.oninput=function(){var k=s.id.slice(2);S[k]=+s.value;var o=document.getElementById('o-'+k);if(o)o.textContent=f(+s.value,+s.dataset.dec);clearTimeout(window.__rt);window.__rt=setTimeout(function(){var y=window.scrollY,id=s.id;render();window.scrollTo(0,y);var n=document.getElementById(id);if(n)n.focus();},120);};});
 var cw=document.getElementById('cw');if(cw)cw.onchange=function(){S.custom=cw.checked;render();};
 var run=document.getElementById('b-run');if(run)run.onclick=function(){S.ero=document.getElementById('t-ero').value;S.rec=document.getElementById('t-rec').value;render();};
 var doc=document.getElementById('b-doc');if(doc)doc.onclick=function(){S.rec='109.4';S.ero='63.5';render();};
 var ba=document.getElementById('b-ann');if(ba)ba.onclick=function(){S.ann=document.getElementById('t-ann').value;render();};
 var p2=document.getElementById('b-p2');if(p2)p2.onclick=function(){S.kp=2;render();};
 var ep=document.getElementById('b-ep');if(ep)ep.onclick=function(){var s=S.es,e=epsteinHex(s,S.eR),rhs=6*zeta(s)*Lchi3(s),rel=Math.abs(e.corrected-rhs)/rhs;
  document.getElementById('ep-out').innerHTML='<div class="cards"><div class="card"><div class="k">'+L('Gittersumma','Lattice sum')+' ('+e.points+' '+L('punkter','points')+')</div><div class="v">'+f(e.partial,6)+'</div><div class="s">'+L('med svans','with tail')+': '+f(e.corrected,6)+'</div></div><div class="card"><div class="k">6 ζ(s) L(s, χ<sub>−3</sub>)</div><div class="v">'+f(rhs,6)+'</div><div class="s">ζ = '+f(zeta(s),6)+', L = '+f(Lchi3(s),6)+'</div></div><div class="card"><div class="k">'+L('Relativt fel','Relative error')+'</div><div class="v">'+rel.toExponential(1)+'</div><div class="s">'+L('numerisk kontroll av S13','numerical check of S13')+'</div></div></div>';post();};
 ['n-z','n-min','n-max'].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=function(){S[{'n-z':'z','n-min':'zmin','n-max':'zmax'}[id]]=parseFloat(e.value);render();};});
 var nd=document.getElementById('n-dir');if(nd)nd.onchange=function(){S.zdir=nd.value;render();};
 post();
}
window.HL_CALC={version:'2.0 (2026-11-25, euklidisk)',H:H0,H_CI:CI,kappa:KAPPA,kappaOnCDRS:KCDRS,warnCDRS:WARN,
 cdrs:function(F,C,O,N,R){return (F+C+O+N+R)/5;},norm:norm,bootstrapH:bootstrapH,zeta:zeta,Lchi3:Lchi3,epsteinHex:epsteinHex,kernel:kernel,alarmThreshold:alarmThreshold,
 elements:function(){return G().map(function(e){return e[1];});},setTab:function(t){TAB=t;render();},setLang:function(l){LANG=l==='en'?'en':'sv';render();}};
window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='hlcalc-lang'){LANG=d.lang==='en'?'en':'sv';render();}if(d.type==='hlcalc-goto'&&d.id){goRef(String(d.id));}});
render();
})();
</script>
</body>
</html>
