<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="FieldShift Research Institute — Official Seal">
  <defs>
    <!-- Top arc: institution name -->
    <path id="arcTop"    d="M 46,200 A 154,154 0 0,1 354,200"/>
    <!-- Bottom arc: motto -->
    <path id="arcBottom" d="M 82,272 A 154,154 0 0,0 318,272"/>
    <!-- Inner top arc: sub-text -->
    <path id="arcInner"  d="M 68,200 A 132,132 0 0,1 332,200"/>
    <!-- EST arc at very bottom -->
    <path id="arcEst"    d="M 116,304 A 154,154 0 0,0 284,304"/>
  </defs>

  <!-- ── Background ── -->
  <circle cx="200" cy="200" r="196" fill="#0d2247"/>

  <!-- ── Border rings ── -->
  <!-- Outermost thin ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="#c9a84c" stroke-width="1.2"/>
  <!-- Main thick ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="#c9a84c" stroke-width="3.5"/>
  <!-- Inner thin ring (text boundary) -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.45"/>
  <!-- Content separator ring -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.55"/>
  <!-- Innermost decorative ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.28"/>

  <!-- ── Compass ornaments on outer ring ── -->
  <!-- North -->
  <line x1="200" y1="4"   x2="200" y2="14"  stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="16" r="2.8" fill="#c9a84c" opacity="0.7"/>
  <!-- South -->
  <line x1="200" y1="396" x2="200" y2="386" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="384" r="2.8" fill="#c9a84c" opacity="0.7"/>
  <!-- East -->
  <line x1="396" y1="200" x2="386" y2="200" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="384" cy="200" r="2.8" fill="#c9a84c" opacity="0.7"/>
  <!-- West -->
  <line x1="4"   y1="200" x2="14"  y2="200" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="16"  cy="200" r="2.8" fill="#c9a84c" opacity="0.7"/>

  <!-- Diagonal tick marks at 45° positions -->
  <line x1="341" y1="59"  x2="335" y2="65"  stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <line x1="59"  y1="59"  x2="65"  y2="65"  stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <line x1="341" y1="341" x2="335" y2="335" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <line x1="59"  y1="341" x2="65"  y2="335" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>

  <!-- ── Ring text ── -->
  <!-- Top: FIELDSHIFT RESEARCH INSTITUTE -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="17" font-weight="700"
        letter-spacing="0.18em" fill="#c9a84c">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      FIELDSHIFT RESEARCH INSTITUTE
    </textPath>
  </text>

  <!-- Bottom: motto -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="10.5" font-style="italic"
        letter-spacing="0.06em" fill="#8eafc8" opacity="0.9">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      Advancing the Science of State
    </textPath>
  </text>

  <!-- EST. MMXXV flanked by bullets -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="11"
        letter-spacing="0.22em" fill="#c9a84c" opacity="0.65">
    <textPath href="#arcEst" startOffset="50%" text-anchor="middle">
      &#x2022;&#x2002;EST. MMXXV&#x2002;&#x2022;
    </textPath>
  </text>

  <!-- ── Centre content ── -->
  <!-- Fine horizontal rule above wordmark -->
  <line x1="112" y1="174" x2="288" y2="174" stroke="#c9a84c" stroke-width="0.7" opacity="0.35"/>

  <!-- "FieldShift" centred, serif, two-colour -->
  <text x="200" y="218"
        text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="52"
        font-weight="700"
        letter-spacing="-1.5"
        fill="#f0ece4">Field<tspan fill="#c9a84c">Shift</tspan></text>

  <!-- Fine horizontal rule below wordmark -->
  <line x1="112" y1="228" x2="288" y2="228" stroke="#c9a84c" stroke-width="0.7" opacity="0.35"/>

  <!-- "RESEARCH INSTITUTE" in small caps -->
  <text x="200" y="246"
        text-anchor="middle"
        font-family="'Source Sans 3', Arial, sans-serif"
        font-size="11"
        letter-spacing="0.26em"
        fill="#7aabcf">RESEARCH INSTITUTE</text>
</svg>
