<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="FieldShift Research Institute Seal">
  <defs>
    <!-- Text path for top arc -->
    <path id="topArc" d="M 40,150 A 110,110 0 0,1 260,150"/>
    <!-- Text path for bottom arc -->
    <path id="bottomArc" d="M 68,210 A 110,110 0 0,0 232,210"/>
    <!-- Inner motto arc -->
    <path id="mottoArc" d="M 58,150 A 92,92 0 0,1 242,150"/>
  </defs>

  <!-- Navy background -->
  <circle cx="150" cy="150" r="142" fill="#0d2247"/>

  <!-- Outer border rings -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#c9a84c" stroke-width="3"/>
  <circle cx="150" cy="150" r="134" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>

  <!-- Compass-point dots -->
  <circle cx="150" cy="10"  r="2.5" fill="#c9a84c" opacity="0.6"/>
  <circle cx="150" cy="290" r="2.5" fill="#c9a84c" opacity="0.6"/>
  <circle cx="10"  cy="150" r="2.5" fill="#c9a84c" opacity="0.6"/>
  <circle cx="290" cy="150" r="2.5" fill="#c9a84c" opacity="0.6"/>

  <!-- Inner separator ring -->
  <circle cx="150" cy="150" r="108" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.35"/>

  <!-- "FS" monogram centered — serif, gold -->
  <text x="150" y="172"
        text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="80"
        font-weight="700"
        letter-spacing="-4"
        fill="#c9a84c">FS</text>

  <!-- Fine horizontal rule through center -->
  <line x1="80" y1="162" x2="220" y2="162" stroke="#c9a84c" stroke-width="0.6" opacity="0.25"/>

  <!-- RING TEXT: top arc -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="14" font-weight="700" letter-spacing="0.12em" fill="#c9a84c">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">FIELDSHIFT RESEARCH INSTITUTE</textPath>
  </text>

  <!-- RING TEXT: bottom arc — EST. MMXXV -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="11" font-weight="400" letter-spacing="0.2em" fill="#c9a84c" opacity="0.75">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EST. MMXXV</textPath>
  </text>

  <!-- Inner motto arc -->
  <text font-family="'Libre Baskerville', Georgia, serif" font-size="8.5" font-style="italic" letter-spacing="0.06em" fill="#7aabcf" opacity="0.85">
    <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">Advancing the Science of State</textPath>
  </text>

  <!-- Decorative dots flanking bottom text -->
  <text x="98"  y="232" font-family="Georgia,serif" font-size="10" fill="#c9a84c" opacity="0.5" text-anchor="middle">&#x2022;</text>
  <text x="202" y="232" font-family="Georgia,serif" font-size="10" fill="#c9a84c" opacity="0.5" text-anchor="middle">&#x2022;</text>
</svg>
