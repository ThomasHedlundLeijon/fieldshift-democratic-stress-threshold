<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="FieldShift Research Institute mark">
  <!-- Navy background -->
  <rect width="100" height="100" fill="#0d2247"/>

  <!-- "FS" ligature monogram — serif, gold -->
  <text x="50" y="64"
        text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="52"
        font-weight="700"
        letter-spacing="-3"
        fill="#c9a84c">FS</text>

  <!-- Bottom rule -->
  <line x1="16" y1="76" x2="84" y2="76" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>

  <!-- "FIELDSHIFT" micro text -->
  <text x="50" y="88"
        text-anchor="middle"
        font-family="'Source Sans 3', Arial, sans-serif"
        font-size="7.5"
        letter-spacing="0.18em"
        fill="#7aabcf">FIELDSHIFT</text>
</svg>
