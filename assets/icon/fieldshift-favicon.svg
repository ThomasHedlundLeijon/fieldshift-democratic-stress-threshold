<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FieldShift">
  <defs>
    <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96e"/>
      <stop offset="100%" stop-color="#b8922a"/>
    </linearGradient>
    <linearGradient id="hF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4a8a"/>
      <stop offset="100%" stop-color="#0d2247"/>
    </linearGradient>
  </defs>

  <!-- Flat-top hexagon at (16,16), R=14 -->
  <!-- angles 30,90,150,210,270,330: -->
  <!-- (16+14cos30, 16+14sin30) = (28.1,23) etc. -->
  <polygon
    points="28.1,23 16,30 3.9,23 3.9,9 16,2 28.1,9"
    fill="url(#hF)"
    stroke="url(#gG)"
    stroke-width="1.4"
    stroke-linejoin="round"/>

  <!-- Inner hexagon (pointy-top), R=8 — very subtle at this size -->
  <polygon
    points="24,16 20,22.9 12,22.9 8,16 12,9.1 20,9.1"
    fill="none"
    stroke="#b8922a"
    stroke-width="0.6"
    opacity="0.4"/>

  <!-- Simplified threshold step (3 points is enough at 32px) -->
  <polyline
    points="6,19 12,19 13.5,12 18.5,12 20,19 26,19"
    fill="none"
    stroke="url(#gG)"
    stroke-width="1.8"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Observer dot -->
  <circle cx="18.5" cy="12" r="1.8" fill="#e8c96e"/>
</svg>
