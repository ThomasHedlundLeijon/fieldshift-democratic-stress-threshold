<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="FieldShift Research Institute">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96e"/>
      <stop offset="100%" stop-color="#b8922a"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4a8a"/>
      <stop offset="100%" stop-color="#0d2247"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="220" height="200" fill="#0d2247"/>

  <!-- === HEXAGON MARK centered at (110, 58), R=42 === -->
  <polygon
    points="152,58 131,94.4 89,94.4 68,58 89,21.6 131,21.6"
    fill="url(#hexFill)"
    stroke="url(#goldGrad)"
    stroke-width="2"
    stroke-linejoin="round"/>

  <!-- Inner hexagon (rotated 30°), R≈25 -->
  <polygon
    points="135,58 122.5,79.6 97.5,79.6 85,58 97.5,36.4 122.5,36.4"
    fill="none"
    stroke="#b8922a"
    stroke-width="0.9"
    opacity="0.35"/>

  <!-- Radial spokes to alternating vertices -->
  <line x1="110" y1="58" x2="152" y2="58"  stroke="#b8922a" stroke-width="0.7" opacity="0.22"/>
  <line x1="110" y1="58" x2="89"  y2="94.4" stroke="#b8922a" stroke-width="0.7" opacity="0.22"/>
  <line x1="110" y1="58" x2="89"  y2="21.6" stroke="#b8922a" stroke-width="0.7" opacity="0.22"/>

  <!-- Baseline rule -->
  <line x1="74" y1="65" x2="146" y2="65" stroke="#b8922a" stroke-width="0.7" opacity="0.28"/>

  <!-- Threshold / field-shift polyline -->
  <polyline
    points="76,65 87,65 96,44 124,44 133,65 144,65"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="2.6"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Observer dot -->
  <circle cx="124" cy="44" r="3.4" fill="#e8c96e"/>
  <circle cx="124" cy="44" r="6.2" fill="none" stroke="#e8c96e" stroke-width="0.8" opacity="0.38"/>

  <!-- === WORDMARK (centered) === -->
  <text x="110" y="128"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="28"
        font-weight="700"
        letter-spacing="-0.5"
        text-anchor="middle"
        fill="#f0ece4">Field<tspan fill="#e8c96e">Shift</tspan></text>

  <!-- Divider rule -->
  <line x1="30" y1="138" x2="190" y2="138" stroke="#b8922a" stroke-width="0.7" opacity="0.55"/>

  <text x="110" y="152"
        font-family="'Source Sans 3', system-ui, sans-serif"
        font-size="9"
        font-weight="400"
        letter-spacing="0.2em"
        text-anchor="middle"
        fill="#7aabcf">RESEARCH INSTITUTE</text>

  <!-- Tagline -->
  <text x="110" y="175"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="9"
        font-style="italic"
        letter-spacing="0.04em"
        text-anchor="middle"
        fill="#a8c4e0">Advancing the Science of State</text>
</svg>
