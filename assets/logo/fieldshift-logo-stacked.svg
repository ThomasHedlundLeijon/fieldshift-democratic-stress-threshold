<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130" role="img" aria-label="FieldShift Research Institute">
  <!-- Navy background -->
  <rect width="320" height="130" fill="#0d2247"/>

  <!-- "FieldShift" centered -->
  <text x="160" y="58"
        text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="42"
        font-weight="700"
        letter-spacing="-1"
        fill="#f0ece4">Field<tspan fill="#c9a84c">Shift</tspan></text>

  <!-- Full-width rule -->
  <line x1="32" y1="70" x2="288" y2="70" stroke="#c9a84c" stroke-width="0.6" opacity="0.55"/>

  <!-- "RESEARCH INSTITUTE" centered -->
  <text x="160" y="86"
        text-anchor="middle"
        font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5"
        font-weight="400"
        letter-spacing="0.3em"
        fill="#7aabcf">RESEARCH INSTITUTE</text>

  <!-- Motto centered, italic -->
  <text x="160" y="110"
        text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="10"
        font-style="italic"
        letter-spacing="0.02em"
        fill="#8eafc8">Advancing the Science of State</text>
</svg>
