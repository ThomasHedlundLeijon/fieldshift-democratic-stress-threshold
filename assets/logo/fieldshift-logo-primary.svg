<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="400" height="110" role="img" aria-label="FieldShift Research Institute — Advancing the Science of State">
  <!-- Navy background -->
  <rect width="400" height="110" fill="#0d2247"/>

  <!-- WORDMARK -->
  <!-- "FieldShift" — serif, Field in cream, Shift in gold -->
  <text x="32" y="54"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="38"
        font-weight="700"
        letter-spacing="-0.8"
        fill="#f0ece4">Field<tspan fill="#c9a84c">Shift</tspan></text>

  <!-- "RESEARCH INSTITUTE" — spaced small caps -->
  <text x="34" y="74"
        font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="400"
        letter-spacing="0.28em"
        fill="#7aabcf">RESEARCH INSTITUTE</text>

  <!-- Thin gold rule -->
  <line x1="34" y1="83" x2="366" y2="83" stroke="#c9a84c" stroke-width="0.6" opacity="0.55"/>

  <!-- Motto — italic serif -->
  <text x="34" y="97"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="10"
        font-style="italic"
        letter-spacing="0.02em"
        fill="#8eafc8">Advancing the Science of State</text>
</svg>
