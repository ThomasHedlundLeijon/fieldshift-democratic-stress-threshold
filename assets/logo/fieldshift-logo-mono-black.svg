<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="400" height="110" role="img" aria-label="FieldShift Research Institute">
  <!-- White background -->
  <rect width="400" height="110" fill="#ffffff"/>

  <!-- "FieldShift" — all black -->
  <text x="32" y="54"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="38"
        font-weight="700"
        letter-spacing="-0.8"
        fill="#111111">FieldShift</text>

  <!-- "RESEARCH INSTITUTE" -->
  <text x="34" y="74"
        font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="400"
        letter-spacing="0.28em"
        fill="#4a4a4a">RESEARCH INSTITUTE</text>

  <!-- Rule -->
  <line x1="34" y1="83" x2="366" y2="83" stroke="#111111" stroke-width="0.6" opacity="0.4"/>

  <!-- Motto -->
  <text x="34" y="97"
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="10"
        font-style="italic"
        letter-spacing="0.02em"
        fill="#4a4a4a">Advancing the Science of State</text>
</svg>
